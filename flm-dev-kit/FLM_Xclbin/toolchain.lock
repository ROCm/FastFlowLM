#
# The kernel (xclbin) toolchain, pinned: the exact versions that built every
# xclbin FastFlowLM ships. A newer mlir-aie or Peano can build without an error
# and still produce kernels that compute wrong numbers, so change a value here
# only together with an NPU accuracy run of the kernels it rebuilds.
#
# Read by docker/aie-build.Dockerfile (every KEY below is one of its build
# ARGs) through .github/workflows/devkit-aie-image.yml, which tags the image
# ghcr.io/rocm/fastflowlm/aie-build with a hash of this file and the
# Dockerfile. This file holds only what goes into the image, never the
# image's digest: a digest here would change that hash and fail the
# workflow's every-key-is-an-ARG check. The published digest the kernel builds
# pull (ghcr.io/rocm/fastflowlm/aie-build@sha256:...) goes in toolchain.image
# beside this file, by a pull request after devkit-aie-image.yml publishes.
# docker/aie-build.pdi.sha256 holds what a kernel built in the image must
# reproduce. README.md in this folder gives the same versions for a build
# without the image. Format: KEY=VALUE per line, no quotes, no spaces around
# "="; lines starting with # are comments. A local build:
#
#   docker build -f docker/aie-build.Dockerfile -t aie-build \
#     $(grep -E '^[A-Z0-9_]+=' flm-dev-kit/FLM_Xclbin/toolchain.lock | sed 's/^/--build-arg /') docker

# Base image of both stages: Ubuntu 24.04 (Python 3.12, g++-13), by digest.
UBUNTU_IMAGE=ubuntu:24.04@sha256:73b999393d07f2bf65a40373778a44dc9a6d54ad7718d29247d8ff9413c4d6a8

# The Ubuntu packages that build mlir-aie or run its Python, by exact apt
# version (noble-updates; lld is noble's only build). Ubuntu keeps only the
# newest version in noble-updates, so the image build fails at these pins
# once one is superseded: bump it to the version apt-cache policy shows.
# GCC13 pins g++-13 and gcc-13; PYTHON312 pins python3.12, -dev and -venv.
GCC13_VERSION=13.3.0-6ubuntu2~24.04.1
LLD_VERSION=1:18.0-59~exp2
LLD18_VERSION=1:18.1.3-1ubuntu1
PYTHON312_VERSION=3.12.3-1ubuntu0.17
# zlib1g-dev: the MLIR wheel's LLVM exports link ZLIB::ZLIB, so its CMake
# package needs zlib's development files (CMake generate fails without them).
ZLIB1G_DEV_VERSION=1:1.3.dfsg-3.1ubuntu2.3

# mlir-aie: the FLM fork, built from source with its
# utils/build-mlir-aie-from-wheels.sh. Its python/requirements.txt (exact
# versions) and python/requirements_extras.txt (mlir-python-extras at git
# commit ba2e6fe) are pinned by this commit. REF is informational: the image
# build checks that SHA is still on it (the fork's owner does not rewrite it).
MLIR_AIE_REPO=https://github.com/ngdxzy/mlir-aie
MLIR_AIE_REF=flm_build
MLIR_AIE_SHA=4143812c93bf205250a9b762fb09147410e87558

# The LLVM/MLIR distribution build-mlir-aie-from-wheels.sh builds against: the
# version utils/clone-llvm.sh --get-wheel-version prints at MLIR_AIE_SHA (the
# image build checks they agree), from the mlir-distro release.
MLIR_WHEEL_VERSION=22.0.0.2025090500+064f02da
MLIR_WHEEL_URL=https://github.com/Xilinx/mlir-aie/releases/download/mlir-distro/mlir-22.0.0.2025090500+064f02da-py3-none-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
MLIR_WHEEL_SHA256=44a05e1ffb59c004e0459b15a8fcb3331c1e080b16b8f3c59edfa6e334860784

# The prebuilt mlir_aie wheel installed into ironenv before the source build
# (README.md, step 1), from the latest-wheels-2 release; cp312 for Ubuntu
# 24.04's Python.
MLIR_AIE_WHEEL_VERSION=0.0.1.2025101504+ae29ec5
MLIR_AIE_WHEEL_URL=https://github.com/Xilinx/mlir-aie/releases/download/latest-wheels-2/mlir_aie-0.0.1.2025101504+ae29ec5-cp312-cp312-manylinux_2_35_x86_64.whl
MLIR_AIE_WHEEL_SHA256=54fb1bf62451290f402c96b86d23a01cca09fa5f6ebc402606ed917717baabdd

# The pip ironenv installs everything with (the one IRON's ironenv has).
PIP_VERSION=26.2.1

# Peano (llvm-aie), the AIE core compiler of every ENABLE_CHESSCC=0 build: the
# version IRON's wheel-aie-env action pinned, from the llvm-aie nightly index
# (LLVM_AIE_INDEX, which pip -f would read; the image downloads the wheel by
# URL and checks its digest). The image installs it outside the venv and also
# passes it to the mlir-aie build, so ironenv has no second (older) Peano.
LLVM_AIE_VERSION=22.0.0.2026090201+a36c62b9
LLVM_AIE_INDEX=https://github.com/Xilinx/llvm-aie/releases/expanded_assets/nightly
LLVM_AIE_WHEEL_URL=https://github.com/Xilinx/llvm-aie/releases/download/nightly/llvm_aie-22.0.0.2026090201+a36c62b9-py3-none-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
LLVM_AIE_WHEEL_SHA256=5b76445852a75310b3c5b8304b9f48a71c434452ecc6183b06c34892e6890200

# xclbinutil, which aiecc.py runs from PATH to package the xclbin: XRT's
# libxrt-utils, and the libxrt2 of the same build, from the PPA
# build-container.yml uses for Ubuntu 24.04. The PPA
# keeps only its latest build, so when it moves on the image build fails here
# until this is bumped.
XRT_PPA=ppa:lemonade-team/stable
XRT_UTILS_VERSION=1:2.25.0-4~noble1
