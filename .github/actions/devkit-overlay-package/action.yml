name: Dev-kit overlay package
description: >
  Puts dev-kit engines and kernels over a product portable package on an NPU
  runner, and runs nothing: downloads the package and the
  devkit-libs-<os>-<runtime> and devkit-xclbins artifacts (from this run, or
  from another run of this repository with run-id and github-token, which
  then needs actions: read), unpacks the package as install-package does,
  optionally keeps an untouched copy of it (keep-base, for A/B perf), and
  overlays the engine libraries of the engines serving the families (every
  one, shared units included, when every family is given) and the kernels
  over the package's xclbins/ tree, after checking that the package's
  imports still resolve (.github/script/ci/devkit_overlay.py). Used by
  devkit-bench.yml: nightly over this run's artifacts, on a dispatch over an
  earlier run's; for a pull request's bench (whose packages already hold the
  staged dev-kit files) with no libs, xclbins or families, so it only
  unpacks the package. Needs a checkout of .github/actions, .github/script
  and flm-dev-kit/FLM_DLL.

inputs:
  runtime:
    description: xrt or hrx.
    required: true
  os:
    description: linux or windows; must be the runner's.
    required: true
  package:
    description: The product portable package artifact (portable, HRX-portable, fastflowlm-windows-<sha>, ...).
    required: true
  libs:
    description: The dev-kit engine libraries artifact (devkit-libs-<os>-<runtime>); empty when the engines were not built.
    required: false
    default: ""
  xclbins:
    description: The dev-kit kernels artifact (devkit-xclbins); empty when the kernels were not built.
    required: false
    default: ""
  xclbin-models:
    description: JSON list of the models that got a rebuilt kernel (devkit-xclbins.yml touched-models).
    required: false
    default: "[]"
  families:
    description: Comma-separated families whose engines to overlay (changes.py devkit-families; every family overlays every engine).
    required: false
    default: ""
  new-models:
    description: Comma-separated models the change adds (changes.py new-models), for the test selection outputs.
    required: false
    default: ""
  run-id:
    description: Workflow run to download the artifacts from; empty for this run.
    required: false
    default: ""
  github-token:
    description: Token with actions read on this repository, needed with run-id.
    required: false
    default: ""
  keep-base:
    description: '"true" keeps an unmodified copy of the package (outputs base-flm-bin).'
    required: false
    default: "false"

outputs:
  flm-bin:
    description: Absolute path of the overlaid package's flm binary.
    value: ${{ steps.package.outputs.flm-bin }}
  root:
    description: The overlaid package's root (its xclbins/ is under it).
    value: ${{ steps.linux.outputs.root || steps.windows.outputs.root }}
  base-flm-bin:
    description: With keep-base, the flm binary of the unmodified copy.
    value: ${{ steps.base-linux.outputs.flm-bin || steps.base-windows.outputs.flm-bin }}
  suites:
    description: devkit_overlay.py's test selection (see that script).
    value: ${{ steps.linux.outputs.suites || steps.windows.outputs.suites }}
  families:
    description: devkit_overlay.py's test selection.
    value: ${{ steps.linux.outputs.families || steps.windows.outputs.families }}
  models:
    description: devkit_overlay.py's test selection.
    value: ${{ steps.linux.outputs.models || steps.windows.outputs.models }}
  required:
    description: devkit_overlay.py's test selection.
    value: ${{ steps.linux.outputs.required || steps.windows.outputs.required }}
  test:
    description: '"true" when the overlay leaves something to test.'
    value: ${{ steps.linux.outputs.test || steps.windows.outputs.test }}

runs:
  using: composite
  steps:
    # download-artifact ignores an empty run-id and github-token and then
    # reads this run's artifacts.
    - name: Download package
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.package }}
        path: package
        run-id: ${{ inputs.run-id }}
        github-token: ${{ inputs.github-token }}

    - name: Download dev-kit engines
      if: inputs.libs != ''
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.libs }}
        path: devkit-libs
        run-id: ${{ inputs.run-id }}
        github-token: ${{ inputs.github-token }}

    - name: Download dev-kit kernels
      if: inputs.xclbins != ''
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.xclbins }}
        path: devkit-xclbins
        run-id: ${{ inputs.run-id }}
        github-token: ${{ inputs.github-token }}

    - name: Prepare package
      id: package
      uses: ./.github/actions/install-package
      with:
        kind: portable
        path: package

    - name: Keep the base package (Linux)
      id: base-linux
      if: runner.os == 'Linux' && inputs.keep-base == 'true'
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        FLM_BIN: ${{ steps.package.outputs.flm-bin }}
      run: |
        set -euo pipefail
        base="${GITHUB_WORKSPACE}/flm-base"
        rm -rf "${base}"
        cp -a "$(dirname "${FLM_BIN}")" "${base}"
        echo "flm-bin=${base}/$(basename "${FLM_BIN}")" >> "$GITHUB_OUTPUT"

    - name: Keep the base package (Windows)
      id: base-windows
      if: runner.os == 'Windows' && inputs.keep-base == 'true'
      shell: powershell
      working-directory: ${{ github.workspace }}
      env:
        FLM_BIN: ${{ steps.package.outputs.flm-bin }}
      run: |
        $ErrorActionPreference = "Stop"
        $base = Join-Path $env:GITHUB_WORKSPACE 'flm-base'
        if (Test-Path $base) { Remove-Item $base -Recurse -Force }
        Copy-Item -Recurse (Split-Path $env:FLM_BIN) $base
        [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "flm-bin=$(Join-Path $base (Split-Path $env:FLM_BIN -Leaf))`n")

    # flm reads its kernels from one xclbins/ root, never two merged, so the
    # kernels go over the package's own tree; callers set FLM_XCLBIN_PATH to
    # the root output so a runner-wide setting cannot point flm elsewhere.
    - name: Overlay (Linux)
      id: linux
      if: runner.os == 'Linux'
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        FLM_BIN: ${{ steps.package.outputs.flm-bin }}
        LIBS: ${{ inputs.libs }}
        XCLBINS: ${{ inputs.xclbins }}
        # JSON, so in the environment: PowerShell 5.1 strips the quotes of
        # a native program's argument.
        DEVKIT_XCLBIN_MODELS: ${{ inputs.xclbin-models || '[]' }}
        FAMILIES: ${{ inputs.families }}
        NEW_MODELS: ${{ inputs.new-models }}
        TARGET_OS: ${{ inputs.os }}
        RUNTIME: ${{ inputs.runtime }}
      run: |
        set -euo pipefail
        if [ "${TARGET_OS}" != linux ] || { [ "${RUNTIME}" != xrt ] && [ "${RUNTIME}" != hrx ]; }; then
          echo "::error::os must be the runner's (linux here) and runtime xrt or hrx: got ${TARGET_OS}, ${RUNTIME}"
          exit 1
        fi
        root="$(dirname "${FLM_BIN}")"
        args=(--root "${root}" --os linux --families "${FAMILIES}" --new-models "${NEW_MODELS}"
              --github-output)
        [ -n "${LIBS}" ] && args+=(--libs "${GITHUB_WORKSPACE}/devkit-libs")
        [ -n "${XCLBINS}" ] && args+=(--xclbins "${GITHUB_WORKSPACE}/devkit-xclbins")
        python3 .github/script/ci/devkit_overlay.py "${args[@]}"
        echo "root=${root}" >> "$GITHUB_OUTPUT"

    - name: Overlay (Windows)
      id: windows
      if: runner.os == 'Windows'
      shell: powershell
      working-directory: ${{ github.workspace }}
      env:
        FLM_BIN: ${{ steps.package.outputs.flm-bin }}
        LIBS: ${{ inputs.libs }}
        XCLBINS: ${{ inputs.xclbins }}
        DEVKIT_XCLBIN_MODELS: ${{ inputs.xclbin-models || '[]' }}
        FAMILIES: ${{ inputs.families }}
        NEW_MODELS: ${{ inputs.new-models }}
        TARGET_OS: ${{ inputs.os }}
        RUNTIME: ${{ inputs.runtime }}
      run: |
        if ($env:TARGET_OS -ne 'windows' -or $env:RUNTIME -notin @('xrt', 'hrx')) {
          Write-Host "::error::os must be the runner's (windows here) and runtime xrt or hrx: got $env:TARGET_OS, $env:RUNTIME"
          exit 1
        }
        $root = Split-Path $env:FLM_BIN
        # --opt=value throughout: Windows PowerShell 5.1 drops an empty
        # argument when calling a native program.
        $cmdArgs = @('.github\script\ci\devkit_overlay.py', "--root=$root", '--os=windows',
                     "--families=$env:FAMILIES", "--new-models=$env:NEW_MODELS", '--github-output')
        if ($env:LIBS) { $cmdArgs += "--libs=$(Join-Path $env:GITHUB_WORKSPACE 'devkit-libs')" }
        if ($env:XCLBINS) { $cmdArgs += "--xclbins=$(Join-Path $env:GITHUB_WORKSPACE 'devkit-xclbins')" }
        $env:PYTHONUTF8 = '1'
        & python $cmdArgs
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "root=$root`n")
