name: Dev-kit stage apply
description: >
  Copies a pull request's staged dev-kit engines and kernels over the build's
  checkout before CMake runs, so the package is built from them: the
  devkit-stage-<lin|win>-<xrt|hrx> artifact Build and Test's devkit-stage job
  made (.github/script/ci/devkit_stage.py) holds the files at their
  repository paths (src/lib/<runtime>/..., src/xclbins/<folder>/<slot>) and
  devkit-stage.sha256 listing exactly them. Checked again here before any
  file is copied, with no Python (the Linux builds run in the
  build-environment container): every listed path is an engine library of
  this runtime or a kernel slot, the files present are exactly the listed
  ones, every SHA-256 matches, and no destination is a symbolic link. Nothing
  is committed; the files only reach this job's workspace. Linux (bash, in
  or out of a container) and Windows (PowerShell).

inputs:
  artifact:
    description: The stage artifact, devkit-stage-<lin|win>-<xrt|hrx>.
    required: true

runs:
  using: composite
  steps:
    - name: Download the staged dev-kit files
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.temp }}/devkit-stage

    - name: Stage the dev-kit files (Linux)
      if: runner.os == 'Linux'
      shell: bash
      env:
        ARTIFACT: ${{ inputs.artifact }}
        STAGE: ${{ runner.temp }}/devkit-stage
      run: |
        set -euo pipefail
        case "${ARTIFACT}" in
          devkit-stage-lin-xrt) runtime=xrt ;;
          devkit-stage-lin-hrx) runtime=hrx ;;
          *) echo "::error::${ARTIFACT} is no Linux stage artifact"; exit 1 ;;
        esac
        cd "${STAGE}"
        list=devkit-stage.sha256
        test -f "${list}"
        if [ ! -s "${list}" ]; then
          if [ -n "$(find . ! -path "./${list}" ! -path .)" ]; then echo "::error::${ARTIFACT} holds unlisted files"; exit 1; fi
          echo "Nothing staged for this build."; exit 0
        fi
        # Every listed path: this runtime's engine library, or a kernel slot.
        bad=$(cut -c67- "${list}" | grep -vE "^(src/lib/${runtime}/lib[A-Za-z0-9_+-]+\.so|src/xclbins/[A-Za-z0-9_+-][A-Za-z0-9_.+-]*/[A-Za-z0-9_+-][A-Za-z0-9_.+-]*\.xclbin)$" || true)
        if [ -n "${bad}" ]; then echo "::error::${ARTIFACT} lists paths it may not stage: ${bad}"; exit 1; fi
        # Exactly the listed files, regular ones, and their bytes.
        if [ -n "$(find . ! -type f ! -type d)" ]; then echo "::error::${ARTIFACT} holds a link or special file"; exit 1; fi
        diff <(cut -c67- "${list}" | sort) <(find . -type f ! -path "./${list}" | sed 's|^\./||' | sort)
        sha256sum --check --strict --quiet "${list}"
        count=0
        while read -r path; do
          dest="${GITHUB_WORKSPACE}/${path}"
          part="${GITHUB_WORKSPACE}"
          for seg in ${path//\// }; do
            part="${part}/${seg}"
            if [ -L "${part}" ]; then echo "::error::${path}: ${part} is a symbolic link"; exit 1; fi
          done
          state=replaced; [ -e "${dest}" ] || state=new
          mkdir -p "$(dirname "${dest}")"
          cp -f "${path}" "${dest}"
          echo "${state}: ${path}"
          count=$((count + 1))
        done < <(cut -c67- "${list}")
        echo "Staged ${count} dev-kit file(s) from ${ARTIFACT} into the build's checkout."
        echo "Staged ${count} dev-kit file(s) from \`${ARTIFACT}\` before the build." >> "$GITHUB_STEP_SUMMARY"

    - name: Stage the dev-kit files (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      env:
        ARTIFACT: ${{ inputs.artifact }}
        STAGE: ${{ runner.temp }}\devkit-stage
      run: |
        $ErrorActionPreference = "Stop"
        switch ($env:ARTIFACT) {
          'devkit-stage-win-xrt' { $runtime = 'xrt' }
          'devkit-stage-win-hrx' { $runtime = 'hrx' }
          default { Write-Host "::error::$env:ARTIFACT is no Windows stage artifact"; exit 1 }
        }
        $list = Join-Path $env:STAGE 'devkit-stage.sha256'
        if (-not (Test-Path -LiteralPath $list -PathType Leaf)) { Write-Host "::error::no devkit-stage.sha256"; exit 1 }
        $pattern = "^(src/lib/$runtime/[A-Za-z0-9_+-]+\.(dll|lib)|src/xclbins/[A-Za-z0-9_+-][A-Za-z0-9_.+-]*/[A-Za-z0-9_+-][A-Za-z0-9_.+-]*\.xclbin)$"
        $entries = @()
        foreach ($line in [System.IO.File]::ReadAllLines($list)) {
          if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { Write-Host "::error::bad line in devkit-stage.sha256: $line"; exit 1 }
          $hash = $Matches[1]; $path = $Matches[2]
          if ($path -cnotmatch $pattern) { Write-Host "::error::$env:ARTIFACT lists a path it may not stage: $path"; exit 1 }
          $entries += [pscustomobject]@{ Hash = $hash; Path = $path }
        }
        # Exactly the listed files, regular ones (no reparse points), and their bytes.
        $root = (Resolve-Path -LiteralPath $env:STAGE).Path.TrimEnd('\')
        $items = Get-ChildItem -LiteralPath $root -Recurse -Force
        if ($items | Where-Object { $_.Attributes -band [IO.FileAttributes]::ReparsePoint }) {
          Write-Host "::error::$env:ARTIFACT holds a link"; exit 1
        }
        $present = @($items | Where-Object { -not $_.PSIsContainer } |
          ForEach-Object { $_.FullName.Substring($root.Length + 1).Replace('\', '/') } |
          Where-Object { $_ -ne 'devkit-stage.sha256' } | Sort-Object)
        $listed = @($entries | ForEach-Object { $_.Path } | Sort-Object)
        if (($present -join "`n") -cne ($listed -join "`n")) { Write-Host "::error::$env:ARTIFACT holds other files than it lists"; exit 1 }
        foreach ($e in $entries) {
          $src = Join-Path $root ($e.Path.Replace('/', '\'))
          if ((Get-FileHash -LiteralPath $src -Algorithm SHA256).Hash.ToLower() -ne $e.Hash) {
            Write-Host "::error::$($e.Path) is not the bytes devkit-stage.sha256 lists"; exit 1
          }
        }
        $count = 0
        foreach ($e in $entries) {
          $part = $env:GITHUB_WORKSPACE
          foreach ($seg in $e.Path.Split('/')) {
            $part = Join-Path $part $seg
            if ((Test-Path -LiteralPath $part) -and ((Get-Item -LiteralPath $part -Force).Attributes -band [IO.FileAttributes]::ReparsePoint)) {
              Write-Host "::error::$($e.Path): $part is a link"; exit 1
            }
          }
          $state = if (Test-Path -LiteralPath $part) { 'replaced' } else { 'new' }
          New-Item -ItemType Directory -Force (Split-Path $part) | Out-Null
          Copy-Item -LiteralPath (Join-Path $root ($e.Path.Replace('/', '\'))) -Destination $part -Force
          Write-Host "${state}: $($e.Path)"
          $count++
        }
        Write-Host "Staged $count dev-kit file(s) from $env:ARTIFACT into the build's checkout."
        [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "Staged $count dev-kit file(s) from ``$env:ARTIFACT`` before the build.`n")
