name: NPU test
description: >
  Runs the npu_test suites (.github/script/npu_test) against one flm binary in
  server mode, adds the summary to the job page and uploads the full report.
  Needs .github/script, src/test/openai_api_test, src/test/openai_usage and
  src/test/d3_video/fixtures in the checkout, and Python 3.9+ on the runner
  (standard library only).

inputs:
  flm-bin:
    description: Absolute path of the flm binary to test.
    required: true
  label:
    description: Names this package in the report, e.g. linux-xrt-portable.
    required: true
  tier:
    description: install, pr or full.
    required: true
  suites:
    description: Comma-separated suites, or "all".
    required: false
    default: all
  families:
    description: Comma-separated model families the change touches.
    required: false
    default: ""
  models:
    description: Comma-separated model ids that restrict every suite.
    required: false
    default: ""
  required-models:
    description: >
      Comma-separated model ids the change adds (with backend: adds, republishes or moves onto it):
      tested on every tier, even past models, and downloaded whatever their
      size; the run fails if they are not listed or do not pull, bar one
      larger than max-model-gb, a skip.
    required: false
    default: ""
  backend:
    description: A GPU backend (oga-hipep) whose models to test instead of the NPU models, one per family (every one on the full tier).
    required: false
    default: ""
  max-model-gb:
    description: Skip the models larger than this many GB (catalog size), which the runner's memory cannot hold; 0 for no limit.
    required: false
    default: "0"
  model-extension:
    description: Optional model-extension manifest passed to FLM.
    required: false
    default: ""
  asr-full:
    description: '"true" to run the whole ASR evaluation set on the pr tier.'
    required: false
    default: "false"
  asr-expected-key:
    description: Row of asr_eval/expected.json to check WER against (linux, linux-hrx, windows, windows-hrx).
    required: false
    default: ""
  harness-dir:
    description: >
      Absolute path of a checkout whose .github/script/npu_test to run, with
      the src/test assets it reads beside it (another commit's, e.g. a pull
      request's base); empty for the workspace's.
    required: false
    default: ""
  clean-env:
    description: >
      "true" runs the harness, and so flm, in an emptied environment that
      keeps only PATH, the user's home, temp and locale variables (on Windows
      also the system ones a process needs: SystemRoot, ProgramFiles, ...),
      PYTHONUTF8, the proxy and CA variables (http_proxy, https_proxy,
      no_proxy and their upper-case forms, SSL_CERT_FILE, SSL_CERT_DIR,
      CURL_CA_BUNDLE, REQUESTS_CA_BUNDLE: flm downloads weights through the
      runners' proxy) and every FLM_*, XRT_*, XILINX_* and HRX_* variable: no
      token, runner or GitHub variable reaches the code under test.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # A runner takes one job at a time, so an flm left running from an earlier
    # job's workspace is stale and holds the NPU: a new server then hangs at
    # start. Only processes under the runner's work directory are touched,
    # never one a person started. One that survives SIGKILL is stuck in the
    # NPU driver, and only a reboot frees the runner.
    - name: Clear stale flm processes (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        work="$(dirname "$(dirname "${GITHUB_WORKSPACE}")")"
        stale=$(pgrep -u "$(id -u)" -f "^${work}/.*flm(-real)? serve" || true)
        [ -z "${stale}" ] && exit 0
        echo "::warning::Killing flm left over from an earlier job: $(ps -o pid=,stat=,args= -p ${stale} | tr '\n' ';')"
        kill -9 ${stale} 2>/dev/null || true
        sleep 5
        left=$(ps -o pid=,stat=,args= -p ${stale} 2>/dev/null || true)
        if [ -n "${left}" ]; then
          echo "::error::flm from an earlier job survived SIGKILL and holds the NPU (state D means stuck in the driver); reboot this runner (${RUNNER_NAME}): ${left}"
          exit 1
        fi

    - name: Clear stale flm processes (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        $work = Split-Path (Split-Path $env:GITHUB_WORKSPACE)
        $stale = Get-Process -Name flm -ErrorAction SilentlyContinue |
          Where-Object { $_.Path -and $_.Path.StartsWith($work, [StringComparison]::OrdinalIgnoreCase) }
        if (-not $stale) { exit 0 }
        Write-Host "::warning::Killing flm left over from an earlier job: $($stale | ForEach-Object { "$($_.Id) $($_.Path)" })"
        $stale | Stop-Process -Force -ErrorAction SilentlyContinue
        Start-Sleep -Seconds 5
        $left = $stale | Where-Object { -not $_.HasExited }
        if ($left) {
          Write-Host "::error::flm from an earlier job survived Stop-Process and holds the NPU; reboot this runner ($env:RUNNER_NAME): $($left.Id)"
          exit 1
        }

    # Models persist on the runner between jobs, so only the first job on a
    # runner pays for a download. The harness pulls missing models before the
    # suites, within a time budget on the pr tier (--pull-budget), except the
    # models the change adds (required-models), which it always downloads. A
    # GPU backend run pulls every model it tests, which verifies its files,
    # except one a pull on this runner verified before whose catalog pins and
    # files are unchanged (npu_test/model_cache.py), unless it is required.
    - name: Run tests (Linux)
      id: linux
      if: runner.os == 'Linux'
      shell: bash
      working-directory: ${{ inputs.harness-dir || github.workspace }}/.github/script
      env:
        FLM_BIN: ${{ inputs.flm-bin }}
        LABEL: ${{ inputs.label }}
        TIER: ${{ inputs.tier }}
        SUITES: ${{ inputs.suites }}
        FAMILIES: ${{ inputs.families }}
        MODELS: ${{ inputs.models }}
        REQUIRED_MODELS: ${{ inputs.required-models }}
        BACKEND: ${{ inputs.backend }}
        MAX_MODEL_GB: ${{ inputs.max-model-gb || '0' }}
        MODEL_EXTENSION: ${{ inputs.model-extension }}
        ASR_FULL: ${{ inputs.asr-full }}
        ASR_KEY: ${{ inputs.asr-expected-key }}
        CLEAN_ENV: ${{ inputs.clean-env }}
      run: |
        export FLM_MODEL_PATH="${FLM_MODEL_PATH:-/scratch}"
        args=(--flm-bin "${FLM_BIN}" --label "${LABEL}" --tier "${TIER}" --suites "${SUITES}"
              --families "${FAMILIES}" --models "${MODELS}" --backend "${BACKEND}"
              --required-models "${REQUIRED_MODELS}"
              --max-model-gb "${MAX_MODEL_GB}" --asr-expected-key "${ASR_KEY}"
              --output-dir "${GITHUB_WORKSPACE}/npu-test-results/${LABEL}")
        [ "${ASR_FULL}" = "true" ] && args+=(--asr-full)
        [ -n "${MODEL_EXTENSION}" ] && args+=(--model-extension "${MODEL_EXTENSION}")
        run=(python3)
        if [ "${CLEAN_ENV}" = "true" ]; then
          keep=()
          # Proxy and CA variables too: flm downloads weights with libcurl,
          # which finds the runners' proxy only through them.
          for name in PATH HOME USER LOGNAME LANG LC_ALL LC_CTYPE TMPDIR PYTHONUTF8 \
                      http_proxy https_proxy no_proxy HTTP_PROXY HTTPS_PROXY NO_PROXY \
                      SSL_CERT_FILE SSL_CERT_DIR CURL_CA_BUNDLE REQUESTS_CA_BUNDLE; do
            [ -n "${!name+x}" ] && keep+=("${name}=${!name}")
          done
          while IFS= read -r name; do
            keep+=("${name}=${!name}")
          done < <(compgen -e | grep -E '^(FLM|XRT|XILINX|HRX)_' || true)
          run=(env -i "${keep[@]}" "$(command -v python3)")
          echo "Clean environment: ${keep[*]%%=*}"
        fi
        code=0
        "${run[@]}" -m npu_test "${args[@]}" || code=$?
        echo "code=${code}" >> "$GITHUB_OUTPUT"

    - name: Run tests (Windows)
      id: windows
      if: runner.os == 'Windows'
      shell: powershell
      working-directory: ${{ inputs.harness-dir || github.workspace }}/.github/script
      env:
        FLM_BIN: ${{ inputs.flm-bin }}
        LABEL: ${{ inputs.label }}
        TIER: ${{ inputs.tier }}
        SUITES: ${{ inputs.suites }}
        FAMILIES: ${{ inputs.families }}
        MODELS: ${{ inputs.models }}
        REQUIRED_MODELS: ${{ inputs.required-models }}
        BACKEND: ${{ inputs.backend }}
        MAX_MODEL_GB: ${{ inputs.max-model-gb || '0' }}
        MODEL_EXTENSION: ${{ inputs.model-extension }}
        ASR_FULL: ${{ inputs.asr-full }}
        ASR_KEY: ${{ inputs.asr-expected-key }}
        CLEAN_ENV: ${{ inputs.clean-env }}
      run: |
        if (-not $env:FLM_MODEL_PATH) {
          $env:FLM_MODEL_PATH = Join-Path $env:USERPROFILE ".flm"
          New-Item -ItemType Directory -Force $env:FLM_MODEL_PATH | Out-Null
        }
        # --opt=value throughout: Windows PowerShell 5.1 drops an empty argument
        # when calling a native program, which would leave --families with no
        # value. Model output and transcripts are not all representable in the
        # console code page, so Python (and the test scripts it starts) write UTF-8.
        $env:PYTHONUTF8 = '1'
        $outDir = Join-Path $env:GITHUB_WORKSPACE "npu-test-results\$env:LABEL"
        $cmdArgs = @('-m', 'npu_test', "--flm-bin=$env:FLM_BIN", "--label=$env:LABEL",
                     "--tier=$env:TIER", "--suites=$env:SUITES", "--families=$env:FAMILIES",
                     "--models=$env:MODELS", "--required-models=$env:REQUIRED_MODELS",
                     "--backend=$env:BACKEND", "--max-model-gb=$env:MAX_MODEL_GB",
                     "--asr-expected-key=$env:ASR_KEY", "--output-dir=$outDir")
        if ($env:ASR_FULL -eq 'true') { $cmdArgs += '--asr-full' }
        if ($env:MODEL_EXTENSION) {
          $cmdArgs += "--model-extension=$env:MODEL_EXTENSION"
        }
        if ($env:CLEAN_ENV -eq 'true') {
          $keep = @('Path', 'PATHEXT', 'SystemRoot', 'SystemDrive', 'windir', 'ComSpec', 'OS',
                    'TEMP', 'TMP', 'USERPROFILE', 'USERNAME', 'USERDOMAIN', 'HOMEDRIVE', 'HOMEPATH',
                    'APPDATA', 'LOCALAPPDATA', 'ProgramData', 'ALLUSERSPROFILE', 'PUBLIC',
                    'ProgramFiles', 'ProgramFiles(x86)', 'ProgramW6432', 'CommonProgramFiles',
                    'CommonProgramFiles(x86)', 'CommonProgramW6432', 'COMPUTERNAME',
                    'NUMBER_OF_PROCESSORS', 'PROCESSOR_ARCHITECTURE', 'PROCESSOR_IDENTIFIER',
                    'PYTHONUTF8', 'HTTP_PROXY', 'HTTPS_PROXY', 'NO_PROXY', 'http_proxy',
                    'https_proxy', 'no_proxy', 'SSL_CERT_FILE', 'CURL_CA_BUNDLE',
                    'REQUESTS_CA_BUNDLE')
          $keep += Get-ChildItem env: | Where-Object { $_.Name -match '^(FLM|XRT|XILINX|HRX)_' } |
            ForEach-Object { $_.Name }
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = (Get-Command python).Source
          $psi.WorkingDirectory = (Get-Location).Path
          $psi.UseShellExecute = $false
          $psi.EnvironmentVariables.Clear()
          foreach ($name in $keep) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($null -ne $value) { $psi.EnvironmentVariables[$name] = $value }
          }
          # One command line, quoted as the C runtime splits it.
          $psi.Arguments = ($cmdArgs | ForEach-Object {
            if ($_ -and $_ -notmatch '[\s"]') { $_ }
            else { '"' + (($_ -replace '(\\*)"', '$1$1\"') -replace '(\\+)$', '$1$1') + '"' }
          }) -join ' '
          Write-Host "Clean environment: $(@($psi.EnvironmentVariables.Keys) -join ' ')"
          $proc = [System.Diagnostics.Process]::Start($psi)
          $proc.WaitForExit()
          $code = $proc.ExitCode
        } else {
          & python $cmdArgs
          $code = $LASTEXITCODE
        }
        [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "code=$code`n")
        exit 0

    - name: Add summary (Linux)
      if: always() && runner.os == 'Linux'
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        LABEL: ${{ inputs.label }}
      run: |
        summary="npu-test-results/${LABEL}/summary.md"
        if [ -f "${summary}" ]; then
          cat "${summary}" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "### ❌ ${LABEL}: no report was written" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Add summary (Windows)
      if: always() && runner.os == 'Windows'
      shell: powershell
      working-directory: ${{ github.workspace }}
      env:
        LABEL: ${{ inputs.label }}
      run: |
        $summary = "npu-test-results\$env:LABEL\summary.md"
        $text = if (Test-Path $summary) { Get-Content $summary -Raw -Encoding UTF8 } else { "### ❌ ${env:LABEL}: no report was written`n" }
        [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, $text, [System.Text.UTF8Encoding]::new($false))

    # Server logs included, so a failure can be diagnosed without the runner.
    - name: Upload report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: npu-test-${{ inputs.label }}
        path: npu-test-results/${{ inputs.label }}/
        if-no-files-found: warn
        retention-days: 30

    # Last, so a failed run still gets its summary and report uploaded.
    - name: Fail on test failures (Linux)
      if: runner.os == 'Linux' && steps.linux.outputs.code != '0'
      shell: bash
      env:
        LABEL: ${{ inputs.label }}
      run: |
        echo "::error::NPU tests failed; see the summary and the npu-test-${LABEL} artifact."
        exit 1

    - name: Fail on test failures (Windows)
      if: runner.os == 'Windows' && steps.windows.outputs.code != '0'
      shell: powershell
      env:
        LABEL: ${{ inputs.label }}
      run: |
        Write-Host "::error::NPU tests failed; see the summary and the npu-test-$env:LABEL artifact."
        exit 1
