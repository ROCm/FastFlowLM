name: Detect changes
description: >
  Decides what a Build and Test run does: whether anything beyond docs changed,
  which model families the change touches, whether the ASR code changed, and
  which test tier applies. Needs a checkout with enough history to diff
  (fetch-depth: 0).

inputs:
  tier:
    description: Tier requested by the caller or dispatch; empty picks one from the event.
    required: false
    default: ""

outputs:
  run:
    description: '"true" unless only documentation or flm-dev-kit/ files changed.'
    value: ${{ steps.changes.outputs.run_tests }}
  families:
    description: Comma-separated model families the change touches.
    value: ${{ steps.changes.outputs.families }}
  asr-full:
    description: '"true" when the ASR code changed, so the whole ASR set runs.'
    value: ${{ steps.changes.outputs.asr_full }}
  suites:
    description: >
      "all", "none" when only oga-hipep code or GPU catalog entries changed, or
      the comma-separated npu_test suites the change can affect.
    value: ${{ steps.tier.outputs.suites }}
  hrx-suites:
    description: >
      The suites for the HRX packages: the same, less api and serving, which
      test server logic the backend does not touch. Empty when nothing is left.
    value: ${{ steps.tier.outputs.hrx-suites }}
  source:
    description: '"true" when the chat suite runs, the only suite the models-from-source and model-extension tests run.'
    value: ${{ steps.tier.outputs.source }}
  hipep:
    description: '"true" when every suite runs or the change reaches the model Test Windows HIPEP tests.'
    value: ${{ steps.tier.outputs.hipep }}
  new-models:
    description: >
      Comma-separated NPU models the change adds (or points at new weights):
      every NPU test job tests them, downloading them whatever their size.
    value: ${{ steps.changes.outputs.new_models }}
  new-gpu-models:
    description: The same for oga-hipep models, which Test Windows HIPEP tests.
    value: ${{ steps.changes.outputs.new_gpu_models }}
  devkit:
    description: >
      "true" when a dev-kit job is needed, for the dev-kit jobs: code under
      flm-dev-kit/ changed, a src/lib/xrt file it links changed (libaiebu.a,
      aiebu_static.lib, any library on its engines' -L path), the CI that
      runs the dev-kit jobs changed, or the changed files are unknown.
      flm-dev-kit/ paths never select product builds or suites: a change
      only there gives run "false".
    value: ${{ steps.changes.outputs.devkit }}
  devkit-areas:
    description: >
      Comma-separated dev-kit areas the change touches: xclbin, dll,
      converter, pybind, launchlib, including the areas that build from a
      changed file of another area. Empty when devkit is "false".
    value: ${{ steps.changes.outputs.devkit_areas }}
  devkit-families:
    description: >
      Comma-separated catalog families of the dev-kit engines the change
      touches, for the dev-kit overlay tests: an engine's families and those
      of the engines that use it, from flm-dev-kit/FLM_DLL/engines.json; every
      engine's families when shared engine code, a src/lib/xrt library the
      engines link, the dev-kit CI or an unknown set of files changed. Empty
      when no dev-kit engine is touched.
    value: ${{ steps.changes.outputs.devkit_families }}
  tier:
    description: install, pr or full.
    value: ${{ steps.tier.outputs.tier }}
  short-sha:
    description: First 7 characters of the commit, as the .deb artifact names use it.
    value: ${{ steps.tier.outputs.short-sha }}

runs:
  using: composite
  steps:
    # Pull requests diff their own head against their base, pushes the new tip
    # against the previous one. A pull request's github.sha is the merge with
    # the current main, which would also count whatever landed on main since
    # the base. Everything else (nightly, dispatch, a tag) has no base and
    # tests everything; so does a push that creates a branch, whose "before"
    # is zeros.
    - name: Classify changed files
      id: changes
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'push' && github.ref_type == 'branch' && github.event.before) || '' }}
        HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      run: python3 .github/script/ci/changes.py --base "${BASE}" --head "${HEAD}" --github-output

    - name: Pick tier
      id: tier
      shell: bash
      env:
        REQUESTED: ${{ inputs.tier }}
        EVENT: ${{ github.event_name }}
        SHA: ${{ github.sha }}
        SUITES: ${{ steps.changes.outputs.suites }}
        HIPEP: ${{ steps.changes.outputs.hipep }}
      run: |
        tier="${REQUESTED}"
        if [ -z "${tier}" ]; then
          if [ "${EVENT}" = "schedule" ]; then tier=full; else tier=pr; fi
        fi
        # The nightly and any requested tier test everything, whatever changed.
        suites="${SUITES:-all}"
        [ "${EVENT}" = "pull_request" ] || [ "${EVENT}" = "push" ] || suites=all
        if [ "${suites}" = "all" ]; then
          hrx="chat,prefix_cache,embedding,decision,asr"
        else
          hrx=$(echo "${suites}" | tr ',' '\n' | { grep -vxE 'api|serving|none' || true; } | paste -sd, -)
        fi
        source=false
        { [ "${suites}" = "all" ] || echo ",${suites}," | grep -q ",chat,"; } && source=true
        hipep=false
        { [ "${suites}" = "all" ] || [ "${HIPEP}" = "true" ]; } && hipep=true
        {
          echo "tier=${tier}"
          echo "short-sha=${SHA:0:7}"
          echo "suites=${suites}"
          echo "hrx-suites=${hrx}"
          echo "source=${source}"
          echo "hipep=${hipep}"
        } >> "$GITHUB_OUTPUT"
        echo "Tier: ${tier}; suites: ${suites}; HRX suites: ${hrx:-none}; source tests: ${source}; HIPEP: ${hipep}"
