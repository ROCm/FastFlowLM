  # ── Summary ──────────────────────────────────────────────────────────────

  # On a gated run (pull requests), make summary the one required check: a
  # test job skipped because npu-gate failed or npu-approve was rejected
  # reports "skipped", which branch protection counts as passing.
  summary:
    needs:
      - changes
      - devkit-static
      - npu-gate
      - npu-approve
      - build-lin-xrt-portable
      - build-lin-hrx-portable
      - build-lin-xrt-deb
      - build-lin-hrx-deb
      - build-win-xrt
      - build-win-hrx
      - build-lin-extension-xrt
      - build-lin-extension-hrx
      - build-win-extension-xrt
      - build-win-extension-hrx
      - test-lin-xrt-portable
      - test-lin-hrx-portable
      - test-lin-source-portable
      - test-lin-extension-xrt
      - test-lin-extension-hrx
      - install-lin-xrt-deb
      - install-lin-hrx-deb
      - test-win-xrt
      - test-win-hipep
      - test-win-hrx
      - test-win-source
      - test-win-extension-xrt
      - test-win-extension-hrx
      - install-win-msi
    if: always()
    runs-on: ubuntu-latest
    outputs:
      xrt-passed: ${{ steps.verdict.outputs.xrt }}
      hrx-passed: ${{ steps.verdict.outputs.hrx }}
    steps:
      - name: Checkout scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/script/ci
          filter: blob:none

      - name: Download reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: npu-test-*
          path: reports

      - name: Summarize
        run: python3 .github/script/ci/merge_reports.py reports >> "$GITHUB_STEP_SUMMARY"

      # What release.yml publishes on: every package of a backend built and
      # passed its tests. A test job skipped because the change did not touch
      # its suites counts as passed; one skipped because its build failed does
      # not, since the build's own failure is in the list too.
      - name: Verdict
        id: verdict
        env:
          XRT: >-
            ${{ needs.build-lin-xrt-portable.result }} ${{ needs.build-lin-xrt-deb.result }}
            ${{ needs.build-win-xrt.result }}
            ${{ needs.test-lin-xrt-portable.result }} ${{ needs.test-win-xrt.result }}
            ${{ needs.test-win-hipep.result }}
            ${{ needs.build-lin-extension-xrt.result }} ${{ needs.build-win-extension-xrt.result }}
            ${{ needs.test-lin-extension-xrt.result }} ${{ needs.test-win-extension-xrt.result }}
          HRX: >-
            ${{ needs.build-lin-hrx-portable.result }} ${{ needs.build-lin-hrx-deb.result }}
            ${{ needs.build-win-hrx.result }}
            ${{ needs.test-lin-hrx-portable.result }} ${{ needs.test-win-hrx.result }}
            ${{ needs.build-lin-extension-hrx.result }} ${{ needs.build-win-extension-hrx.result }}
            ${{ needs.test-lin-extension-hrx.result }} ${{ needs.test-win-extension-hrx.result }}
        run: |
          verdict() {
            for result in $1; do
              case "${result}" in success|skipped) ;; *) echo false; return ;; esac
            done
            echo true
          }
          echo "xrt=$(verdict "${XRT}")" >> "$GITHUB_OUTPUT"
          echo "hrx=$(verdict "${HRX}")" >> "$GITHUB_OUTPUT"
          echo "XRT: ${XRT} -> $(verdict "${XRT}")"
          echo "HRX: ${HRX} -> $(verdict "${HRX}")"

      # Fails a gated run whose NPU jobs did not get to run (gate failed or
      # approval rejected) or whose packages did not pass, so the skipped test
      # jobs cannot pass as green. Ungated runs only report the verdict.
      - name: Gate and verdict
        if: github.event_name == 'pull_request' || needs.npu-gate.result != 'skipped'
        env:
          GATE: ${{ needs.npu-gate.result }}
          APPROVE: ${{ needs.npu-approve.result }}
          TRUSTED: ${{ needs.npu-gate.outputs.trusted }}
          XRT_OK: ${{ steps.verdict.outputs.xrt }}
          HRX_OK: ${{ steps.verdict.outputs.hrx }}
        run: |
          echo "npu-gate: ${GATE} (trusted: ${TRUSTED}); npu-approve: ${APPROVE}; xrt: ${XRT_OK}; hrx: ${HRX_OK}"
          case "${GATE}" in success) ;; *) echo "::error::npu-gate did not succeed"; exit 1 ;; esac
          if [ "${TRUSTED}" != true ] && [ "${APPROVE}" != success ] && [ "${APPROVE}" != skipped ]; then
            echo "::error::NPU tests were not approved"; exit 1
          fi
          if [ "${XRT_OK}" != true ] || [ "${HRX_OK}" != true ]; then
            echo "::error::a package failed to build or its tests failed"; exit 1
          fi

      # A pull request whose dev-kit data does not check out fails here too,
      # whatever the gate step above decided, so this job stays the single
      # required check. Other runs only show devkit-static's own result: the
      # dev kit ships in no package, so it does not hold up a release.
      - name: Dev-kit checks
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          DEVKIT_STATIC: ${{ needs.devkit-static.result }}
        run: |
          echo "devkit-static: ${DEVKIT_STATIC}"
          case "${DEVKIT_STATIC}" in success|skipped) ;; *) echo "::error::devkit-static did not pass"; exit 1 ;; esac
