  # ── Dev-kit overlay tests ────────────────────────────────────────────────
  # A pull request's dev-kit engines (devkit-engines) and kernels
  # (devkit-xclbins) over this run's product portable package, on the NPU
  # runners: .github/actions/devkit-npu-overlay replaces the libraries of the
  # engines serving the touched families (all of them, shared units included,
  # when every family is touched) and the rebuilt kernels, checks that the
  # package's imports still resolve, and runs npu_test on the pr tier with
  # the base commit's harness in a clean environment: every model of the
  # touched families (one per family when every family is), the models whose
  # kernels were rebuilt and the models the change adds. A dev-kit-only
  # change builds the four portable packages for this and runs no product
  # suite (changes.py devkit_overlay). summary's Dev-kit checks fails the
  # pull request when one of these fails, or is skipped though requested.

  test-lin-xrt-devkit:
    name: Test Linux XRT dev-kit overlay
    needs: [changes, build-lin-xrt-portable, npu-gate, npu-approve, devkit-engines, devkit-xclbins]
    # Self-hosted: gated as test-lin-xrt-portable (see npu-gate), on pull
    # requests only: pushes and the nightly build the dev kit but test no
    # overlay. Runs when the change touches a dev-kit engine's families or a
    # kernel build rebuilt some model's kernels, once both dev-kit builds
    # that ran passed (a failed one fails summary's Dev-kit checks anyway).
    if: >-
      ${{ !cancelled()
      && ((github.event_name == 'schedule'
           || (github.event_name == 'push'
               && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')))
           || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
          || (needs.npu-gate.result == 'success'
              && (needs.npu-gate.outputs.trusted == 'true' || needs.npu-approve.result == 'success')))
      && needs.changes.result == 'success'
      && github.event_name == 'pull_request'
      && needs.changes.outputs.devkit-overlay == 'true'
      && needs.build-lin-xrt-portable.result == 'success'
      && (needs.devkit-engines.result == 'success' || needs.devkit-engines.result == 'skipped')
      && (needs.devkit-xclbins.result == 'success' || needs.devkit-xclbins.result == 'skipped')
      && (needs.changes.outputs.devkit-families != ''
          || (needs.devkit-xclbins.outputs.touched-models != '' && needs.devkit-xclbins.outputs.touched-models != '[]')) }}
    runs-on: [self-hosted, linux, x64, npu, sweep]
    timeout-minutes: ${{ (needs.changes.outputs.new-models != '' || (needs.devkit-xclbins.outputs.touched-models != '' && needs.devkit-xclbins.outputs.touched-models != '[]')) && 600 || 120 }}
    steps:
      - &checkout-devkit
        name: Checkout overlay scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # As checkout-tests: no token left in .git/config. The npu_test
          # harness runs from the pull request's base (devkit-npu-overlay) so
          # its own harness edits do not judge its binaries. Not a security
          # boundary: the pull request's workflow and actions decide what
          # runs, and npu-approve is the only gate.
          persist-credentials: false
          # Cone mode, directories only: the NPU runners reuse their work
          # folder, whose git config keeps core.sparseCheckoutCone=true from
          # the product test jobs' cone checkouts, and in cone mode a file
          # pattern (flm-dev-kit/FLM_DLL/engines.json) matches nothing.
          sparse-checkout-cone-mode: true
          sparse-checkout: |
            .github/actions
            .github/script
            flm-dev-kit/FLM_DLL
          filter: blob:none
      - name: Overlay and test
        uses: ./.github/actions/devkit-npu-overlay
        with:
          runtime: xrt
          os: linux
          package: portable
          libs: ${{ needs.devkit-engines.result == 'success' && 'devkit-libs-lin-xrt' || '' }}
          xclbins: ${{ needs.devkit-xclbins.result == 'success' && needs.devkit-xclbins.outputs.touched-models != '' && needs.devkit-xclbins.outputs.touched-models != '[]' && 'devkit-xclbins' || '' }}
          xclbin-models: ${{ needs.devkit-xclbins.outputs.touched-models || '[]' }}
          families: ${{ needs.changes.outputs.devkit-families }}
          required-models: ${{ needs.changes.outputs.new-models }}
          harness-ref: ${{ github.event.pull_request.base.sha }}
          label: linux-xrt-devkit

