  test-win-hrx-devkit:
    name: Test Windows HRX dev-kit overlay
    needs: [changes, build-win-hrx, npu-gate, npu-approve, devkit-engines, devkit-xclbins]
    # Self-hosted: gated as test-lin-xrt-devkit.
    if: >-
      ${{ !cancelled()
