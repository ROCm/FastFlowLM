name: Build and Test

# Builds every FastFlowLM package and tests each one on the NPU runners as soon
# as its own build finishes.
#
#   Linux    XRT portable ─ test     HRX portable ─ test     Source portable ─ test
#                └ extension ─ test      └ extension ─ test
#            XRT .deb ─ install test (off)   HRX .deb ─ install test (off)
#   Windows  XRT zip ─ test          HRX zip ─ test          Source zip ─ test
#                └ extension ─ test      └ extension ─ test
#            XRT zip ─ HIPEP test
#            XRT MSI ─ install test (off)
#
# Each package is its own build call, so its tests do not wait on the other
# packages' builds, and XRT and HRX are tested side by side. HRX skips the api
# and serving suites: they test server logic the backend does not touch, and
# the XRT run covers it.
#
# The Windows XRT package also holds the oga-hipep backend, which runs its
# models on the GPU through hip-ep. Test Windows HIPEP runs the chat, api and
# shutdown suites on the oga-hipep models from the same zip, on each kind of
# machine in .github/hipep-machines.json: an STX Halo of its own, beside the
# NPU tests, and whichever shared NPU runner labelled oga-hipep (STX, Krackan
# or STX Halo) is free. Test Windows XRT tests the NPU models.
# HIPEP runs when every suite does, or when a change reaches an oga-hipep
# model (the backend, its catalog entries, the frontend of a family that has
# one, the chat, api and shutdown tests); a change only to the backend or its
# entries runs no NPU test.
#
# A pull request runs only the suites its changes can affect (an ASR-only
# change runs asr, a d3-only change decision); see .github/script/ci/changes.py.
#
# Tiers (.github/script/npu_test/plan.py): pull requests and pushes run the pr
# tier, one model per engine family plus every model of a family the change
# touches; the nightly run tests every model. A model the change adds to
# src/model_list.json, or whose weights it republishes (new files, hashes in
# src/model_info.json, or a raised flm_min_version), is tested whatever its
# size: the test jobs get 600 minutes, of which the new models' downloads get
# up to 420 outside the pr tier's 30-minute budget, and one that does not
# download fails the job. An oga-hipep entry the change adds or edits, new
# weights or not, is required the same way in Test Windows HIPEP, beside its
# models of each family, on the kinds of machine that test changed models
# (the STX Halo). A change that only touches docs builds and tests nothing;
# one only under flm-dev-kit/ (which no product package uses yet) runs no
# product suite and only the dev-kit checks (devkit-static), plus the dev-kit
# engine builds (devkit-engines) when it selects the dll area and the kernel
# builds (devkit-xclbins) when it selects the xclbin area. On a pull request
# whose dev-kit engines or kernels serve some model, the Linux and Windows,
# XRT and HRX portable packages build too, and the dev-kit overlay tests
# (test-*-devkit) run those engines and kernels over them on the NPU runners.
# The portable test jobs and Test Windows HIPEP otherwise get 120 minutes on
# the pr tier and 360 on the full one, which runs every model and every d3
# size and may first download tens of GB of weights.
#
# A dispatch can name the models to test (models, e.g. qwen3.5-oga-hipep:9b):
# every test job then runs only those, so a package without them runs
# nothing. fresh-hip-ep has Test Windows HIPEP install hip-ep from scratch,
# instead of reusing the runner's copy.
#
# release.yml calls this with release: true before publishing a tag.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '17 6 * * *'  # nightly, full tier
  workflow_dispatch:
    inputs:
      tier:
        description: Test tier
        type: choice
        options: [pr, full, install]
        default: pr
      models:
        description: Comma-separated model ids to test instead of the tier's (e.g. qwen3.5-oga-hipep:9b)
        type: string
        default: ''
      fresh-hip-ep:
        description: Install hip-ep from scratch in Test Windows HIPEP
        type: boolean
        default: false
  workflow_call:
    inputs:
      tier:
        description: Test tier (install, pr or full).
        type: string
        default: pr
      release:
        description: Build and test only what a release ships (no models-from-source, no model-extension fixture).
        type: boolean
        default: false
    outputs:
      xrt-passed:
        description: '"true" when every XRT package built and passed its tests.'
        value: ${{ jobs.summary.outputs.xrt-passed }}
      hrx-passed:
        description: '"true" when every HRX package built and passed its tests.'
        value: ${{ jobs.summary.outputs.hrx-passed }}
      deb-distros:
        description: How many distributions each .deb variant was built for.
        value: ${{ jobs.build-lin-xrt-deb.outputs.deb_distros }}

# The token is read-only unless a job says otherwise: pull requests run code
# from their branch, some of it on the self-hosted NPU runners. Jobs that call
# lin-build.yml or model-extension-build.yml also get packages: read, to pull
# the build-environment container from GHCR; nothing here pushes, comments or
# releases (release.yml's publish jobs grant themselves contents: write). A
# called workflow can only narrow what its caller job grants. Artifacts and
# caches use the runtime token, not this one, and need no grant.
permissions:
  contents: read

# A superseded pull request commit only holds the NPU and HIPEP runners up, so
# a new push cancels its run. Pushes to main, nightly runs and tags each get
# their own group and always finish.
concurrency:
  group: build-and-test-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.detect.outputs.run }}
      families: ${{ steps.detect.outputs.families }}
      asr-full: ${{ steps.detect.outputs.asr-full }}
      tier: ${{ steps.detect.outputs.tier }}
      short-sha: ${{ steps.detect.outputs.short-sha }}
      suites: ${{ steps.detect.outputs.suites }}
      hrx-suites: ${{ steps.detect.outputs.hrx-suites }}
      source: ${{ steps.detect.outputs.source }}
      hipep: ${{ steps.detect.outputs.hipep }}
      hipep-machines: ${{ steps.hipep.outputs.machines }}
      new-models: ${{ steps.detect.outputs.new-models }}
      # For the dev-kit jobs. flm-dev-kit/ paths select no product suite,
      # only the portable builds the overlay tests start from
      # (devkit-overlay); see .github/script/ci/changes.py.
      devkit: ${{ steps.detect.outputs.devkit }}
      devkit-areas: ${{ steps.detect.outputs.devkit-areas }}
      devkit-families: ${{ steps.detect.outputs.devkit-families }}
      devkit-overlay: ${{ steps.detect.outputs.devkit-overlay }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Detect changes
        id: detect
        uses: ./.github/actions/detect-changes
        with:
          tier: ${{ inputs.tier }}

      # One Test Windows HIPEP job per kind of GPU machine, each with the tier
      # it runs and the changed models it tests. The repository variable
      # FLM_HIPEP_MACHINES names other kinds, or "none", without a commit,
      # e.g. while a kind's only runner is down.
      - name: Pick HIPEP machines
        id: hipep
        env:
          ONLY: ${{ vars.FLM_HIPEP_MACHINES }}
          TIER: ${{ steps.detect.outputs.tier }}
          CHANGED: ${{ steps.detect.outputs.hipep-models }}
        run: |
          python3 .github/script/ci/hipep_machines.py --tier "${TIER}" --changed-models "${CHANGED}" \
            --only "${ONLY}" --github-output

      # Every npu_test run imports every suite, but a change to the shutdown
      # suite or console.py runs Test Windows HIPEP alone. A Windows-only
      # import there would break the Linux NPU jobs unseen until a change that
      # runs them, so load the whole package on Linux here on every run.
      - name: Check npu_test imports on Linux
        working-directory: .github/script
        run: python3 -m npu_test --help > /dev/null

      # The change-detection tests, including the ones that check its engine
      # table and the pr tier's model table against src/model_list.json, so a
      # model family added without them fails here, not silently later.
      - name: Test change detection and the test plan
        working-directory: .github/script
        run: python3 -m unittest discover -s ci -p 'test_*.py' -t ci

  # Static checks of the dev kit's CI data (flm-dev-kit/FLM_Xclbin/
  # kernel_assignment.json and build_units.json, flm-dev-kit/FLM_DLL/
  # engines.json, the -Bsymbolic-functions link flag, and on a pull request
  # the copyright notice of every source file it adds under flm-dev-kit/).
  # Standard-library Python on a hosted runner; its unit tests run in changes.
  devkit-static:
    needs: changes
    if: needs.changes.outputs.devkit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Check the dev kit
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/script/ci/devkit_check.py --base "${BASE}" --head "${HEAD}"

  # The dev kit's engine libraries (flm-dev-kit/FLM_DLL), built for Linux and
  # Windows, XRT and HRX, on hosted runners (devkit-engines.yml): when a change
  # selects the dll dev-kit area, and on every push to main and nightly run so
  # main stays green. Not for a release: the dev kit ships in no package.
  # packages: read pulls the build-environment container.
  devkit-engines:
    needs: changes
    if: >-
      ${{ !inputs.release && (github.event_name == 'schedule'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || contains(format(',{0},', needs.changes.outputs.devkit-areas), ',dll,')) }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/devkit-engines.yml

  # The dev kit's NPU kernels (flm-dev-kit/FLM_Xclbin), built with Peano in
  # the aie-build image on hosted runners (devkit-xclbins.yml): on a pull
  # request that selects the xclbin dev-kit area, the builds its changes
  # touch (mode changed, diffed like changes.py from the merge base of the
  # pull request's base and head); on every push to main, every kernel the
  # product ships (assigned); nightly, every build (all); on any other run
  # that selects the area (workflow_dispatch: no base to diff), assigned.
  # Not for a release.
  # packages: read pulls the image from GHCR.
  devkit-xclbins:
    needs: changes
    if: >-
      ${{ !inputs.release && (github.event_name == 'schedule'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || contains(format(',{0},', needs.changes.outputs.devkit-areas), ',xclbin,')) }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/devkit-xclbins.yml
    with:
      # changed only on a pull request, the one event with a base to diff;
      # any other run that gets here (workflow_dispatch) builds what ships.
      mode: >-
        ${{ github.event_name == 'pull_request' && 'changed'
        || github.event_name == 'schedule' && 'all'
        || 'assigned' }}
      base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
      head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  # ── NPU approval gate ────────────────────────────────────────────────────
  # The NPU runners are few and self-hosted, so no job lands on them unless
  # the run is ungated or npu-gate succeeded and either it found the run
  # trusted or npu-approve was approved by one of the npu-approval
  # environment's reviewers. Builds on hosted runners still start right away.
  # Ungated: nightly, a push to main or a tag (release.yml), and a dispatch on
  # main (also release.yml's). Everything else is gated: pull requests, and a
  # dispatch of this workflow or release.yml on any other branch or tag.
  #
  # This gate is defense in depth, not the boundary: a pull request runs this
  # file and ./.github/actions from its own merge commit, so it can edit the
  # gate away. What holds regardless are repository settings: fork pull
  # request workflows need approval for all external contributors, the npu
  # and sweep runners are in a runner group limited to this repository, and
  # a tag ruleset limits who can push tags. Do not limit the runner group to
  # workflows on refs/heads/main: a pull request's workflow ref is
  # refs/pull/<n>/merge, so that blocks every pull request's NPU jobs.
  #
  # npu-gate runs on every gated run, whatever changed, so a self-hosted job
  # can require its success: a skipped gate never counts as passed.
  # Trusted means: on a pull request, the author and whoever triggered this
  # run (a push by someone else to the branch, or "Re-run all jobs") are on
  # the list, and the branch is in this repository, not a fork; on a gated
  # dispatch, whoever dispatched it is on the list. Trust covers whoever
  # triggered this run, not every commit's author: an untrusted user's commit
  # on a trusted author's branch runs unapproved once a trusted user triggers
  # the next run. "Re-run failed jobs" and single-job re-runs keep the
  # original run's npu-gate and npu-approve results, so the re-runner is not
  # checked (the commit is the same, so no new code runs).
  #
  # The npu-approval environment's reviewers are a separate list, kept by
  # repository admins; it should prevent self-review and not let admins
  # bypass it.
  npu-gate:
    if: >-
      ${{ !(github.event_name == 'schedule'
           || (github.event_name == 'push'
               && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')))
           || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    outputs:
      trusted: ${{ steps.trust.outputs.trusted }}
    env:
      # The one list of trusted logins, for both checks below.
      NPU_TRUSTED: '["zaneni6", "michyu-amd", "tawei-amd", "alfxu-amd", "shdu-amd"]'
    steps:
      - name: Check whether the run is trusted
        id: trust
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ACTOR: ${{ github.triggering_actor }}
          AUTHOR_TRUSTED: ${{ contains(fromJSON(env.NPU_TRUSTED), github.event.pull_request.user.login) }}
          ACTOR_TRUSTED: ${{ contains(fromJSON(env.NPU_TRUSTED), github.triggering_actor) }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          trusted=false
          if [ "${IS_PR}" = "true" ]; then
            if [ "${AUTHOR_TRUSTED}" = "true" ] && [ "${ACTOR_TRUSTED}" = "true" ] && [ "${SAME_REPO}" = "true" ]; then
              trusted=true
            fi
            echo "Author ${AUTHOR} trusted: ${AUTHOR_TRUSTED}; triggered by ${ACTOR}, trusted: ${ACTOR_TRUSTED};" \
                 "branch in this repository: ${SAME_REPO} -> trusted: ${trusted}"
          else
            # A gated dispatch (or push) has no author or fork: the one
            # triggering it decides.
            if [ "${ACTOR_TRUSTED}" = "true" ]; then trusted=true; fi
            echo "${GITHUB_EVENT_NAME} on ${GITHUB_REF} by ${ACTOR}, trusted: ${trusted}"
          fi
          echo "trusted=${trusted}" >> "$GITHUB_OUTPUT"

  # The approval path for a gated run that is not trusted, asked only when
  # a package is built and some NPU job would run (the conditions below are
  # those of the self-hosted jobs; a job added there must be added here, or it
  # will not run for such pull requests). Approval holds for one run: every
  # new push asks again. Approvers must review the pull request's .github/
  # changes: its workflow and actions decide what runs on the runners (the
  # dev-kit overlay tests run the base's npu_test harness, but through the
  # pull request's actions, so that is no boundary). A pull request that
  # selects the xclbin area asks for approval before the kernel build has
  # said whether any model's kernel was rebuilt; when none was, no overlay
  # test runs and summary does not need the approval.
  npu-approve:
    needs: [changes, npu-gate]
    if: >-
      needs.npu-gate.outputs.trusted != 'true'
      && ((needs.changes.outputs.run == 'true'
           && (needs.changes.outputs.suites != 'none'
               || needs.changes.outputs.hrx-suites != ''
               || needs.changes.outputs.source == 'true'
               || (needs.changes.outputs.hipep == 'true' && needs.changes.outputs.hipep-machines != '[]')
               || vars.FLM_INSTALL_TESTS == 'true'))
          || (github.event_name == 'pull_request' && needs.changes.outputs.devkit-overlay == 'true'))
    runs-on: ubuntu-latest
    environment: npu-approval
    steps:
      - env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          ACTOR: ${{ github.triggering_actor }}
        run: >-
          echo "NPU tests approved for ${GITHUB_EVENT_NAME} on ${GITHUB_REF}
          (pull request author ${PR_AUTHOR:-none}), run triggered by ${ACTOR}."

  # ── Linux builds ─────────────────────────────────────────────────────────

  build-lin-xrt-portable:
    name: Linux XRT portable
    needs: changes
    # Also the base of the dev-kit overlay tests (test-*-devkit).
    if: >-
      needs.changes.outputs.run == 'true'
      || (github.event_name == 'pull_request' && needs.changes.outputs.devkit-overlay == 'true')
    permissions:
      contents: read
      packages: read  # the build-environment container on GHCR
    uses: ./.github/workflows/lin-build.yml
    with:
      variants: XRT-portable

  build-lin-hrx-portable:
    name: Linux HRX portable
    needs: changes
    # Also the base of the dev-kit overlay tests (test-*-devkit).
    if: >-
      needs.changes.outputs.run == 'true'
      || (github.event_name == 'pull_request' && needs.changes.outputs.devkit-overlay == 'true')
    permissions:
      contents: read
      packages: read  # the build-environment container on GHCR
    uses: ./.github/workflows/lin-build.yml
    with:
      variants: HRX-portable

  # The models-from-source builds are only tested when the chat suite runs, so
  # they are only built then.
  build-lin-source-portable:
    name: Linux models-from-source portable
    needs: changes
    if: needs.changes.outputs.run == 'true' && needs.changes.outputs.source == 'true' && !inputs.release
    permissions:
      contents: read
      packages: read  # the build-environment container on GHCR
    uses: ./.github/workflows/lin-build.yml
    with:
      variants: Source-portable

  build-lin-xrt-deb:
    name: Linux XRT .deb
    needs: changes
    if: needs.changes.outputs.run == 'true'
    permissions:
      contents: read
      packages: read  # the build-environment container on GHCR
    uses: ./.github/workflows/lin-build.yml
    with:
      variants: XRT-deb

  build-lin-hrx-deb:
    name: Linux HRX .deb
    needs: changes
    if: needs.changes.outputs.run == 'true'
    permissions:
      contents: read
      packages: read  # the build-environment container on GHCR
    uses: ./.github/workflows/lin-build.yml
    with:
      variants: HRX-deb

  # ── Windows builds ───────────────────────────────────────────────────────

  build-win-xrt:
    name: Windows XRT
    needs: changes
    # Also the base of the dev-kit overlay tests (test-*-devkit).
    if: >-
      needs.changes.outputs.run == 'true'
      || (github.event_name == 'pull_request' && needs.changes.outputs.devkit-overlay == 'true')
    uses: ./.github/workflows/win-build.yml
    with:
      variants: XRT
      # Not when built only for the dev-kit overlay: nothing installs it then.
      msi: ${{ needs.changes.outputs.run == 'true' }}

  build-win-hrx:
    name: Windows HRX
    needs: changes
    # Also the base of the dev-kit overlay tests (test-*-devkit).
    if: >-
      needs.changes.outputs.run == 'true'
      || (github.event_name == 'pull_request' && needs.changes.outputs.devkit-overlay == 'true')
    uses: ./.github/workflows/win-build.yml
    with:
      variants: HRX
      msi: false

  build-win-source:
    name: Windows models-from-source
    needs: changes
    if: needs.changes.outputs.run == 'true' && needs.changes.outputs.source == 'true' && !inputs.release
    uses: ./.github/workflows/win-build.yml
    with:
      variants: Source
      msi: false

  # ── Model extensions ─────────────────────────────────────────────────────
  # The Gemma4-open bundles build against the SDK in their package once it
  # exists, outside the package build, so a failure here holds back no package
  # or NPU test, only the verdict. A release run skips them, like the
  # models-from-source builds: a fixture-only break (rustup, a submodule fetch)
  # should not hold a release that pull requests already tested. The
  # model-extension contracts need no package and run in cpu-tests.yml.

  build-lin-extension-xrt:
    name: Linux XRT model extension
    needs: [changes, build-lin-xrt-portable]
    if: needs.changes.outputs.source == 'true' && !inputs.release
    permissions:
      contents: read
      packages: read  # the build-environment container on GHCR
    uses: ./.github/workflows/model-extension-build.yml
    with:
      os: linux
      runtime: XRT
      package: portable

  build-lin-extension-hrx:
    name: Linux HRX model extension
    needs: [changes, build-lin-hrx-portable]
    if: needs.changes.outputs.source == 'true' && !inputs.release
    permissions:
      contents: read
      packages: read  # the build-environment container on GHCR
    uses: ./.github/workflows/model-extension-build.yml
    with:
      os: linux
      runtime: HRX
      package: HRX-portable

  build-win-extension-xrt:
    name: Windows XRT model extension
    needs: [changes, build-win-xrt]
    if: needs.changes.outputs.source == 'true' && !inputs.release
    permissions:
      contents: read
      packages: read  # the build-environment container on GHCR
    uses: ./.github/workflows/model-extension-build.yml
    with:
      os: windows
      runtime: XRT
      package: fastflowlm-windows-${{ github.sha }}

  build-win-extension-hrx:
    name: Windows HRX model extension
    needs: [changes, build-win-hrx]
    if: needs.changes.outputs.source == 'true' && !inputs.release
    permissions:
      contents: read
      packages: read  # the build-environment container on GHCR
    uses: ./.github/workflows/model-extension-build.yml
    with:
      os: windows
      runtime: HRX
      package: HRX-fastflowlm-windows-${{ github.sha }}

  # ── Linux tests ──────────────────────────────────────────────────────────
  # Only the test scripts and their assets are checked out, never the sources:
  # these jobs run a prebuilt package and compile nothing.

  test-lin-xrt-portable:
    name: Test Linux XRT portable
    needs: [changes, build-lin-xrt-portable, npu-gate, npu-approve]
    # Self-hosted: ungated only for nightly, a push to main or a tag, and a
    # dispatch on main; otherwise npu-gate must have succeeded and found the
    # run trusted, or npu-approve must have been approved (see npu-gate).
    # npu-approve is skipped for trusted ones, so spell out what the implicit
    # success() check would require.
    if: >-
      ${{ !cancelled()
      && ((github.event_name == 'schedule'
           || (github.event_name == 'push'
               && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')))
           || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
          || (needs.npu-gate.result == 'success'
              && (needs.npu-gate.outputs.trusted == 'true' || needs.npu-approve.result == 'success')))
      && needs.changes.result == 'success'
      && needs.build-lin-xrt-portable.result == 'success'
      && (needs.changes.outputs.suites != 'none') }}
    runs-on: [self-hosted, linux, x64, npu, sweep]
    timeout-minutes: ${{ needs.changes.outputs.new-models != '' && 600 || needs.changes.outputs.tier == 'full' && 360 || 120 }}
    steps:
      - &checkout-tests
        name: Checkout test scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Self-hosted runners outlive the job: leave no token in .git/config
          # for the pull request's code to find. Nothing here fetches again.
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            .github/script
            src/test/openai_api_test
            src/test/openai_usage
            src/test/d3_video/fixtures
          filter: blob:none
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: portable
          path: package
      - name: Prepare package
        id: package
        uses: ./.github/actions/install-package
