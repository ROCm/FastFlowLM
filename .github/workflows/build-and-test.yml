          name: gemma4-open-windows-xrt
          path: model-extension
      - name: Prepare package
        id: package
        uses: ./.github/actions/install-package
        with:
          kind: portable
          path: package
      - name: Test
        uses: ./.github/actions/npu-test
        with:
          flm-bin: ${{ steps.package.outputs.flm-bin }}
          label: windows-xrt-model-extension
          tier: ${{ needs.changes.outputs.tier }}
          suites: chat
          models: gemma4-open-it:e2b
          model-extension: ${{ github.workspace }}/model-extension/extension.json

  test-win-extension-hrx:
    name: Test Windows HRX model extension
    needs: [changes, build-win-hrx, build-win-extension-hrx, npu-gate, npu-approve]
    # Self-hosted: gated as test-lin-xrt-portable (see npu-gate).
    if: >-
      ${{ !cancelled()
      && ((github.event_name == 'schedule'
           || (github.event_name == 'push'
               && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')))
           || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
          || (needs.npu-gate.result == 'success'
              && (needs.npu-gate.outputs.trusted == 'true' || needs.npu-approve.result == 'success')))
      && needs.changes.result == 'success'
      && needs.build-win-hrx.result == 'success'
      && needs.build-win-extension-hrx.result == 'success'
      && (needs.changes.outputs.source == 'true') }}
    runs-on: [self-hosted, windows, x64, npu, sweep]
    timeout-minutes: 60
    steps:
      - *checkout-tests
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: HRX-fastflowlm-windows-${{ github.sha }}
          path: package
      - name: Download model extension
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gemma4-open-windows-hrx
          path: model-extension
      - name: Prepare package
        id: package
        uses: ./.github/actions/install-package
        with:
          kind: portable
          path: package
      - name: Test
        uses: ./.github/actions/npu-test
        with:
          flm-bin: ${{ steps.package.outputs.flm-bin }}
          label: windows-hrx-model-extension
          tier: ${{ needs.changes.outputs.tier }}
          suites: chat
          models: gemma4-open-it:e2b
          model-extension: ${{ github.workspace }}/model-extension/extension.json

  install-win-msi:
    name: Install test Windows MSI
    needs: [changes, build-win-xrt, npu-gate, npu-approve]
    # Self-hosted: gated as test-lin-xrt-portable (see npu-gate).
    if: >-
      ${{ !cancelled()
      && ((github.event_name == 'schedule'
           || (github.event_name == 'push'
               && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')))
           || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
          || (needs.npu-gate.result == 'success'
              && (needs.npu-gate.outputs.trusted == 'true' || needs.npu-approve.result == 'success')))
      && needs.changes.result == 'success'
      && needs.build-win-xrt.result == 'success'
      && needs.changes.outputs.run == 'true'
      && (vars.FLM_INSTALL_TESTS == 'true') }}
    runs-on: [self-hosted, windows, x64, npu, sweep]
    timeout-minutes: 60
    steps:
      - *checkout-tests
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fastflowlm-windows-msi-${{ github.sha }}
          path: package
      - name: Install package
        id: package
        uses: ./.github/actions/install-package
        with:
          kind: msi
          path: package
      - name: Test
        uses: ./.github/actions/npu-test
        with:
          flm-bin: ${{ steps.package.outputs.flm-bin }}
          label: windows-msi-${{ steps.package.outputs.mode }}
          tier: install
      - name: Remove package
        if: always()
        uses: ./.github/actions/remove-package
        with:
          kind: msi
          mode: ${{ steps.package.outputs.mode }}
          path: package

  # ── Dev-kit benches ──────────────────────────────────────────────────────
  # Perf (flm bench) and GSM8K accuracy (devkit-bench.yml, which documents
  # them), on the NPU sweep runners: on a pull request whose dev-kit engine
  # or kernel source changed (changes devkit-bench; never for docs or CI
  # alone) and that staged something, of its own portable packages, which
  # hold the staged files: the pull request's numbers only, no A/B against
  # a base package and no nightly-baseline comparison (a comparison is to be
  # designed later). The dev-kit full refresh benches every benchable model
  # on the four runtimes (mode refresh): this run's numbers, no A/B and no
  # baseline comparison. Nightly, devkit-bench-nightly below. Not on
  # pushes, other dispatches or a release. Gated as the NPU test jobs
  # (npu-gate, npu-approve: devkit-bench implies devkit-stage, so
  # npu-approve already asks for it). Waits for the portable test jobs, so
  # the benches do not take the sweep runners from them. The resolve job
  # inside decides per runtime from the build results passed here; a failed
  # build leaves its runtime out. summary's Dev-kit checks fails a pull
  # request only when a model failed acc_common's hard gate (the bench's
  # hard-gate output); any other bench failure (perf giving no result, a
  # pull, a timeout, the GitHub API) only warns there, and devkit_swap.py
  # fetch does not count it either. summary, the required check, waits for
  # the benches, so a bench pull request's check takes as long as its
  # benches (three at a time, up to 150 minutes each).
  # devkit-bench-comment.yml posts the results on the pull request.
  # actions: read: devkit-bench.yml reads artifacts of this run.
  devkit-bench:
    needs:
      - changes
      - npu-gate
      - npu-approve
      - devkit-engines
      - devkit-xclbins
      - build-lin-xrt-portable
      - build-lin-hrx-portable
      - build-win-xrt
      - build-win-hrx
      - devkit-stage
      - test-lin-xrt-portable
      - test-lin-hrx-portable
      - test-win-xrt
      - test-win-hrx
    if: >-
      ${{ github.event_name != 'schedule' && !cancelled() && !inputs.release
      && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
          || (needs.npu-gate.result == 'success'
              && (needs.npu-gate.outputs.trusted == 'true' || needs.npu-approve.result == 'success')))
      && needs.changes.result == 'success'
      && (needs.changes.outputs.devkit-full-refresh == 'true'
          || (github.event_name == 'pull_request' && needs.changes.outputs.devkit-bench == 'true'
              && needs.devkit-stage.outputs.staged == 'true')) }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/devkit-bench.yml
    with:
      mode: ${{ needs.changes.outputs.devkit-full-refresh == 'true' && 'refresh' || 'pr' }}
      head-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      builds: >-
        lin-xrt=${{ needs.build-lin-xrt-portable.result }},lin-hrx=${{ needs.build-lin-hrx-portable.result }},win-xrt=${{ needs.build-win-xrt.result }},win-hrx=${{ needs.build-win-hrx.result }}
      # The dev-kit builds staged into the packages.
      engines: ${{ needs.devkit-engines.result }}
      families: ${{ github.event_name == 'pull_request' && needs.changes.outputs.devkit-families || '' }}
      xclbin-models: ${{ needs.devkit-xclbins.outputs.touched-models || '[]' }}
      bench-models: ${{ github.event_name == 'pull_request' && needs.devkit-xclbins.outputs.bench-models || '' }}
      xclbins: >-
        ${{ needs.devkit-xclbins.result == 'success' && needs.devkit-xclbins.outputs.touched-models != ''
        && needs.devkit-xclbins.outputs.touched-models != '[]' && 'devkit-xclbins' || '' }}

  # The nightly benches (devkit-bench.yml mode nightly): of the -main dev-kit
  # builds, over every engine and the assigned set, over the nightly's
  # packages, only when that source changed since the commit of the latest
  # nightly baseline, uploading the next baseline. A job of its own so it
  # does not wait for the product test jobs (needs cannot depend on the
  # event): it runs beside the full-tier product tests on the same sweep
  # runners (each job has its own runner, so the numbers are not affected;
  # the night's queue is longer). Mutually exclusive with devkit-bench, so
  # one run calls devkit-bench.yml at most once (devkit_check.py's bench
  # comment rule).
  # actions: read: the nightly baseline is another run's artifact.
  devkit-bench-nightly:
    needs:
      - changes
      - devkit-engines-main
      - devkit-xclbins-main
      - build-lin-xrt-portable
      - build-lin-hrx-portable
      - build-win-xrt
      - build-win-hrx
    if: ${{ github.event_name == 'schedule' && !cancelled() && !inputs.release && needs.changes.result == 'success' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/devkit-bench.yml
    with:
      mode: nightly
      head-sha: ${{ github.sha }}
      builds: >-
        lin-xrt=${{ needs.build-lin-xrt-portable.result }},lin-hrx=${{ needs.build-lin-hrx-portable.result }},win-xrt=${{ needs.build-win-xrt.result }},win-hrx=${{ needs.build-win-hrx.result }}
      engines: ${{ needs.devkit-engines-main.result }}
      families: ''
      xclbin-models: ${{ needs.devkit-xclbins-main.outputs.touched-models || '[]' }}
      bench-models: ''
      xclbins: >-
        ${{ needs.devkit-xclbins-main.result == 'success' && needs.devkit-xclbins-main.outputs.touched-models != ''
        && needs.devkit-xclbins-main.outputs.touched-models != '[]' && 'devkit-xclbins' || '' }}

  # ── Summary ──────────────────────────────────────────────────────────────

  # On a gated run (pull requests), make summary the one required check: a
  # test job skipped because npu-gate failed or npu-approve was rejected
  # reports "skipped", which branch protection counts as passing.
  summary:
    needs:
      - changes
      - devkit-static
      - devkit-engines
      - devkit-xclbins
      - devkit-engines-main
      - devkit-xclbins-main
      - npu-gate
      - npu-approve
      - build-lin-xrt-portable
      - build-lin-hrx-portable
      - build-lin-xrt-deb
      - build-lin-hrx-deb
      - build-win-xrt
      - build-win-hrx
      - build-lin-extension-xrt
      - build-lin-extension-hrx
      - build-win-extension-xrt
      - build-win-extension-hrx
      - test-lin-xrt-portable
      - test-lin-hrx-portable
      - test-lin-source-portable
      - test-lin-extension-xrt
      - test-lin-extension-hrx
      - install-lin-xrt-deb
      - install-lin-hrx-deb
      - test-win-xrt
      - test-win-hipep
      - test-win-hrx
      - test-win-source
      - test-win-extension-xrt
      - test-win-extension-hrx
      - install-win-msi
      - devkit-stage
      - devkit-bench
      - devkit-bench-nightly
    if: always()
    runs-on: ubuntu-latest
    outputs:
      xrt-passed: ${{ steps.verdict.outputs.xrt }}
      hrx-passed: ${{ steps.verdict.outputs.hrx }}
    steps:
      # History, trees only (blob:none): devkit_swap.py pending compares the
      # staged files' blob ids with the branch's and names a swap CI change.
      - name: Checkout scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/script/ci
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Download reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: npu-test-*
          path: reports

      - name: Summarize
        run: python3 .github/script/ci/merge_reports.py reports >> "$GITHUB_STEP_SUMMARY"

      # What release.yml publishes on: every package of a backend built and
      # passed its tests. A test job skipped because the change did not touch
      # its suites counts as passed; one skipped because its build failed does
      # not, since the build's own failure is in the list too.
      - name: Verdict
        id: verdict
        env:
          XRT: >-
            ${{ needs.build-lin-xrt-portable.result }} ${{ needs.build-lin-xrt-deb.result }}
            ${{ needs.build-win-xrt.result }}
            ${{ needs.test-lin-xrt-portable.result }} ${{ needs.test-win-xrt.result }}
            ${{ needs.test-win-hipep.result }}
            ${{ needs.build-lin-extension-xrt.result }} ${{ needs.build-win-extension-xrt.result }}
            ${{ needs.test-lin-extension-xrt.result }} ${{ needs.test-win-extension-xrt.result }}
          HRX: >-
            ${{ needs.build-lin-hrx-portable.result }} ${{ needs.build-lin-hrx-deb.result }}
            ${{ needs.build-win-hrx.result }}
            ${{ needs.test-lin-hrx-portable.result }} ${{ needs.test-win-hrx.result }}
            ${{ needs.build-lin-extension-hrx.result }} ${{ needs.build-win-extension-hrx.result }}
            ${{ needs.test-lin-extension-hrx.result }} ${{ needs.test-win-extension-hrx.result }}
        run: |
          verdict() {
            for result in $1; do
              case "${result}" in success|skipped) ;; *) echo false; return ;; esac
            done
            echo true
          }
          echo "xrt=$(verdict "${XRT}")" >> "$GITHUB_OUTPUT"
          echo "hrx=$(verdict "${HRX}")" >> "$GITHUB_OUTPUT"
          echo "XRT: ${XRT} -> $(verdict "${XRT}")"
          echo "HRX: ${HRX} -> $(verdict "${HRX}")"

      # Fails a gated run whose NPU jobs did not get to run (gate failed or
      # approval rejected) or whose packages did not pass, so the skipped test
      # jobs cannot pass as green. Ungated runs only report the verdict.
      - name: Gate and verdict
        if: github.event_name == 'pull_request' || needs.npu-gate.result != 'skipped'
        env:
          GATE: ${{ needs.npu-gate.result }}
          APPROVE: ${{ needs.npu-approve.result }}
          TRUSTED: ${{ needs.npu-gate.outputs.trusted }}
          XRT_OK: ${{ steps.verdict.outputs.xrt }}
          HRX_OK: ${{ steps.verdict.outputs.hrx }}
          RUN: ${{ needs.changes.outputs.run }}
          STAGED: ${{ needs.devkit-stage.outputs.staged }}
        run: |
          echo "npu-gate: ${GATE} (trusted: ${TRUSTED}); npu-approve: ${APPROVE}; xrt: ${XRT_OK}; hrx: ${HRX_OK}"
          case "${GATE}" in success) ;; *) echo "::error::npu-gate did not succeed"; exit 1 ;; esac
          # A missing approval fails only when some NPU job needed it: a
          # dev-kit pull request that staged nothing runs none (npu-approve
          # asks before that is known). Dev-kit checks fails a staged run
          # whose test jobs the gate held.
          if [ "${TRUSTED}" != true ] && [ "${APPROVE}" != success ] && [ "${APPROVE}" != skipped ] \
             && { [ "${RUN}" = true ] || [ "${STAGED}" = true ]; }; then
            echo "::error::NPU tests were not approved"; exit 1
          fi
          if [ "${XRT_OK}" != true ] || [ "${HRX_OK}" != true ]; then
            echo "::error::a package failed to build or its tests failed"; exit 1
          fi

      # A pull request whose dev-kit data does not check out (devkit-static,
      # whose catalog rules also run for changes to src/model_list.json,
      # src/xclbins and src/lib), whose dev-kit builds or staging fail, whose
      # staged packages' test jobs did not run, whose binaries src/ lacks
      # (pending) without this run staging them, or that edits src/lib or
      # src/xclbins by hand (changes' devkit_swap.py check), fails here too,
      # whatever the gate step above decided, so this job stays the single
      # required check. So does one whose change detection failed: every job
      # after it is then skipped, and a skip would otherwise read as a pass.
      # The dev-kit benches (devkit-bench) fail it only when a model failed
      # acc_common's hard gate (hard-gate=fail); any other failure of theirs
      # (perf giving no result, a pull, a timeout, a lost runner, the GitHub
      # API) only warns; skipped, they pass (nothing to bench, or a build or
      # the gate held them, which the checks above already report). The
      # dev-kit full refresh is checked the same way. A verified swap commit
      # (swap-verified) requests no build or staging, so only changes and
      # devkit-static count for it. Other runs only show the dev-kit jobs'
      # own results: the dev kit ships in no package, so it does not hold up
      # a release.
      - name: Dev-kit checks
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.changes.outputs.devkit-full-refresh == 'true') }}
        env:
          CHANGES: ${{ needs.changes.result }}
          SWAP_VERIFIED: ${{ needs.changes.outputs.swap-verified }}
          BINARIES: ${{ needs.changes.outputs.binaries-check }}
          DEVKIT_STATIC: ${{ needs.devkit-static.result }}
          PENDING: ${{ needs.devkit-static.outputs.pending }}
          DEVKIT_ENGINES: ${{ needs.devkit-engines.result }}
          DEVKIT_XCLBINS: ${{ needs.devkit-xclbins.result }}
          DEVKIT_STAGE: ${{ needs.devkit-stage.result }}
          STAGE_REQUESTED: >-
            ${{ (github.event_name == 'pull_request' && needs.changes.outputs.devkit-stage == 'true')
            || needs.changes.outputs.devkit-full-refresh == 'true' }}
          STAGED: ${{ needs.devkit-stage.outputs.staged }}
          DEVKIT_BENCH: ${{ needs.devkit-bench.result }}
          DEVKIT_BENCH_GATE: ${{ needs.devkit-bench.outputs.hard-gate }}
          STAGED_TESTS: >-
            test-lin-xrt-portable=${{ needs.test-lin-xrt-portable.result }}
            test-lin-hrx-portable=${{ needs.test-lin-hrx-portable.result }}
            test-win-xrt=${{ needs.test-win-xrt.result }}
            test-win-hrx=${{ needs.test-win-hrx.result }}
        run: |
          echo "changes: ${CHANGES}; devkit-static: ${DEVKIT_STATIC}; devkit-engines: ${DEVKIT_ENGINES}; devkit-xclbins: ${DEVKIT_XCLBINS}; devkit-stage: ${DEVKIT_STAGE} (requested: ${STAGE_REQUESTED}, staged: ${STAGED:-false}); devkit-bench: ${DEVKIT_BENCH} (hard gate: ${DEVKIT_BENCH_GATE:-not reported})"
          echo "${STAGED_TESTS}; verified swap: ${SWAP_VERIFIED:-false}; pending binaries: ${PENDING:-none}; binaries check: ${BINARIES:-not run}"
          rc=0
          case "${CHANGES}" in success) ;; *) echo "::error::changes did not succeed, so the dev-kit and build jobs were skipped"; rc=1 ;; esac
          if [ "${BINARIES}" = failure ]; then
            echo "::error::src/lib or src/xclbins changed by hand (not by a verified swap commit): see the changes job's \"Check the prebuilt binaries come from CI\" step"; rc=1
          fi
          case "${DEVKIT_STATIC}" in success|skipped) ;; *) echo "::error::devkit-static did not pass"; rc=1 ;; esac
          case "${DEVKIT_ENGINES}" in success|skipped) ;; *) echo "::error::devkit-engines did not pass"; rc=1 ;; esac
          case "${DEVKIT_XCLBINS}" in success|skipped) ;; *) echo "::error::devkit-xclbins did not pass"; rc=1 ;; esac
          # A verified swap was tested by its parent's run (changes leaves
          # devkit-stage off for it; this keeps it so).
          [ "${SWAP_VERIFIED}" = true ] && STAGE_REQUESTED=false
          if [ "${STAGE_REQUESTED}" = true ] && [ "${DEVKIT_STAGE}" != success ]; then
            echo "::error::devkit-stage did not pass (${DEVKIT_STAGE}): the dev-kit files were not staged, so the product builds and their NPU tests did not run"; rc=1
          fi
          if [ -n "${PENDING}" ] && [ "${DEVKIT_STAGE}" != success ]; then
            echo "::error::src/ lacks binaries the dev kit assigns or builds (${PENDING}) and this run staged none: add the dev-kit source that builds them, or drop their entries"; rc=1
          fi
          if [ "${STAGED}" = true ]; then
            for entry in ${STAGED_TESTS}; do
              job="${entry%%=*}"; result="${entry#*=}"
              case "${result}" in
                success) ;;
                skipped) echo "::error::${job} was skipped though dev-kit files were staged into its package (a build failed, or the NPU gate held it)"; rc=1 ;;
                *) echo "::error::${job} did not pass (${result})"; rc=1 ;;
              esac
            done
          fi
          if [ "${DEVKIT_BENCH_GATE}" = fail ]; then
            echo "::error::devkit-bench: a model failed acc_common's hard gate (no predictions, or too many unanswered; see the bench summary)"; rc=1
          else
            case "${DEVKIT_BENCH}" in success|skipped) ;; *) echo "::warning::devkit-bench did not pass (${DEVKIT_BENCH}) but no model failed the hard gate: perf, a pull, a timeout or the bench infrastructure; see its jobs" ;; esac
          fi
          exit "${rc}"

      # Fails while this run staged dev-kit files the branch does not have:
      # a swap is pending (devkit_swap.py pending), with the fetch command in
      # the job summary. This step must be the only failure of a run that
      # fetch takes (devkit_swap.py PENDING_STEP, check_jobs): keep its name.
      # After the author pushes the swap commit, the changes job verifies it
      # and the next run builds and tests nothing again.
      - name: Download the dev-kit staging manifests
        if: >-
          ${{ !cancelled() && needs.changes.outputs.swap-verified != 'true'
          && needs.devkit-stage.outputs.staged == 'true'
          && (github.event_name == 'pull_request' || needs.changes.outputs.devkit-full-refresh == 'true') }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: devkit-stage-manifest-*
          path: devkit-stage-manifests

      - name: Dev-kit swap pending
        if: >-
          ${{ !cancelled() && needs.changes.outputs.swap-verified != 'true'
          && needs.devkit-stage.outputs.staged == 'true'
          && (github.event_name == 'pull_request' || needs.changes.outputs.devkit-full-refresh == 'true') }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          python3 .github/script/ci/devkit_swap.py pending --manifests devkit-stage-manifests
          --head "${HEAD_SHA}" --run "${GITHUB_RUN_ID}" --base "${BASE_SHA}" --summary "${GITHUB_STEP_SUMMARY}"
