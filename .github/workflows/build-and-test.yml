name: Build and Test

# Builds every FastFlowLM package and tests each one on the NPU runners as soon
# as its own build finishes.
#
#   Linux    XRT portable ─ test     HRX portable ─ test     Source portable ─ test
#                └ extension ─ test      └ extension ─ test
#            XRT .deb ─ install test (off)   HRX .deb ─ install test (off)
#   Windows  XRT zip ─ test          HRX zip ─ test          Source zip ─ test
#                └ extension ─ test      └ extension ─ test
#            XRT zip ─ HIPEP test
#            XRT MSI ─ install test (off)
#
# Each package is its own build call, so its tests do not wait on the other
# packages' builds, and XRT and HRX are tested side by side. HRX skips the api
# and serving suites: they test server logic the backend does not touch, and
# the XRT run covers it.
#
# The Windows XRT package also holds the oga-hipep backend, which runs its
# models on the GPU through hip-ep. Test Windows HIPEP runs the chat, api and
# shutdown suites on the oga-hipep models from the same zip, on each kind of
# machine in .github/hipep-machines.json: an STX Halo of its own, beside the
# NPU tests, and whichever shared NPU runner labelled oga-hipep (STX, Krackan
# or STX Halo) is free. Test Windows XRT tests the NPU models.
# HIPEP runs when every suite does, or when a change reaches an oga-hipep
# model (the backend, its catalog entries, the frontend of a family that has
# one, the chat, api and shutdown tests); a change only to the backend or its
# entries runs no NPU test.
#
# A pull request runs only the suites its changes can affect (an ASR-only
# change runs asr, a d3-only change decision); see .github/script/ci/changes.py.
#
# Tiers (.github/script/npu_test/plan.py): pull requests and pushes run the pr
# tier, one model per engine family plus every model of a family the change
# touches; the nightly run tests every model. A model the change adds to
# src/model_list.json, or whose weights it republishes (new files, hashes in
# src/model_info.json, or a raised flm_min_version), is tested whatever its
# size: the test jobs get 600 minutes, of which the new models' downloads get
# up to 420 outside the pr tier's 30-minute budget, and one that does not
# download fails the job. An oga-hipep entry the change adds or edits, new
# weights or not, is required the same way in Test Windows HIPEP, beside its
# models of each family, on the kinds of machine that test changed models
# (the STX Halo). A change that only touches docs builds and tests nothing.
# The portable test jobs and Test Windows HIPEP otherwise get 120 minutes on
# the pr tier and 360 on the full one, which runs every model and every d3
# size and may first download tens of GB of weights.
#
# A dispatch can name the models to test (models, e.g. qwen3.5-oga-hipep:9b):
# every test job then runs only those, so a package without them runs
# nothing. fresh-hip-ep has Test Windows HIPEP install hip-ep from scratch,
# instead of reusing the runner's copy.
#
# release.yml calls this with release: true before publishing a tag.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '17 6 * * *'  # nightly, full tier
  workflow_dispatch:
    inputs:
      tier:
        description: Test tier
        type: choice
        options: [pr, full, install]
        default: pr
      models:
        description: Comma-separated model ids to test instead of the tier's (e.g. qwen3.5-oga-hipep:9b)
        type: string
        default: ''
      fresh-hip-ep:
        description: Install hip-ep from scratch in Test Windows HIPEP
        type: boolean
        default: false
  workflow_call:
    inputs:
      tier:
        description: Test tier (install, pr or full).
        type: string
        default: pr
      release:
        description: Build and test only what a release ships (no models-from-source, no model-extension fixture).
        type: boolean
        default: false
    outputs:
      xrt-passed:
        description: '"true" when every XRT package built and passed its tests.'
        value: ${{ jobs.summary.outputs.xrt-passed }}
      hrx-passed:
        description: '"true" when every HRX package built and passed its tests.'
        value: ${{ jobs.summary.outputs.hrx-passed }}
      deb-distros:
        description: How many distributions each .deb variant was built for.
        value: ${{ jobs.build-lin-xrt-deb.outputs.deb_distros }}

# A superseded pull request commit only holds the NPU and HIPEP runners up, so
# a new push cancels its run. Pushes to main, nightly runs and tags each get
# their own group and always finish.
concurrency:
  group: build-and-test-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.detect.outputs.run }}
      families: ${{ steps.detect.outputs.families }}
      asr-full: ${{ steps.detect.outputs.asr-full }}
      tier: ${{ steps.detect.outputs.tier }}
      short-sha: ${{ steps.detect.outputs.short-sha }}
      suites: ${{ steps.detect.outputs.suites }}
      hrx-suites: ${{ steps.detect.outputs.hrx-suites }}
      source: ${{ steps.detect.outputs.source }}
      hipep: ${{ steps.detect.outputs.hipep }}
      hipep-machines: ${{ steps.hipep.outputs.machines }}
      new-models: ${{ steps.detect.outputs.new-models }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Detect changes
        id: detect
        uses: ./.github/actions/detect-changes
        with:
          tier: ${{ inputs.tier }}

      # One Test Windows HIPEP job per kind of GPU machine, each with the tier
      # it runs and the changed models it tests. The repository variable
      # FLM_HIPEP_MACHINES names other kinds, or "none", without a commit,
      # e.g. while a kind's only runner is down.
      - name: Pick HIPEP machines
        id: hipep
        env:
          ONLY: ${{ vars.FLM_HIPEP_MACHINES }}
          TIER: ${{ steps.detect.outputs.tier }}
          CHANGED: ${{ steps.detect.outputs.hipep-models }}
        run: |
          python3 .github/script/ci/hipep_machines.py --tier "${TIER}" --changed-models "${CHANGED}" \
            --only "${ONLY}" --github-output

      # Every npu_test run imports every suite, but a change to the shutdown
      # suite or console.py runs Test Windows HIPEP alone. A Windows-only
      # import there would break the Linux NPU jobs unseen until a change that
      # runs them, so load the whole package on Linux here on every run.
      - name: Check npu_test imports on Linux
        working-directory: .github/script
        run: python3 -m npu_test --help > /dev/null

      # The change-detection tests, including the ones that check its engine
      # table and the pr tier's model table against src/model_list.json, so a
      # model family added without them fails here, not silently later.
      - name: Test change detection and the test plan
        working-directory: .github/script
        run: python3 -m unittest discover -s ci -p 'test_*.py' -t ci

  # ── NPU approval gate ────────────────────────────────────────────────────
  # The NPU runners are few, so pull requests from anyone outside the core
  # team wait for one of the npu-approval environment's reviewers before any
  # job lands on them. Builds on hosted runners still start right away.
  # Pushes to main, nightly, manual and release runs are never gated.
  npu-gate:
    needs: changes
    if: >-
      github.event_name == 'pull_request'
      && !contains(fromJSON('["zaneni6", "michyu-amd", "tawei-amd", "alfxu-amd", "shdu-amd"]'), github.event.pull_request.user.login)
      && (needs.changes.outputs.suites != 'none'
          || needs.changes.outputs.hrx-suites != ''
          || needs.changes.outputs.source == 'true'
          || (needs.changes.outputs.hipep == 'true' && needs.changes.outputs.hipep-machines != '[]')
          || vars.FLM_INSTALL_TESTS == 'true')
    runs-on: ubuntu-latest
    environment: npu-approval
    steps:
      - env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: echo "NPU tests approved for ${PR_AUTHOR}'s pull request."

  # ── Linux builds ─────────────────────────────────────────────────────────

  build-lin-xrt-portable:
    name: Linux XRT portable
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/lin-build.yml
    with:
      variants: XRT-portable

  build-lin-hrx-portable:
    name: Linux HRX portable
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/lin-build.yml
    with:
      variants: HRX-portable

  # The models-from-source builds are only tested when the chat suite runs, so
  # they are only built then.
  build-lin-source-portable:
    name: Linux models-from-source portable
    needs: changes
    if: needs.changes.outputs.run == 'true' && needs.changes.outputs.source == 'true' && !inputs.release
    uses: ./.github/workflows/lin-build.yml
    with:
      variants: Source-portable

  build-lin-xrt-deb:
    name: Linux XRT .deb
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/lin-build.yml
    with:
      variants: XRT-deb

  build-lin-hrx-deb:
    name: Linux HRX .deb
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/lin-build.yml
    with:
      variants: HRX-deb

  # ── Windows builds ───────────────────────────────────────────────────────

  build-win-xrt:
    name: Windows XRT
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/win-build.yml
    with:
      variants: XRT
      msi: true

  build-win-hrx:
    name: Windows HRX
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/win-build.yml
    with:
      variants: HRX
      msi: false

  build-win-source:
    name: Windows models-from-source
    needs: changes
    if: needs.changes.outputs.run == 'true' && needs.changes.outputs.source == 'true' && !inputs.release
    uses: ./.github/workflows/win-build.yml
    with:
      variants: Source
      msi: false

  # ── Model extensions ─────────────────────────────────────────────────────
  # The Gemma4-open bundles build against the SDK in their package once it
  # exists, outside the package build, so a failure here holds back no package
  # or NPU test, only the verdict. A release run skips them, like the
  # models-from-source builds: a fixture-only break (rustup, a submodule fetch)
  # should not hold a release that pull requests already tested. The
  # model-extension contracts need no package and run in cpu-tests.yml.

  build-lin-extension-xrt:
    name: Linux XRT model extension
    needs: [changes, build-lin-xrt-portable]
    if: needs.changes.outputs.source == 'true' && !inputs.release
    uses: ./.github/workflows/model-extension-build.yml
    with:
      os: linux
      runtime: XRT
      package: portable

  build-lin-extension-hrx:
    name: Linux HRX model extension
    needs: [changes, build-lin-hrx-portable]
    if: needs.changes.outputs.source == 'true' && !inputs.release
    uses: ./.github/workflows/model-extension-build.yml
    with:
      os: linux
      runtime: HRX
      package: HRX-portable

  build-win-extension-xrt:
    name: Windows XRT model extension
    needs: [changes, build-win-xrt]
    if: needs.changes.outputs.source == 'true' && !inputs.release
    uses: ./.github/workflows/model-extension-build.yml
    with:
      os: windows
      runtime: XRT
      package: fastflowlm-windows-${{ github.sha }}

  build-win-extension-hrx:
    name: Windows HRX model extension
    needs: [changes, build-win-hrx]
    if: needs.changes.outputs.source == 'true' && !inputs.release
    uses: ./.github/workflows/model-extension-build.yml
    with:
      os: windows
      runtime: HRX
      package: HRX-fastflowlm-windows-${{ github.sha }}

  # ── Linux tests ──────────────────────────────────────────────────────────
  # Only the test scripts and their assets are checked out, never the sources:
  # these jobs run a prebuilt package and compile nothing.

  test-lin-xrt-portable:
    name: Test Linux XRT portable
    needs: [changes, build-lin-xrt-portable, npu-gate]
    # npu-gate is skipped for trusted authors, so spell out what the
    # implicit success() check used to require.
    if: >-
      ${{ !cancelled()
      && (needs.npu-gate.result == 'success' || needs.npu-gate.result == 'skipped')
      && needs.changes.result == 'success'
      && needs.build-lin-xrt-portable.result == 'success'
      && (needs.changes.outputs.suites != 'none') }}
    runs-on: [self-hosted, linux, x64, npu, sweep]
    timeout-minutes: ${{ needs.changes.outputs.new-models != '' && 600 || needs.changes.outputs.tier == 'full' && 360 || 120 }}
    steps:
      - &checkout-tests
        name: Checkout test scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions
            .github/script
            src/test/openai_api_test
            src/test/openai_usage
            src/test/d3_video/fixtures
          filter: blob:none
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: portable
          path: package
      - name: Prepare package
        id: package
        uses: ./.github/actions/install-package
        with:
          kind: portable
          path: package
      - name: Test
        uses: ./.github/actions/npu-test
        with:
          flm-bin: ${{ steps.package.outputs.flm-bin }}
          label: linux-xrt-portable
          required-models: ${{ needs.changes.outputs.new-models }}
          tier: ${{ needs.changes.outputs.tier }}
          suites: ${{ needs.changes.outputs.suites }}
          families: ${{ needs.changes.outputs.families }}
          models: ${{ inputs.models }}
          asr-full: ${{ needs.changes.outputs.asr-full }}
          asr-expected-key: linux

  test-lin-hrx-portable:
    name: Test Linux HRX portable
    needs: [changes, build-lin-hrx-portable, npu-gate]
    # npu-gate is skipped for trusted authors, so spell out what the
    # implicit success() check used to require.
    if: >-
      ${{ !cancelled()
      && (needs.npu-gate.result == 'success' || needs.npu-gate.result == 'skipped')
      && needs.changes.result == 'success'
      && needs.build-lin-hrx-portable.result == 'success'
      && (needs.changes.outputs.hrx-suites != '') }}
    runs-on: [self-hosted, linux, x64, npu, sweep]
    timeout-minutes: ${{ needs.changes.outputs.new-models != '' && 600 || needs.changes.outputs.tier == 'full' && 360 || 120 }}
    steps:
      - *checkout-tests
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: HRX-portable
          path: package
      - name: Prepare package
        id: package
        uses: ./.github/actions/install-package
        with:
          kind: portable
          path: package
      - name: Test
        uses: ./.github/actions/npu-test
        with:
          flm-bin: ${{ steps.package.outputs.flm-bin }}
          label: linux-hrx-portable
          required-models: ${{ needs.changes.outputs.new-models }}
          tier: ${{ needs.changes.outputs.tier }}
          suites: ${{ needs.changes.outputs.hrx-suites }}
          families: ${{ needs.changes.outputs.families }}
          models: ${{ inputs.models }}
          asr-full: ${{ needs.changes.outputs.asr-full }}
          asr-expected-key: linux-hrx

  # Only the engines differ from the XRT portable build, and only the Gemma 4
  # engines are built from source so far.
  test-lin-source-portable:
    name: Test Linux models-from-source portable
    needs: [changes, build-lin-source-portable, npu-gate]
    # npu-gate is skipped for trusted authors, so spell out what the
    # implicit success() check used to require.
    if: >-
      ${{ !cancelled()
      && (needs.npu-gate.result == 'success' || needs.npu-gate.result == 'skipped')
      && needs.changes.result == 'success'
      && needs.build-lin-source-portable.result == 'success'
      && (needs.changes.outputs.source == 'true') }}
    runs-on: [self-hosted, linux, x64, npu, sweep]
    timeout-minutes: 60
    steps:
      - *checkout-tests
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: models-from-source-portable
          path: package
      - name: Prepare package
        id: package
        uses: ./.github/actions/install-package
        with:
          kind: portable
          path: package
      - name: Test
        uses: ./.github/actions/npu-test
        with:
          flm-bin: ${{ steps.package.outputs.flm-bin }}
          label: linux-source-portable
          tier: ${{ needs.changes.outputs.tier }}
          suites: chat
          models: ${{ inputs.models || 'gemma4-it:e2b,gemma4-it:e4b' }}

  test-lin-extension-xrt:
    name: Test Linux XRT model extension
    needs: [changes, build-lin-xrt-portable, build-lin-extension-xrt, npu-gate]
    # npu-gate is skipped for trusted authors, so spell out what the
    # implicit success() check used to require.
    if: >-
      ${{ !cancelled()
      && (needs.npu-gate.result == 'success' || needs.npu-gate.result == 'skipped')
      && needs.changes.result == 'success'
      && needs.build-lin-xrt-portable.result == 'success'
      && needs.build-lin-extension-xrt.result == 'success'
      && (needs.changes.outputs.source == 'true') }}
    runs-on: [self-hosted, linux, x64, npu, sweep]
    timeout-minutes: 60
    steps:
      - *checkout-tests
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: portable
          path: package
      - name: Download model extension
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gemma4-open-linux-xrt
          path: model-extension
      - name: Prepare package
        id: package
        uses: ./.github/actions/install-package
        with:
          kind: portable
          path: package
      - name: Test
        uses: ./.github/actions/npu-test
        with:
          flm-bin: ${{ steps.package.outputs.flm-bin }}
          label: linux-xrt-model-extension
          tier: ${{ needs.changes.outputs.tier }}
          suites: chat
          models: gemma4-open-it:e2b
          model-extension: ${{ github.workspace }}/model-extension/extension.json

  test-lin-extension-hrx:
    name: Test Linux HRX model extension
    needs: [changes, build-lin-hrx-portable, build-lin-extension-hrx, npu-gate]
    # npu-gate is skipped for trusted authors, so spell out what the
    # implicit success() check used to require.
    if: >-
      ${{ !cancelled()
      && (needs.npu-gate.result == 'success' || needs.npu-gate.result == 'skipped')
      && needs.changes.result == 'success'
      && needs.build-lin-hrx-portable.result == 'success'
      && needs.build-lin-extension-hrx.result == 'success'
      && (needs.changes.outputs.source == 'true') }}
    runs-on: [self-hosted, linux, x64, npu, sweep]
    timeout-minutes: 60
    steps:
      - *checkout-tests
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: HRX-portable
          path: package
      - name: Download model extension
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gemma4-open-linux-hrx
          path: model-extension
      - name: Prepare package
        id: package
        uses: ./.github/actions/install-package
        with:
          kind: portable
          path: package
      - name: Test
        uses: ./.github/actions/npu-test
        with:
          flm-bin: ${{ steps.package.outputs.flm-bin }}
          label: linux-hrx-model-extension
          tier: ${{ needs.changes.outputs.tier }}
          suites: chat
          models: gemma4-open-it:e2b
          model-extension: ${{ github.workspace }}/model-extension/extension.json

  # The .deb and MSI install tests are off unless the repository variable
  # FLM_INSTALL_TESTS is "true": the runners cannot install yet (no
  # passwordless sudo on Linux, an FLM already installed on Windows), so they
  # only tested the unpacked payload. When turning them on, also add them to
  # the summary's verdict, so a release waits for them.
  #
  # The NPU runners run Ubuntu 24.04, so that is the .deb that can be
  # installed; the other distributions' builds are covered by their build.
  install-lin-xrt-deb:
    name: Install test Linux XRT .deb
    needs: [changes, build-lin-xrt-deb, npu-gate]
    # npu-gate is skipped for trusted authors, so spell out what the
    # implicit success() check used to require.
    if: >-
      ${{ !cancelled()
      && (needs.npu-gate.result == 'success' || needs.npu-gate.result == 'skipped')
      && needs.changes.result == 'success'
      && needs.build-lin-xrt-deb.result == 'success'
      && (vars.FLM_INSTALL_TESTS == 'true') }}
    runs-on: [self-hosted, linux, x64, npu, sweep]
    timeout-minutes: 60
    steps:
      - *checkout-tests
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flm-ubuntu24.04-${{ needs.changes.outputs.short-sha }}-deb
          path: package
      - name: Install package
        id: package
        uses: ./.github/actions/install-package
        with:
          kind: deb
          path: package
      - name: Test
        uses: ./.github/actions/npu-test
        with:
          flm-bin: ${{ steps.package.outputs.flm-bin }}
          label: linux-xrt-deb-${{ steps.package.outputs.mode }}
          tier: install
      - name: Remove package
        if: always()
        uses: ./.github/actions/remove-package
        with:
          kind: deb
          mode: ${{ steps.package.outputs.mode }}

  install-lin-hrx-deb:
    name: Install test Linux HRX .deb
    needs: [changes, build-lin-hrx-deb, npu-gate]
    # npu-gate is skipped for trusted authors, so spell out what the
    # implicit success() check used to require.
    if: >-
      ${{ !cancelled()
      && (needs.npu-gate.result == 'success' || needs.npu-gate.result == 'skipped')
      && needs.changes.result == 'success'
      && needs.build-lin-hrx-deb.result == 'success'
      && (vars.FLM_INSTALL_TESTS == 'true') }}
    runs-on: [self-hosted, linux, x64, npu, sweep]
    timeout-minutes: 60
    steps:
      - *checkout-tests
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: HRX-flm-ubuntu24.04-${{ needs.changes.outputs.short-sha }}-deb
          path: package
      - name: Install package
        id: package
        uses: ./.github/actions/install-package
        with:
          kind: deb
          path: package
      - name: Test
        uses: ./.github/actions/npu-test
        with:
          flm-bin: ${{ steps.package.outputs.flm-bin }}
          label: linux-hrx-deb-${{ steps.package.outputs.mode }}
          tier: install
      - name: Remove package
        if: always()
        uses: ./.github/actions/remove-package
        with:
          kind: deb
          mode: ${{ steps.package.outputs.mode }}

  # ── Windows tests ────────────────────────────────────────────────────────

  test-win-xrt:
    name: Test Windows XRT
    needs: [changes, build-win-xrt, npu-gate]
    # npu-gate is skipped for trusted authors, so spell out what the
    # implicit success() check used to require.
    if: >-
      ${{ !cancelled()
      && (needs.npu-gate.result == 'success' || needs.npu-gate.result == 'skipped')
      && needs.changes.result == 'success'
      && needs.build-win-xrt.result == 'success'
      && (needs.changes.outputs.suites != 'none') }}
    runs-on: [self-hosted, windows, x64, npu, sweep]
    timeout-minutes: ${{ needs.changes.outputs.new-models != '' && 600 || needs.changes.outputs.tier == 'full' && 360 || 120 }}
    steps:
      - *checkout-tests
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fastflowlm-windows-${{ github.sha }}
          path: package
      - name: Prepare package
        id: package
        uses: ./.github/actions/install-package
        with:
          kind: portable
          path: package
      - name: Test
        uses: ./.github/actions/npu-test
        with:
          flm-bin: ${{ steps.package.outputs.flm-bin }}
          label: windows-xrt
          required-models: ${{ needs.changes.outputs.new-models }}
          tier: ${{ needs.changes.outputs.tier }}
          suites: ${{ needs.changes.outputs.suites }}
          families: ${{ needs.changes.outputs.families }}
          models: ${{ inputs.models }}
          asr-full: ${{ needs.changes.outputs.asr-full }}
          asr-expected-key: windows

  # The XRT zip's oga-hipep models, on the GPU, one job per kind of machine in
  # .github/hipep-machines.json: the STX Halo, whose labels (oga-hipep,
  # stx-halo) no NPU job asks for, so it runs beside the NPU test jobs, and
  # the shared NPU runners also labelled oga-hipep, those whose memory holds
  # the pr tier's models (STX, Krackan and STX Halo, whichever is free), one
  # of which it holds for the job as an NPU test job does. Besides chat, the
  # models run the OpenAI contract tests (api), tool calls included, and
  # shutdown: Ctrl+C and /bye must still end flm once it has loaded hip-ep.
  # The pr tier tests one model per family (PR_GPU in npu_test/plan.py: the
  # newest Qwen and Gemma; Qwen2.5, Gemma 3, gemma4-12b and gpt-oss only when
  # the change touches their family); the full tier tests every one, where
  # the kind's max-tier allows (the shared runners test the pr tier's models
  # nightly).
  # The models whose catalog entries the change added or edited
  # (hipep-models) run too, as required models (--required-models), on the
  # kinds whose changed-models allows it (the STX Halo, not the shared
  # runners; every kind that runs when none of those does): they download
  # first, with 420 minutes for all of them, a failure if one does not, and
  # the job gets 600 minutes, as an NPU test job does for its new models. A
  # change may add or re-pin many at once. Each kind skips the models larger
  # than its memory holds (max-model-gb), required ones too, and a dispatch
  # that names models (models) tests only those and the required ones.
  # npu_test pulls the models first, outside the requests' timeouts, and they
  # stay on the runner: only its first run, or a new revision of a model,
  # downloads (about 33 GB for the pr tier's, 400 GB for all), and a model
  # verified before whose pins and files are unchanged is not verified again
  # (a required one always is).
  test-win-hipep:
    name: Test Windows HIPEP (${{ matrix.id }})
    needs: [changes, build-win-xrt, npu-gate]
    # npu-gate is skipped for trusted authors, so spell out what the
    # implicit success() check used to require.
    if: >-
      ${{ !cancelled()
      && (needs.npu-gate.result == 'success' || needs.npu-gate.result == 'skipped')
      && needs.changes.result == 'success'
      && needs.build-win-xrt.result == 'success'
      && (needs.changes.outputs.hipep == 'true')
      && (needs.changes.outputs.hipep-machines != '[]') }}
    strategy:
      # Each kind of machine reports on its own; one failing must not cancel
      # the others.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.hipep-machines) }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: ${{ matrix.changed-models != '' && 600 || matrix.tier == 'full' && 360 || 120 }}
    steps:
      - *checkout-tests
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fastflowlm-windows-${{ github.sha }}
          path: package
      - name: Prepare package
        id: package
        uses: ./.github/actions/install-package
        with:
          kind: portable
          path: package
      # An APU's dedicated GPU memory (96 GB on the STX Halo) is outside the
      # memory Windows reports, and Win32_VideoController's AdapterRAM stops
      # at 4 GB; the display driver's registry entry has its size.
      - name: Show the GPU
        shell: powershell
        run: |
          Get-CimInstance Win32_VideoController | ForEach-Object { "$($_.Name), driver $($_.DriverVersion)" }
          "Memory: {0:N0} GB, not counting memory dedicated to a GPU" -f ((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB)
          Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Class\{4d36e968-e325-11ce-bfc1-08002be10318}\0*' -ErrorAction SilentlyContinue |
            Where-Object { $_.'HardwareInformation.qwMemorySize' } |
            ForEach-Object { "{0}: {1:N0} GB dedicated" -f $_.DriverDesc, ($_.'HardwareInformation.qwMemorySize' / 1GB) }
      # flm installs hip-ep into %LOCALAPPDATA%\hip-ep once and reuses it after,
      # so only an empty one makes it download and install again. The runner
      # empties its temp folder after every job. A short name: the deepest
      # hip-ep file is 128 characters below the package root.
      - name: Use an empty LOCALAPPDATA
        if: inputs.fresh-hip-ep
        shell: powershell
        run: |
          $dir = New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'lad')
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "LOCALAPPDATA=$($dir.FullName)`n")
          Write-Host "LOCALAPPDATA=$($dir.FullName)"
      - name: Test
        uses: ./.github/actions/npu-test
        with:
          flm-bin: ${{ steps.package.outputs.flm-bin }}
          label: windows-hipep-${{ matrix.id }}
          tier: ${{ matrix.tier }}
          suites: chat,api,shutdown
          families: ${{ needs.changes.outputs.families }}
          models: ${{ inputs.models }}
          required-models: ${{ matrix.changed-models }}
          backend: oga-hipep
          max-model-gb: ${{ matrix.max-model-gb }}

  test-win-hrx:
    name: Test Windows HRX
    needs: [changes, build-win-hrx, npu-gate]
    # npu-gate is skipped for trusted authors, so spell out what the
    # implicit success() check used to require.
    if: >-
      ${{ !cancelled()
      && (needs.npu-gate.result == 'success' || needs.npu-gate.result == 'skipped')
      && needs.changes.result == 'success'
      && needs.build-win-hrx.result == 'success'
      && (needs.changes.outputs.hrx-suites != '') }}
    runs-on: [self-hosted, windows, x64, npu, sweep]
    timeout-minutes: ${{ needs.changes.outputs.new-models != '' && 600 || needs.changes.outputs.tier == 'full' && 360 || 120 }}
    steps:
      - *checkout-tests
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: HRX-fastflowlm-windows-${{ github.sha }}
          path: package
      - name: Prepare package
        id: package
        uses: ./.github/actions/install-package
        with:
          kind: portable
          path: package
      - name: Test
        uses: ./.github/actions/npu-test
        with:
          flm-bin: ${{ steps.package.outputs.flm-bin }}
          label: windows-hrx
          required-models: ${{ needs.changes.outputs.new-models }}
          tier: ${{ needs.changes.outputs.tier }}
          suites: ${{ needs.changes.outputs.hrx-suites }}
          families: ${{ needs.changes.outputs.families }}
          models: ${{ inputs.models }}
          asr-full: ${{ needs.changes.outputs.asr-full }}
          asr-expected-key: windows-hrx

  test-win-source:
    name: Test Windows models-from-source
    needs: [changes, build-win-source, npu-gate]
    # npu-gate is skipped for trusted authors, so spell out what the
    # implicit success() check used to require.
    if: >-
      ${{ !cancelled()
      && (needs.npu-gate.result == 'success' || needs.npu-gate.result == 'skipped')
      && needs.changes.result == 'success'
      && needs.build-win-source.result == 'success'
      && (needs.changes.outputs.source == 'true') }}
    runs-on: [self-hosted, windows, x64, npu, sweep]
    timeout-minutes: 60
    steps:
      - *checkout-tests
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: models-from-source-fastflowlm-windows-${{ github.sha }}
          path: package
      - name: Prepare package
        id: package
        uses: ./.github/actions/install-package
        with:
          kind: portable
          path: package
      - name: Test
        uses: ./.github/actions/npu-test
        with:
          flm-bin: ${{ steps.package.outputs.flm-bin }}
          label: windows-source
          tier: ${{ needs.changes.outputs.tier }}
          suites: chat
          models: ${{ inputs.models || 'gemma4-it:e2b,gemma4-it:e4b' }}

  test-win-extension-xrt:
    name: Test Windows XRT model extension
    needs: [changes, build-win-xrt, build-win-extension-xrt, npu-gate]
    # npu-gate is skipped for trusted authors, so spell out what the
    # implicit success() check used to require.
    if: >-
      ${{ !cancelled()
      && (needs.npu-gate.result == 'success' || needs.npu-gate.result == 'skipped')
      && needs.changes.result == 'success'
      && needs.build-win-xrt.result == 'success'
      && needs.build-win-extension-xrt.result == 'success'
      && (needs.changes.outputs.source == 'true') }}
    runs-on: [self-hosted, windows, x64, npu, sweep]
    timeout-minutes: 60
    steps:
      - *checkout-tests
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fastflowlm-windows-${{ github.sha }}
          path: package
      - name: Download model extension
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gemma4-open-windows-xrt
          path: model-extension
      - name: Prepare package
        id: package
        uses: ./.github/actions/install-package
        with:
          kind: portable
          path: package
      - name: Test
        uses: ./.github/actions/npu-test
        with:
          flm-bin: ${{ steps.package.outputs.flm-bin }}
          label: windows-xrt-model-extension
          tier: ${{ needs.changes.outputs.tier }}
          suites: chat
          models: gemma4-open-it:e2b
          model-extension: ${{ github.workspace }}/model-extension/extension.json

  test-win-extension-hrx:
    name: Test Windows HRX model extension
    needs: [changes, build-win-hrx, build-win-extension-hrx, npu-gate]
    # npu-gate is skipped for trusted authors, so spell out what the
    # implicit success() check used to require.
    if: >-
      ${{ !cancelled()
      && (needs.npu-gate.result == 'success' || needs.npu-gate.result == 'skipped')
      && needs.changes.result == 'success'
      && needs.build-win-hrx.result == 'success'
      && needs.build-win-extension-hrx.result == 'success'
      && (needs.changes.outputs.source == 'true') }}
    runs-on: [self-hosted, windows, x64, npu, sweep]
    timeout-minutes: 60
    steps:
      - *checkout-tests
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: HRX-fastflowlm-windows-${{ github.sha }}
          path: package
      - name: Download model extension
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gemma4-open-windows-hrx
          path: model-extension
      - name: Prepare package
        id: package
        uses: ./.github/actions/install-package
        with:
          kind: portable
          path: package
      - name: Test
        uses: ./.github/actions/npu-test
        with:
          flm-bin: ${{ steps.package.outputs.flm-bin }}
          label: windows-hrx-model-extension
          tier: ${{ needs.changes.outputs.tier }}
          suites: chat
          models: gemma4-open-it:e2b
          model-extension: ${{ github.workspace }}/model-extension/extension.json

  install-win-msi:
    name: Install test Windows MSI
    needs: [changes, build-win-xrt, npu-gate]
    # npu-gate is skipped for trusted authors, so spell out what the
    # implicit success() check used to require.
    if: >-
      ${{ !cancelled()
      && (needs.npu-gate.result == 'success' || needs.npu-gate.result == 'skipped')
      && needs.changes.result == 'success'
      && needs.build-win-xrt.result == 'success'
      && (vars.FLM_INSTALL_TESTS == 'true') }}
    runs-on: [self-hosted, windows, x64, npu, sweep]
    timeout-minutes: 60
    steps:
      - *checkout-tests
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fastflowlm-windows-msi-${{ github.sha }}
          path: package
      - name: Install package
        id: package
        uses: ./.github/actions/install-package
        with:
          kind: msi
          path: package
      - name: Test
        uses: ./.github/actions/npu-test
        with:
          flm-bin: ${{ steps.package.outputs.flm-bin }}
          label: windows-msi-${{ steps.package.outputs.mode }}
          tier: install
      - name: Remove package
        if: always()
        uses: ./.github/actions/remove-package
        with:
          kind: msi
          mode: ${{ steps.package.outputs.mode }}
          path: package

  # ── Summary ──────────────────────────────────────────────────────────────

  summary:
    needs:
      - changes
      - build-lin-xrt-portable
      - build-lin-hrx-portable
      - build-lin-xrt-deb
      - build-lin-hrx-deb
      - build-win-xrt
      - build-win-hrx
      - build-lin-extension-xrt
      - build-lin-extension-hrx
      - build-win-extension-xrt
      - build-win-extension-hrx
      - test-lin-xrt-portable
      - test-lin-hrx-portable
      - test-lin-source-portable
      - test-lin-extension-xrt
      - test-lin-extension-hrx
      - install-lin-xrt-deb
      - install-lin-hrx-deb
      - test-win-xrt
      - test-win-hipep
      - test-win-hrx
      - test-win-source
      - test-win-extension-xrt
      - test-win-extension-hrx
      - install-win-msi
    if: always()
    runs-on: ubuntu-latest
    outputs:
      xrt-passed: ${{ steps.verdict.outputs.xrt }}
      hrx-passed: ${{ steps.verdict.outputs.hrx }}
    steps:
      - name: Checkout scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/script/ci
          filter: blob:none

      - name: Download reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: npu-test-*
          path: reports

      - name: Summarize
        run: python3 .github/script/ci/merge_reports.py reports >> "$GITHUB_STEP_SUMMARY"

      # What release.yml publishes on: every package of a backend built and
      # passed its tests. A test job skipped because the change did not touch
      # its suites counts as passed; one skipped because its build failed does
      # not, since the build's own failure is in the list too.
      - name: Verdict
        id: verdict
        env:
          XRT: >-
            ${{ needs.build-lin-xrt-portable.result }} ${{ needs.build-lin-xrt-deb.result }}
            ${{ needs.build-win-xrt.result }}
            ${{ needs.test-lin-xrt-portable.result }} ${{ needs.test-win-xrt.result }}
            ${{ needs.test-win-hipep.result }}
            ${{ needs.build-lin-extension-xrt.result }} ${{ needs.build-win-extension-xrt.result }}
            ${{ needs.test-lin-extension-xrt.result }} ${{ needs.test-win-extension-xrt.result }}
          HRX: >-
            ${{ needs.build-lin-hrx-portable.result }} ${{ needs.build-lin-hrx-deb.result }}
            ${{ needs.build-win-hrx.result }}
            ${{ needs.test-lin-hrx-portable.result }} ${{ needs.test-win-hrx.result }}
            ${{ needs.build-lin-extension-hrx.result }} ${{ needs.build-win-extension-hrx.result }}
            ${{ needs.test-lin-extension-hrx.result }} ${{ needs.test-win-extension-hrx.result }}
        run: |
          verdict() {
            for result in $1; do
              case "${result}" in success|skipped) ;; *) echo false; return ;; esac
            done
            echo true
          }
          echo "xrt=$(verdict "${XRT}")" >> "$GITHUB_OUTPUT"
          echo "hrx=$(verdict "${HRX}")" >> "$GITHUB_OUTPUT"
          echo "XRT: ${XRT} -> $(verdict "${XRT}")"
          echo "HRX: ${HRX} -> $(verdict "${HRX}")"
