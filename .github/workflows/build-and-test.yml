  # The XRT zip's oga-hipep models, on the GPU: its runner needs an AMD GPU
  # that hip-ep runs on. Besides chat, they run the OpenAI contract tests (api),
  # tool calls included, and shutdown: Ctrl+C and /bye must still end flm once
  # it has loaded hip-ep. Every tier tests qwen3.5-oga-hipep:9b alone: the other
  # oga-hipep packages are 4 to 72 GB each, and a dispatch that names them
  # (models) tests them instead. npu_test pulls the models first, so a runner
  # without them downloads them (7.5 GB for the 9b) outside the requests' timeouts.
  test-win-hipep:
    name: Test Windows HIPEP
    needs: [changes, build-win-xrt, npu-gate, npu-approve]
    # Self-hosted: gated as test-lin-xrt-portable (see npu-gate).
    if: >-
      ${{ !cancelled()
      && ((github.event_name == 'schedule'
           || (github.event_name == 'push'
               && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')))
           || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
          || (needs.npu-gate.result == 'success'
              && (needs.npu-gate.outputs.trusted == 'true' || needs.npu-approve.result == 'success')))
      && needs.changes.result == 'success'
      && needs.build-win-xrt.result == 'success'
      && (needs.changes.outputs.hipep == 'true') }}
    runs-on: [self-hosted, windows, x64, npu, sweep]
    timeout-minutes: ${{ needs.changes.outputs.new-gpu-models != '' && 600 || 120 }}
    steps:
      - *checkout-tests
