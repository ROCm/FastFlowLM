name: Model Sweep

# Runs the cross-model sweep against real NPU hardware. Nothing is rebuilt
# here; the sweep always consumes a portable build someone else produced.
# Where that build comes from depends on how the sweep was triggered:
#
#   pull_request / push to main  the "Build Linux Portable" and "Build Windows
#                                Packages" runs for this same commit
#   workflow_dispatch            the portable assets attached to a GitHub
#                                Release (the latest one unless a tag is given)
#
# A PR or a src/** push is asking "did this change break a model?", so it has
# to sweep that commit's binary. A manual dispatch is asking "how does a
# shipped build behave?", so it sweeps a release and does not need CI at all.
#
# The sweep is split by modality (llm, vision, embedding, audio) into one
# matrix job each, so a failure in one modality does not hide the others and
# "Re-run failed jobs" restarts only what actually broke.
#
# Each platform is swept against the default portable build and the HRX build;
# releases ship both, the HRX one as a preview under an HRX_ prefix. Commit
# sweeps also run Gemma 4 against separate Linux and Windows packages that
# build model engines from source. Releases do not ship those.

on:
  pull_request:
    branches: [ main ]
  # Merges land on main without ever having been swept when a PR skipped CI,
  # and src/** is what changes the binary the sweep exercises. Doc- and
  # workflow-only pushes produce an identical build, so they are not worth an
  # NPU machine.
  push:
    branches: [ main ]
    paths:
      - 'src/**'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to sweep (blank = latest release)"
        type: string
        default: ""
      gen_lim:
        description: "max_completion_tokens per request (0 or less leaves it unset)"
        type: string
        default: "1024"
      request_timeout:
        description: "Per-request timeout in seconds"
        type: string
        default: "600"
      limit:
        description: "Test only the first N models per task (0 = all). Use a small N to smoke-test the pipeline without downloading every model."
        type: string
        default: "0"

permissions:
  contents: read
  # Needed to list and download artifacts from the sibling build workflow runs.
  actions: read

# The sweep occupies a physical NPU machine, so only keep the newest run per
# ref. The event name is part of the group so that dispatching a release sweep
# does not cancel the commit sweep that a push to main just started, and vice
# versa: those two answer different questions and both are worth finishing.
concurrency:
  group: model-sweep-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  GEN_LIM: ${{ inputs.gen_lim || '1024' }}
  REQUEST_TIMEOUT: ${{ inputs.request_timeout || '600' }}
  # 0 unless dispatched, so the cap only exists when someone asks for one.
  MODEL_LIMIT: ${{ inputs.limit || '0' }}

jobs:
  # Decides what the sweep runs against. On a dispatch that means resolving
  # a release tag. The tag is resolved once here rather than letting each
  # platform (or the downloader) ask for "latest", so both platforms are
  # guaranteed to sweep the same release even if one is published mid-run,
  # and so the tag appears in the log. On a commit sweep there is nothing to
  # look up and this finishes in seconds.
  resolve-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # "run" = artifacts from a CI run, "release" = assets from a release.
      mode: ${{ steps.resolve.outputs.mode }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}

    steps:
      - name: Resolve the build source
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then
            echo "mode=run" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="${RELEASE_TAG}"
          if [ -z "${tag}" ]; then
            tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')
            echo "No tag given; latest release is ${tag}."
          fi
          {
            echo "mode=release"
            echo "release_tag=${tag}"
          } >> "$GITHUB_OUTPUT"

  # Each platform's portable builds are resolved by their own job, which does
  # not finish until those builds actually exist. Everything downstream reads
  # that job's ready flags and only has to know the answer, not how it was
  # reached; .github/script/resolve_build.sh has the details.
  #
  # On a dispatch that means confirming the release carries the asset each
  # sweep needs. On a commit sweep it means waiting. Both build workflows
  # trigger on the same event as this one, so they are still compiling when
  # the sweep is queued, and GitHub has no cross-workflow "needs:". Waiting
  # from a hosted runner keeps the NPU machines free until there is something
  # to sweep. Each build resolves to a concrete run id; pinning the download
  # to that id is what stops a sweep from silently picking up a stale artifact
  # built from an earlier push on the same branch.
  #
  # The platforms are resolved by separate jobs so that neither waits on the
  # other: the Linux sweeps start as soon as the hosted Linux build is done,
  # and the Windows build, which queues for a shared self-hosted runner, gets
  # its own, longer deadline instead of whatever the Linux wait left over.
  #
  # Readiness is per build, not per workflow run. Each artifact has its own
  # readiness flag. A failed optional build does not block the other sweeps.
  # The build workflow reports its failure, so this workflow skips the missing
  # artifact.
  resolve-linux:
    needs: resolve-source
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      mode: ${{ needs.resolve-source.outputs.mode }}
      release_tag: ${{ needs.resolve-source.outputs.release_tag }}
      run_id: ${{ steps.resolve.outputs.run_id }}
      ready: ${{ steps.resolve.outputs.ready }}
      hrx_ready: ${{ steps.resolve.outputs.hrx_ready }}
      models_from_source_ready: ${{ steps.resolve.outputs.models_from_source_ready }}

    steps:
      - name: Checkout sweep scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/script
          filter: blob:none

      - name: Resolve the Linux portable builds
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ needs.resolve-source.outputs.mode }}
          RELEASE_TAG: ${{ needs.resolve-source.outputs.release_tag }}
          # A pull_request run records the PR head commit in head_sha, while
          # github.sha is the synthetic merge commit. Try both, so the lookup
          # does not depend on which one the API reports. On a push only the
          # second is set, and it is the one the build workflow records.
          CANDIDATE_SHAS: ${{ github.event.pull_request.head.sha }} ${{ github.sha }}
          # "Build Linux Portable" runs on hosted runners and takes ~30 min.
          FINISH_MINUTES: "80"
        run: bash .github/script/resolve_build.sh linux

  resolve-windows:
    needs: resolve-source
    runs-on: ubuntu-latest
    timeout-minutes: 190
    outputs:
      mode: ${{ needs.resolve-source.outputs.mode }}
      release_tag: ${{ needs.resolve-source.outputs.release_tag }}
      run_id: ${{ steps.resolve.outputs.run_id }}
      ready: ${{ steps.resolve.outputs.ready }}
      hrx_ready: ${{ steps.resolve.outputs.hrx_ready }}
      models_from_source_ready: ${{ steps.resolve.outputs.models_from_source_ready }}

    steps:
      - name: Checkout sweep scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/script
          filter: blob:none

      - name: Resolve the Windows portable builds
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ needs.resolve-source.outputs.mode }}
          RELEASE_TAG: ${{ needs.resolve-source.outputs.release_tag }}
          CANDIDATE_SHAS: ${{ github.event.pull_request.head.sha }} ${{ github.sha }}
          # The build itself takes ~30 min, but both portable jobs share one
          # self-hosted runner and queue behind other PRs' builds, which has
          # pushed a run past 85 min. Waiting longer only costs hosted-runner
          # time; giving up skips the Windows sweep entirely.
          FINISH_MINUTES: "180"
        run: bash .github/script/resolve_build.sh windows

  sweep-linux:
    needs: resolve-linux
    # Unset when no Linux build could be resolved, whichever mode we are in.
    if: needs.resolve-linux.outputs.ready == 'true'
    runs-on: [self-hosted, linux, x64, npu, sweep]
    timeout-minutes: 120

    strategy:
      # One job per modality, so they can spread across however many runners
      # carry the labels above, and "Re-run failed jobs" restarts only what
      # broke. fail-fast stays off so one modality failing does not cancel the
      # others mid-sweep.
      fail-fast: false
      matrix:
        # sweep_embedding.py, sweep_audio.py and sweep_decision.py are ready and tested, but stay
        # out of the matrix until llm and vision have proven themselves against
        # real hardware. Add them back here to enable them; nothing else needs
        # to change.
        task: [llm, vision]

    env:
      # Weights are expected at $FLM_MODEL_PATH/models/<ModelName>
      FLM_MODEL_PATH: /scratch

    steps:
      # Only the sweep scripts and their test assets, never the sources: this
      # job runs a prebuilt binary and compiles nothing. src/ is ~880 MB of
      # code and test media that every sweep job would otherwise copy onto an
      # NPU machine for no reason. Cone mode also brings the root files along,
      # which are small enough not to matter.
      - name: Checkout sweep scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/script
          # sparse-checkout alone still downloads every blob at this depth.
          # blob:none makes git fetch only the blobs the sparse paths need.
          filter: blob:none

      # Exactly one of the next two steps runs. Both land the same
      # fastflowlm_<version>_linux.tar.gz in build-artifact/, so the unpack
      # step below does not care which one it was.

      # Pinned to the exact run that resolve-linux confirmed, so this cannot
      # resolve to an older green build of the same branch. The artifact is
      # named "portable" and holds a single tarball.
      - name: Download Linux portable build (CI run)
        if: needs.resolve-linux.outputs.mode == 'run'
        uses: dawidd6/action-download-artifact@v25
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ needs.resolve-linux.outputs.run_id }}
          name: portable
          path: build-artifact
          if_no_artifact_found: fail

      # A JavaScript action, so it needs nothing installed on the self-hosted
      # runner beyond the node the runner already ships. extract stays off:
      # the unpack step below handles the tarball, and it also has to handle
      # the CI-artifact case.
      - name: Download Linux portable build (release ${{ needs.resolve-linux.outputs.release_tag }})
        if: needs.resolve-linux.outputs.mode == 'release'
        uses: robinraju/release-downloader@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.resolve-linux.outputs.release_tag }}
          fileName: "fastflowlm_*_linux.tar.gz"
          out-file-path: build-artifact

      - name: Unpack Linux portable build
        run: |
          set -euo pipefail
          mkdir -p flm-linux
          tarball=$(ls build-artifact/fastflowlm_*_linux.tar.gz)
          echo "Using tarball: ${tarball}"
          tar xzf "${tarball}" -C flm-linux
          chmod +x flm-linux/flm flm-linux/flm-real
          echo "FLM_BIN=${GITHUB_WORKSPACE}/flm-linux/flm" >> "$GITHUB_ENV"

      - name: Verify FLM binary runs
        run: |
          set -euo pipefail
          "${FLM_BIN}" version

      - name: Set up Python virtualenv
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          for attempt in 1 2 3; do
            .venv/bin/python -m pip install --no-cache-dir openai && break
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
          done

      # Each script starts and stops its own flm server, picks its own models,
      # and exits non-zero if any model failed.
      - name: Run ${{ matrix.task }} sweep
        run: |
          set -euo pipefail
          .venv/bin/python .github/script/sweep_${{ matrix.task }}.py \
            --flm-bin "${FLM_BIN}" \
            --platform linux \
            --gen-lim "${GEN_LIM}" \
            --request-timeout "${REQUEST_TIMEOUT}" \
            --limit "${MODEL_LIMIT}" \
            --output-dir sweep-results

      # Includes the CSV, the summary JSON and the captured server log, so a
      # failed sweep can be diagnosed without access to the runner.
      - name: Upload ${{ matrix.task }} results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-sweep-linux-${{ matrix.task }}-${{ github.run_number }}
          path: sweep-results/
          if-no-files-found: warn
          retention-days: 30

  sweep-linux-models-from-source:
    needs: resolve-linux
    if: needs.resolve-linux.outputs.models_from_source_ready == 'true'
    runs-on: [self-hosted, linux, x64, npu, sweep]
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        task: [llm, vision]

    env:
      FLM_MODEL_PATH: /scratch

    steps:
      - name: Checkout sweep scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/script
          filter: blob:none

      - name: Download Linux models-from-source build
        uses: dawidd6/action-download-artifact@v25
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ needs.resolve-linux.outputs.run_id }}
          name: models-from-source-portable
          path: build-artifact
          if_no_artifact_found: fail

      - name: Unpack Linux models-from-source build
        run: |
          set -euo pipefail
          mkdir -p flm-linux-models-from-source
          tarball=$(ls build-artifact/models-from-source_fastflowlm_*_linux.tar.gz)
          echo "Using tarball: ${tarball}"
          tar xzf "${tarball}" -C flm-linux-models-from-source
          chmod +x flm-linux-models-from-source/flm flm-linux-models-from-source/flm-real
          echo "FLM_BIN=${GITHUB_WORKSPACE}/flm-linux-models-from-source/flm" >> "$GITHUB_ENV"

      - name: Verify FLM binary runs
        run: |
          set -euo pipefail
          "${FLM_BIN}" version

      - name: Set up Python virtualenv
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          for attempt in 1 2 3; do
            .venv/bin/python -m pip install --no-cache-dir openai && break
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
          done

      - name: Run Gemma 4 ${{ matrix.task }} sweep
        run: |
          set -euo pipefail
          .venv/bin/python .github/script/sweep_${{ matrix.task }}.py \
            --flm-bin "${FLM_BIN}" \
            --platform linux-models-from-source \
            --models gemma4-it:e2b gemma4-it:e4b \
            --gen-lim "${GEN_LIM}" \
            --request-timeout "${REQUEST_TIMEOUT}" \
            --output-dir sweep-results

      - name: Upload Gemma 4 ${{ matrix.task }} results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-sweep-linux-models-from-source-${{ matrix.task }}-${{ github.run_number }}
          path: sweep-results/
          if-no-files-found: warn
          retention-days: 30

  # The Linux sweep again, against the HRX build. "Build Linux Portable"
  # produces both from the same run, so this shares its run id with
  # sweep-linux but has its own readiness flag: whichever of the two builds
  # succeeded gets swept, independently of the other.
  sweep-linux-hrx:
    needs: resolve-linux
    # Unset when no Linux HRX build could be resolved, whichever mode we are in.
    if: needs.resolve-linux.outputs.hrx_ready == 'true'
    runs-on: [self-hosted, linux, x64, npu, sweep]
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        # Kept in step with sweep-linux; see the note there about embedding
        # and audio.
        task: [llm, vision]

    env:
      # Weights are expected at $FLM_MODEL_PATH/models/<ModelName>
      FLM_MODEL_PATH: /scratch

    steps:
      # Only the sweep scripts and their test assets, never the sources: this
      # job runs a prebuilt binary and compiles nothing. src/ is ~880 MB of
      # code and test media that every sweep job would otherwise copy onto an
      # NPU machine for no reason. Cone mode also brings the root files along,
      # which are small enough not to matter.
      - name: Checkout sweep scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/script
          # sparse-checkout alone still downloads every blob at this depth.
          # blob:none makes git fetch only the blobs the sparse paths need.
          filter: blob:none

      # Exactly one of the next two steps runs. Both land the same
      # HRX_fastflowlm_<version>_linux.tar.gz in build-artifact/.

      # Same shape as the default artifact, under the HRX- name and holding a
      # single HRX_-prefixed tarball.
      - name: Download Linux HRX portable build (CI run)
        if: needs.resolve-linux.outputs.mode == 'run'
        uses: dawidd6/action-download-artifact@v25
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ needs.resolve-linux.outputs.run_id }}
          name: HRX-portable
          path: build-artifact
          if_no_artifact_found: fail

      - name: Download Linux HRX portable build (release ${{ needs.resolve-linux.outputs.release_tag }})
        if: needs.resolve-linux.outputs.mode == 'release'
        uses: robinraju/release-downloader@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.resolve-linux.outputs.release_tag }}
          fileName: "HRX_fastflowlm_*_linux.tar.gz"
          out-file-path: build-artifact

      - name: Unpack Linux HRX portable build
        run: |
          set -euo pipefail
          mkdir -p flm-linux
          tarball=$(ls build-artifact/HRX_fastflowlm_*_linux.tar.gz)
          echo "Using tarball: ${tarball}"
          tar xzf "${tarball}" -C flm-linux
          chmod +x flm-linux/flm flm-linux/flm-real
          echo "FLM_BIN=${GITHUB_WORKSPACE}/flm-linux/flm" >> "$GITHUB_ENV"

      - name: Verify FLM binary runs
        run: |
          set -euo pipefail
          "${FLM_BIN}" version

      - name: Set up Python virtualenv
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          for attempt in 1 2 3; do
            .venv/bin/python -m pip install --no-cache-dir openai && break
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
          done

      # --platform is only a label, but it is the one that keeps these results
      # apart from the default build's in the filenames and the summary table.
      - name: Run ${{ matrix.task }} sweep
        run: |
          set -euo pipefail
          .venv/bin/python .github/script/sweep_${{ matrix.task }}.py \
            --flm-bin "${FLM_BIN}" \
            --platform linux-hrx \
            --gen-lim "${GEN_LIM}" \
            --request-timeout "${REQUEST_TIMEOUT}" \
            --limit "${MODEL_LIMIT}" \
            --output-dir sweep-results

      - name: Upload ${{ matrix.task }} results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-sweep-linux-hrx-${{ matrix.task }}-${{ github.run_number }}
          path: sweep-results/
          if-no-files-found: warn
          retention-days: 30

  sweep-windows:
    needs: resolve-windows
    # Unset when no Windows build could be resolved, whichever mode we are in.
    if: needs.resolve-windows.outputs.ready == 'true'
    runs-on: [self-hosted, windows, x64, npu, sweep]
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        # sweep_embedding.py, sweep_audio.py and sweep_decision.py are ready and tested, but stay
        # out of the matrix until llm and vision have proven themselves against
        # real hardware. Add them back here to enable them; nothing else needs
        # to change.
        task: [llm, vision]

    steps:
      # Only the sweep scripts and their test assets, never the sources: this
      # job runs a prebuilt binary and compiles nothing. src/ is ~880 MB of
      # code and test media that every sweep job would otherwise copy onto an
      # NPU machine for no reason. Cone mode also brings the root files along,
      # which are small enough not to matter.
      - name: Checkout sweep scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/script
          # sparse-checkout alone still downloads every blob at this depth.
          # blob:none makes git fetch only the blobs the sparse paths need.
          filter: blob:none

      - name: Resolve model path
        shell: powershell
        run: |
          $modelPath = Join-Path $env:USERPROFILE ".flm"
          New-Item -ItemType Directory -Force $modelPath | Out-Null
          "FLM_MODEL_PATH=$modelPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Exactly one of the next two steps runs. Both leave flm.exe and its DLLs
      # at the top level of flm-windows/, which is where the verify step looks.

      # "Build Windows Packages" publishes the portable payload under
      # fastflowlm-windows-<sha>. Both workflows run off the same event, so
      # github.sha matches; the run id from resolve-windows pins which run it
      # comes from.
      - name: Download Windows portable build (CI run)
        if: needs.resolve-windows.outputs.mode == 'run'
        uses: dawidd6/action-download-artifact@v25
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ needs.resolve-windows.outputs.run_id }}
          name: fastflowlm-windows-${{ github.sha }}
          path: flm-windows
          if_no_artifact_found: fail

      # The release zip is that same artifact's contents zipped from inside the
      # directory, so extracting it in place reproduces the CI layout. The zip
      # itself stays alongside, which is harmless.
      - name: Download Windows portable build (release ${{ needs.resolve-windows.outputs.release_tag }})
        if: needs.resolve-windows.outputs.mode == 'release'
        uses: robinraju/release-downloader@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.resolve-windows.outputs.release_tag }}
          fileName: "fastflowlm_*_windows_amd64.zip"
          out-file-path: flm-windows
          extract: true

      - name: Verify FLM binary runs
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $flm = Join-Path $env:GITHUB_WORKSPACE "flm-windows\flm.exe"
          if (-not (Test-Path $flm)) {
            throw "flm.exe not found at $flm"
          }
          "FLM_BIN=$flm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $flm version

      - name: Set up Python virtualenv
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install openai

      - name: Run ${{ matrix.task }} sweep
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $cmdArgs = @(
            ".github\script\sweep_${{ matrix.task }}.py",
            "--flm-bin", $env:FLM_BIN,
            "--platform", "windows",
            "--gen-lim", $env:GEN_LIM,
            "--request-timeout", $env:REQUEST_TIMEOUT,
            "--limit", $env:MODEL_LIMIT,
            "--output-dir", "sweep-results"
          )
          & ".\.venv\Scripts\python.exe" $cmdArgs
          # A native command's exit code does not trip ErrorActionPreference.
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload ${{ matrix.task }} results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-sweep-windows-${{ matrix.task }}-${{ github.run_number }}
          path: sweep-results/
          if-no-files-found: warn
          retention-days: 30

  sweep-windows-models-from-source:
    needs: resolve-windows
    if: needs.resolve-windows.outputs.models_from_source_ready == 'true'
    runs-on: [self-hosted, windows, x64, npu, sweep]
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        task: [llm, vision]

    steps:
      - name: Checkout sweep scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/script
          filter: blob:none

      - name: Resolve model path
        shell: powershell
        run: |
          $modelPath = Join-Path $env:USERPROFILE ".flm"
          New-Item -ItemType Directory -Force $modelPath | Out-Null
          "FLM_MODEL_PATH=$modelPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download Windows models-from-source build
        uses: dawidd6/action-download-artifact@v25
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ needs.resolve-windows.outputs.run_id }}
          name: models-from-source-fastflowlm-windows-${{ github.sha }}
          path: flm-windows-models-from-source
          if_no_artifact_found: fail

      - name: Verify FLM binary runs
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $flm = Join-Path $env:GITHUB_WORKSPACE "flm-windows-models-from-source\flm.exe"
          if (-not (Test-Path $flm)) {
            throw "flm.exe not found at $flm"
          }
          "FLM_BIN=$flm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $flm version

      - name: Set up Python virtualenv
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install openai

      - name: Run models-from-source ${{ matrix.task }} sweep
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $cmdArgs = @(
            ".github\script\sweep_${{ matrix.task }}.py",
            "--flm-bin", $env:FLM_BIN,
            "--platform", "windows-models-from-source",
            "--models", "gemma4-it:e2b", "gemma4-it:e4b",
            "--gen-lim", $env:GEN_LIM,
            "--request-timeout", $env:REQUEST_TIMEOUT,
            "--output-dir", "sweep-results"
          )
          & ".\.venv\Scripts\python.exe" $cmdArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload models-from-source ${{ matrix.task }} results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-sweep-windows-models-from-source-${{ matrix.task }}-${{ github.run_number }}
          path: sweep-results/
          if-no-files-found: warn
          retention-days: 30

  # The Windows sweep again, against the HRX build. "Build Windows Packages"
  # produces both from the same run, so this shares its run id with
  # sweep-windows but has its own readiness flag.
  sweep-windows-hrx:
    needs: resolve-windows
    # Unset when no Windows HRX build could be resolved, whichever mode we are in.
    if: needs.resolve-windows.outputs.hrx_ready == 'true'
    runs-on: [self-hosted, windows, x64, npu, sweep]
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        # Kept in step with sweep-windows; see the note there about embedding
        # and audio.
        task: [llm, vision]

    steps:
      # Only the sweep scripts and their test assets, never the sources: this
      # job runs a prebuilt binary and compiles nothing. src/ is ~880 MB of
      # code and test media that every sweep job would otherwise copy onto an
      # NPU machine for no reason. Cone mode also brings the root files along,
      # which are small enough not to matter.
      - name: Checkout sweep scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/script
          # sparse-checkout alone still downloads every blob at this depth.
          # blob:none makes git fetch only the blobs the sparse paths need.
          filter: blob:none

      - name: Resolve model path
        shell: powershell
        run: |
          $modelPath = Join-Path $env:USERPROFILE ".flm"
          New-Item -ItemType Directory -Force $modelPath | Out-Null
          "FLM_MODEL_PATH=$modelPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Exactly one of the next two steps runs. Both leave flm.exe and its DLLs
      # at the top level of flm-windows/, which is where the verify step looks.

      # Same payload as the default Windows portable artifact, under the HRX-
      # prefixed name: flm.exe and its DLLs at the top level, with the HRX op
      # libraries and hrx.dll overlaid.
      - name: Download Windows HRX portable build (CI run)
        if: needs.resolve-windows.outputs.mode == 'run'
        uses: dawidd6/action-download-artifact@v25
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ needs.resolve-windows.outputs.run_id }}
          name: HRX-fastflowlm-windows-${{ github.sha }}
          path: flm-windows
          if_no_artifact_found: fail

      # The HRX release zip is that same artifact zipped from inside the
      # directory, so extracting it in place reproduces the CI layout.
      - name: Download Windows HRX portable build (release ${{ needs.resolve-windows.outputs.release_tag }})
        if: needs.resolve-windows.outputs.mode == 'release'
        uses: robinraju/release-downloader@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.resolve-windows.outputs.release_tag }}
          fileName: "HRX_fastflowlm_*_windows_amd64.zip"
          out-file-path: flm-windows
          extract: true

      - name: Verify FLM binary runs
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $flm = Join-Path $env:GITHUB_WORKSPACE "flm-windows\flm.exe"
          if (-not (Test-Path $flm)) {
            throw "flm.exe not found at $flm"
          }
          "FLM_BIN=$flm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $flm version

      - name: Set up Python virtualenv
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install openai

      # --platform is only a label, but it is the one that keeps these results
      # apart from the default build's in the filenames and the summary table.
      - name: Run ${{ matrix.task }} sweep
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $cmdArgs = @(
            ".github\script\sweep_${{ matrix.task }}.py",
            "--flm-bin", $env:FLM_BIN,
            "--platform", "windows-hrx",
            "--gen-lim", $env:GEN_LIM,
            "--request-timeout", $env:REQUEST_TIMEOUT,
            "--limit", $env:MODEL_LIMIT,
            "--output-dir", "sweep-results"
          )
          & ".\.venv\Scripts\python.exe" $cmdArgs
          # A native command's exit code does not trip ErrorActionPreference.
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload ${{ matrix.task }} results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-sweep-windows-hrx-${{ matrix.task }}-${{ github.run_number }}
          path: sweep-results/
          if-no-files-found: warn
          retention-days: 30

  # Reporting only, no NPU needed, so this one stays on a GitHub-hosted runner.
  summary:
    runs-on: ubuntu-latest
    needs: [sweep-linux, sweep-linux-models-from-source, sweep-windows, sweep-windows-models-from-source, sweep-linux-hrx, sweep-windows-hrx]
    if: always()
    steps:
      # Only the sweep scripts and their test assets, never the sources: this
      # job runs a prebuilt binary and compiles nothing. src/ is ~880 MB of
      # code and test media that every sweep job would otherwise copy onto an
      # NPU machine for no reason. Cone mode also brings the root files along,
      # which are small enough not to matter.
      - name: Checkout sweep scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/script
          # sparse-checkout alone still downloads every blob at this depth.
          # blob:none makes git fetch only the blobs the sparse paths need.
          filter: blob:none

      - name: Download sweep artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: model-sweep-*
          path: sweep-results

      - name: Write job summary
        run: |
          set -euo pipefail
          python3 .github/script/sweep_summary.py sweep-results \
            --linux-result "${{ needs.sweep-linux.result }}" \
            --windows-result "${{ needs.sweep-windows.result }}" \
            --linux-hrx-result "${{ needs.sweep-linux-hrx.result }}" \
            --windows-hrx-result "${{ needs.sweep-windows-hrx.result }}" \
            --linux-models-from-source-result "${{ needs.sweep-linux-models-from-source.result }}" \
            --windows-models-from-source-result "${{ needs.sweep-windows-models-from-source.result }}" \
            >> "$GITHUB_STEP_SUMMARY"
