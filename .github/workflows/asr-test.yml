name: ASR Test

# Measures speech recognition on real NPU hardware whenever ASR code changes.
# Nothing is rebuilt here: like the model sweep, this tests the portable builds
# that "Build Linux Portable" and "Build Windows Packages" produce for the same
# commit, default and HRX alike. .github/script/asr_test.py holds the checks
# and .github/script/assets/asr_eval/ the FLEURS evaluation set.
#
# On a pull request, main's latest build runs first on the same machine and
# becomes the baseline. The run fails if the pooled error rate rises by more
# than 1 point, any one set's by more than 5, or the number of runaway
# transcripts grows; the report also shows how far the transcripts moved.
# Pushes to main and the weekly run have no baseline build, so they compare
# against the per-platform rates in asr_eval/expected.json instead, with
# 2 points of slack on the pooled rate (those rates come from one machine per
# platform) and the same 5 points per set.
#
# The trigger paths are the Whisper engine, its NPU kernels and prebuilt NPU
# libraries, the audio decoders, front end and FFT code, the audio front ends of
# the chat models that transcribe, and the server files that host
# /v1/audio/transcriptions. Those server files also hold every other endpoint,
# so any change to them runs this test too. The pull_request and push path
# lists must stay identical. Shared files such as src/CMakeLists.txt and
# lm_config.hpp are left out, since every change touches them.
#
# Because rest_handler.cpp and server.cpp are shared, the `gate` job below looks
# at what a pull request or push really changed before any NPU machine is
# reserved: .github/script/asr_gate.sh runs the test when an ASR-only file
# changed, or when a changed line in those two server files is about audio or
# speech, and skips it otherwise (for example a model family adding a tag to
# the REST handler). The weekly run and manual dispatches always run.
#
# The weekly run catches what no commit changes: Whisper weights republished
# on Hugging Face, and NPU driver or firmware updates on the runners.
#
# A manual dispatch tests the dispatched ref's commit, or a pull request's
# builds when given its number.

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/common/whisper/**'
      - 'src/include/whisper/**'
      - 'src/xclbins/Whisper-V3-Turbo-NPU2/**'
      - 'src/lib/xrt/*whisper_npu*'
      - 'src/lib/hrx/*whisper_npu*'
      - 'src/common/audio_process_utils/**'
      - 'src/include/audio_process_utils/**'
      - 'src/common/audio/**'
      - 'src/include/audio/**'
      - 'src/common/AutoModel/*_audio.cpp'
      - 'src/detail/gemma4e_npu/gemma4e_audio*'
      - 'src/include/pocketfft/**'
      - 'src/include/dr_libs/**'
      - 'src/cmake/FlmAudioCodecs.cmake'
      - 'src/server/rest_handler.cpp'
      - 'src/server/server.cpp'
      - 'src/server/multipart.cpp'
      - 'src/server/multipart.hpp'
      - 'src/test/whisper_npu/**'
      - '.github/script/asr_test.py'
      - '.github/script/asr_summary.py'
      - '.github/script/asr_gate.sh'
      - '.github/script/sweep_common.py'
      - '.github/script/assets/asr_eval/**'
      - '.github/workflows/asr-test.yml'
  push:
    branches: [ main ]
    paths:
      - 'src/common/whisper/**'
      - 'src/include/whisper/**'
      - 'src/xclbins/Whisper-V3-Turbo-NPU2/**'
      - 'src/lib/xrt/*whisper_npu*'
      - 'src/lib/hrx/*whisper_npu*'
      - 'src/common/audio_process_utils/**'
      - 'src/include/audio_process_utils/**'
      - 'src/common/audio/**'
      - 'src/include/audio/**'
      - 'src/common/AutoModel/*_audio.cpp'
      - 'src/detail/gemma4e_npu/gemma4e_audio*'
      - 'src/include/pocketfft/**'
      - 'src/include/dr_libs/**'
      - 'src/cmake/FlmAudioCodecs.cmake'
      - 'src/server/rest_handler.cpp'
      - 'src/server/server.cpp'
      - 'src/server/multipart.cpp'
      - 'src/server/multipart.hpp'
      - 'src/test/whisper_npu/**'
      - '.github/script/asr_test.py'
      - '.github/script/asr_summary.py'
      - '.github/script/asr_gate.sh'
      - '.github/script/sweep_common.py'
      - '.github/script/assets/asr_eval/**'
      - '.github/workflows/asr-test.yml'
  schedule:
    - cron: '23 4 * * 1'  # Mondays 04:23 UTC
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number whose builds to test (blank = the dispatched ref)"
        type: string
        default: ""
      require:
        description: "Feature groups that must pass, space-separated (blank = the default below)"
        type: string
        default: ""
      max_drift:
        description: "Fail a set whose transcripts differ from the baseline's by more than this fraction (blank = report only)"
        type: string
        default: ""

permissions:
  contents: read
  # Needed to list and download artifacts from the build workflow runs.
  actions: read

# Only the newest commit on a ref is worth an NPU machine. The event name keeps
# the weekly run and a push to main from cancelling each other.
concurrency:
  group: asr-test-${{ github.ref }}-${{ github.event_name }}-${{ inputs.pr }}
  cancel-in-progress: true

env:
  # Feature groups main passes on every platform, so a pull request that
  # breaks one fails. Add a group in the pull request that makes main pass it:
  # window_tail, language, quiet_log. The rest are measured and reported as
  # warnings. window_tail is not here yet because main's Linux HRX build loops
  # on the long-form file; a pull request that adds repeats is still caught by
  # the baseline check.
  ASR_REQUIRE: ${{ inputs.require || 'prompt verbose_json timestamp_rules' }}
  ASR_MAX_DRIFT: ${{ inputs.max_drift || '' }}

jobs:
  # Cheap hosted-runner check that the change is about ASR (see the header). Every
  # later job hangs off resolve-build, so skipping that one skips the whole run,
  # including the summary. Anything the script cannot decide counts as "run".
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Checkout (history without file contents)
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Decide
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) range="${PR_BASE}...${PR_HEAD}" ;;
            push)         range="${PUSH_BEFORE}..${PUSH_AFTER}" ;;
            *)            range="" ;;   # schedule, workflow_dispatch: always run
          esac
          bash .github/script/asr_gate.sh "$range" | tee -a "$GITHUB_OUTPUT"

  # Waits on a hosted runner for the build runs under test, the same way the
  # model sweep's resolve-build does, and pins each to a run id so a stale
  # artifact from an earlier push can never be tested. For a pull request it
  # also finds main's latest successful build as the baseline. Outputs one
  # JSON list of builds per platform, which the test jobs expand into their
  # matrix.
  resolve-build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      linux_run_id: ${{ steps.resolve.outputs.linux_run_id }}
      windows_run_id: ${{ steps.resolve.outputs.windows_run_id }}
      linux_base_run_id: ${{ steps.resolve.outputs.linux_base_run_id }}
      windows_base_run_id: ${{ steps.resolve.outputs.windows_base_run_id }}
      linux_builds: ${{ steps.resolve.outputs.linux_builds }}
      windows_builds: ${{ steps.resolve.outputs.windows_builds }}

    steps:
      - name: Wait for the portable builds
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr }}
          # A pull_request run records the PR head commit in head_sha, while
          # github.sha is the synthetic merge commit. Try both. On a push, a
          # dispatch or the weekly run only the second is set; for the weekly
          # run it is main's latest commit, built by that commit's push.
          CANDIDATE_SHAS: ${{ github.event.pull_request.head.sha }} ${{ github.sha }}
          WANT_BASELINE: ${{ github.event_name == 'pull_request' || inputs.pr != '' }}
        run: |
          set -euo pipefail

          POLL_SECONDS=20
          APPEAR_DEADLINE=$(( SECONDS + 10 * 60 ))
          FINISH_DEADLINE=$(( SECONDS + 80 * 60 ))
          linux_builds='[]'
          windows_builds='[]'

          if [ -n "${PR_NUMBER}" ]; then
            CANDIDATE_SHAS=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')
            echo "Testing pull request #${PR_NUMBER} at ${CANDIDATE_SHAS}."
          fi

          # Newest run for whichever candidate SHA matches, or empty.
          find_run() {
            local workflow="$1" sha run_id
            for sha in ${CANDIDATE_SHAS}; do
              run_id=$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?head_sha=${sha}&per_page=100" \
                --jq 'if (.workflow_runs | length) == 0 then "" else (.workflow_runs | sort_by(.run_number) | last | .id) end')
              if [ -n "${run_id}" ]; then
                printf '%s' "${run_id}"
                return 0
              fi
            done
          }

          list_artifacts() {
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/$1/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired | not) | .name'
          }

          # main's newest successful push build that still has its artifacts.
          # Sets base_run_id and base_artifacts, both empty when there is none.
          # Not called in $(...), which would lose the assignments.
          base_run_id=""
          base_artifacts=""
          find_base() {
            local workflow="$1" run_id
            base_run_id=""
            base_artifacts=""
            for run_id in $(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=main&event=push&status=success&per_page=10" \
              --jq '.workflow_runs[].id'); do
              base_artifacts=$(list_artifacts "${run_id}")
              if [ -n "${base_artifacts}" ]; then
                base_run_id="${run_id}"
                return 0
              fi
            done
          }

          # Appends {artifact, base_artifact, platform} to the named list when
          # the run published an artifact matching the pattern. An artifact
          # exists only if its build job got all the way through, so a failed
          # HRX build drops just the HRX test. base_artifact is empty when
          # there is no baseline build of that kind.
          add_build() {
            local list="$1" artifacts="$2" pattern="$3" platform="$4" name base
            name=$(printf '%s\n' "${artifacts}" | grep -E "${pattern}" | head -n 1 || true)
            if [ -z "${name}" ]; then
              echo "::warning::No ${platform} portable artifact was published; skipping that test."
              return 0
            fi
            base=$(printf '%s\n' "${base_artifacts}" | grep -E "${pattern}" | head -n 1 || true)
            echo "  ${platform}: ${name} (baseline: ${base:-none})"
            printf -v "${list}" '%s' "$(jq -c --arg a "${name}" --arg b "${base}" --arg p "${platform}" \
              '. + [{artifact: $a, base_artifact: $b, platform: $p}]' <<< "${!list}")"
          }

          wait_for_build() {
            local workflow="$1" platform="$2" default_pattern="$3" hrx_pattern="$4"
            local run_id="" status artifacts

            while :; do
              run_id=$(find_run "${workflow}")
              [ -n "${run_id}" ] && break
              if [ "${SECONDS}" -ge "${APPEAR_DEADLINE}" ]; then
                echo "::warning::No ${workflow} run appeared for this commit; skipping ${platform}."
                return 1
              fi
              echo "Waiting for a ${workflow} run to appear..."
              sleep "${POLL_SECONDS}"
            done

            while :; do
              status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')
              [ "${status}" = "completed" ] && break
              if [ "${SECONDS}" -ge "${FINISH_DEADLINE}" ]; then
                echo "::warning::${workflow} run ${run_id} is still ${status}; skipping ${platform}."
                return 1
              fi
              echo "${workflow} run ${run_id} is ${status}; checking again in ${POLL_SECONDS}s."
              sleep "${POLL_SECONDS}"
            done

            artifacts=$(list_artifacts "${run_id}")
            echo "${workflow} run ${run_id} published:"
            printf '%s\n' "${artifacts}" | sed 's/^/  /'
            echo "${platform}_run_id=${run_id}" >> "$GITHUB_OUTPUT"

            base_artifacts=""
            if [ "${WANT_BASELINE}" = "true" ]; then
              find_base "${workflow}"
              if [ -n "${base_run_id}" ]; then
                echo "Baseline: main's ${workflow} run ${base_run_id}."
                echo "${platform}_base_run_id=${base_run_id}" >> "$GITHUB_OUTPUT"
              else
                echo "::warning::No ${workflow} build of main has artifacts left; ${platform} runs without a baseline."
              fi
            fi

            # Fully anchored, so neither pattern matches the other's artifact,
            # the models-from-source one, or "fastflowlm-windows-msi-<sha>".
            add_build "${platform}_builds" "${artifacts}" "${default_pattern}" "${platform}"
            add_build "${platform}_builds" "${artifacts}" "${hrx_pattern}" "${platform}-hrx"
          }

          wait_for_build debian-portable.yml linux \
            '^portable$' '^HRX-portable$' || true
          wait_for_build windows-build.yml windows \
            '^fastflowlm-windows-[0-9a-f]+$' '^HRX-fastflowlm-windows-[0-9a-f]+$' || true

          {
            echo "linux_builds=${linux_builds}"
            echo "windows_builds=${windows_builds}"
          } >> "$GITHUB_OUTPUT"

          # One missing platform is a warning above; nothing at all to test
          # would otherwise leave a green check that tested nothing.
          if [ "${linux_builds}" = "[]" ] && [ "${windows_builds}" = "[]" ]; then
            # The Linux portable artifact is kept for 7 days, so a weekly run
            # after a quiet week on main can find nothing left to download.
            echo "::error::No portable build was found, so nothing was tested. Build artifacts expire, so for an older commit, rerun the build workflows first."
            exit 1
          fi

  asr-linux:
    name: asr (${{ matrix.build.platform }})
    needs: resolve-build
    if: needs.resolve-build.outputs.linux_builds != '[]'
    runs-on: [self-hosted, linux, x64, npu, sweep]
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.resolve-build.outputs.linux_builds) }}

    env:
      # Weights are expected at $FLM_MODEL_PATH/models/<ModelName>
      FLM_MODEL_PATH: /scratch

    steps:
      # Only the scripts and their test assets; this job compiles nothing.
      - name: Checkout test scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/script
          filter: blob:none

      - name: Download ${{ matrix.build.platform }} portable build
        uses: dawidd6/action-download-artifact@v25
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ needs.resolve-build.outputs.linux_run_id }}
          name: ${{ matrix.build.artifact }}
          path: build-artifact
          if_no_artifact_found: fail

      - name: Download baseline build
        if: matrix.build.base_artifact != ''
        uses: dawidd6/action-download-artifact@v25
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ needs.resolve-build.outputs.linux_base_run_id }}
          name: ${{ matrix.build.base_artifact }}
          path: base-artifact
          if_no_artifact_found: fail

      - name: Unpack portable builds
        run: |
          set -euo pipefail
          for build in build base; do
            [ -d "${build}-artifact" ] || continue
            mkdir -p "flm-${build}"
            tarball=$(ls "${build}"-artifact/*_linux.tar.gz)
            echo "Using tarball: ${tarball}"
            tar xzf "${tarball}" -C "flm-${build}"
            chmod +x "flm-${build}/flm" "flm-${build}/flm-real"
            "flm-${build}/flm" version
          done
          echo "FLM_BIN=${GITHUB_WORKSPACE}/flm-build/flm" >> "$GITHUB_ENV"

      # No-ops once the weights are on the runner.
      - name: Pull models
        run: |
          set -euo pipefail
          "${FLM_BIN}" pull whisper-v3:turbo
          "${FLM_BIN}" pull gemma4-it:e2b
          "${FLM_BIN}" pull gemma4-it:12b

      - name: Set up Python virtualenv
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          for attempt in 1 2 3; do
            .venv/bin/python -m pip install --no-cache-dir openai && break
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
          done

      # The baseline's own failures are reported in its results, not here:
      # what matters is how the build under test compares with it.
      - name: Run ASR test on the baseline
        if: matrix.build.base_artifact != ''
        run: |
          .venv/bin/python .github/script/asr_test.py \
            --flm-bin "${GITHUB_WORKSPACE}/flm-base/flm" \
            --platform "${{ matrix.build.platform }}" \
            --output-dir asr-baseline || true

      - name: Run ASR test
        run: |
          set -euo pipefail
          args=(--flm-bin "${FLM_BIN}" --platform "${{ matrix.build.platform }}"
                --output-dir asr-results)
          baseline=$(ls asr-baseline/*_results.json 2>/dev/null || true)
          if [ -n "${baseline}" ]; then
            args+=(--baseline "${baseline}")
          else
            # Expected rates come from one machine, so the pooled rate gets
            # 2 points of slack instead of 1; sets keep their 5 points.
            args+=(--expected .github/script/assets/asr_eval/expected.json --tolerance 2)
          fi
          [ -n "${ASR_REQUIRE}" ] && args+=(--require ${ASR_REQUIRE})
          [ -n "${ASR_MAX_DRIFT}" ] && args+=(--max-drift "${ASR_MAX_DRIFT}")
          .venv/bin/python .github/script/asr_test.py "${args[@]}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asr-test-${{ matrix.build.platform }}-${{ github.run_number }}
          path: |
            asr-results/
            asr-baseline/
          if-no-files-found: warn
          retention-days: 30

  asr-windows:
    name: asr (${{ matrix.build.platform }})
    needs: resolve-build
    if: needs.resolve-build.outputs.windows_builds != '[]'
    runs-on: [self-hosted, windows, x64, npu, sweep]
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.resolve-build.outputs.windows_builds) }}

    steps:
      - name: Checkout test scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/script
          filter: blob:none

      - name: Resolve model path
        shell: powershell
        run: |
          $modelPath = Join-Path $env:USERPROFILE ".flm"
          New-Item -ItemType Directory -Force $modelPath | Out-Null
          "FLM_MODEL_PATH=$modelPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # The artifacts hold flm.exe and its DLLs at the top level.
      - name: Download ${{ matrix.build.platform }} portable build
        uses: dawidd6/action-download-artifact@v25
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ needs.resolve-build.outputs.windows_run_id }}
          name: ${{ matrix.build.artifact }}
          path: flm-build
          if_no_artifact_found: fail

      - name: Download baseline build
        if: matrix.build.base_artifact != ''
        uses: dawidd6/action-download-artifact@v25
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ needs.resolve-build.outputs.windows_base_run_id }}
          name: ${{ matrix.build.base_artifact }}
          path: flm-base
          if_no_artifact_found: fail

      - name: Verify FLM binaries run
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($build in "flm-build", "flm-base") {
            $flm = Join-Path $env:GITHUB_WORKSPACE "$build\flm.exe"
            if (Test-Path $flm) { & $flm version }
            elseif ($build -eq "flm-build") { throw "flm.exe not found at $flm" }
          }
          "FLM_BIN=$(Join-Path $env:GITHUB_WORKSPACE 'flm-build\flm.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # No-ops once the weights are on the runner.
      - name: Pull models
        shell: powershell
        run: |
          foreach ($model in "whisper-v3:turbo", "gemma4-it:e2b", "gemma4-it:12b") {
            & $env:FLM_BIN pull $model
            # A native command's exit code does not trip ErrorActionPreference.
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Set up Python virtualenv
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install openai

      # See the Linux job: the baseline's own failures do not fail this job.
      - name: Run ASR test on the baseline
        if: matrix.build.base_artifact != ''
        shell: powershell
        run: |
          & ".\.venv\Scripts\python.exe" .github\script\asr_test.py `
            --flm-bin (Join-Path $env:GITHUB_WORKSPACE "flm-base\flm.exe") `
            --platform "${{ matrix.build.platform }}" `
            --output-dir asr-baseline
          exit 0

      - name: Run ASR test
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $cmdArgs = @(
            ".github\script\asr_test.py",
            "--flm-bin", $env:FLM_BIN,
            "--platform", "${{ matrix.build.platform }}",
            "--output-dir", "asr-results"
          )
          $baseline = Get-ChildItem asr-baseline\*_results.json -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($baseline) {
            $cmdArgs += @("--baseline", $baseline.FullName)
          } else {
            # Expected rates come from one machine, so the pooled rate gets
            # 2 points of slack instead of 1; sets keep their 5 points.
            $cmdArgs += @("--expected", ".github\script\assets\asr_eval\expected.json", "--tolerance", "2")
          }
          if ($env:ASR_REQUIRE) { $cmdArgs += @("--require") + ($env:ASR_REQUIRE -split '\s+') }
          if ($env:ASR_MAX_DRIFT) { $cmdArgs += @("--max-drift", $env:ASR_MAX_DRIFT) }
          & ".\.venv\Scripts\python.exe" $cmdArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asr-test-${{ matrix.build.platform }}-${{ github.run_number }}
          path: |
            asr-results/
            asr-baseline/
          if-no-files-found: warn
          retention-days: 30

  # One report for the whole run, a section per model with the platforms side
  # by side, so it is clear which model failed where. Each job's own report is
  # in its artifact. Reporting only, so it stays on a GitHub-hosted runner.
  summary:
    runs-on: ubuntu-latest
    needs: [resolve-build, asr-linux, asr-windows]
    if: always() && needs.resolve-build.result == 'success'
    steps:
      - name: Checkout test scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/script
          filter: blob:none

      - name: Download results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: asr-test-*-${{ github.run_number }}
          path: asr-artifacts

      - name: Write job summary
        run: |
          set -euo pipefail
          python3 .github/script/asr_summary.py asr-artifacts >> "$GITHUB_STEP_SUMMARY"
