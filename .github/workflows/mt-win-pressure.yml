name: Hy-MT Windows bench and pressure (temporary)

# Branch-only, not for main: flm bench (1k..8k) for hy-mt3-flash:1.8b and hy-mt2-flash:1.8b, then
# .github/script/mt_pressure.py, on a Windows NPU runner against the Windows package that Build and Test
# run 45470177569 built for PR #1127. Push to pressure/hy-mt3-win to run it.

on:
  push:
    branches: [pressure/hy-mt3-win]

concurrency:
  group: mt-win-pressure
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  pressure:
    name: Hy-MT bench + pressure (Windows XRT)
    if: github.ref == 'refs/heads/pressure/hy-mt3-win'
    runs-on: [self-hosted, windows, x64, npu, sweep]
    timeout-minutes: 75
    env:
      PKG_RUN: "45470177569"
      PKG_NAME: fastflowlm-windows-893ea2f6e3db192d4b1d73a7d36724cfc8b35a42
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            .github/script
      - name: Download package built by the PR's CI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.PKG_NAME }}
          run-id: ${{ env.PKG_RUN }}
          github-token: ${{ github.token }}
          path: package
      - name: Prepare package
        id: package
        uses: ./.github/actions/install-package
        with:
          kind: portable
          path: package
      - name: Machine
        shell: powershell
        run: |
          Write-Host "runner $env:RUNNER_NAME"
          Get-CimInstance Win32_Processor | Select-Object -First 1 Name | Format-List
          Get-Process -Name flm -ErrorAction SilentlyContinue | Format-Table Id, Path
      - name: Pull models
        shell: powershell
        env:
          FLM_BIN: ${{ steps.package.outputs.flm-bin }}
        run: |
          if (-not $env:FLM_MODEL_PATH) {
            $env:FLM_MODEL_PATH = Join-Path $env:USERPROFILE ".flm"
            New-Item -ItemType Directory -Force $env:FLM_MODEL_PATH | Out-Null
          }
          foreach ($m in "hy-mt3-flash:1.8b", "hy-mt2-flash:1.8b") {
            & $env:FLM_BIN pull $m
            if ($LASTEXITCODE -ne 0) { throw "flm pull $m failed ($LASTEXITCODE)" }
          }
      - name: Bench (context 1k..8k)
        shell: powershell
        env:
          FLM_BIN: ${{ steps.package.outputs.flm-bin }}
        run: |
          if (-not $env:FLM_MODEL_PATH) { $env:FLM_MODEL_PATH = Join-Path $env:USERPROFILE ".flm" }
          New-Item -ItemType Directory -Force bench-out | Out-Null
          Set-Location bench-out
          foreach ($m in "hy-mt3-flash:1.8b", "hy-mt2-flash:1.8b") {
            Write-Host "===== flm bench $m"
            & $env:FLM_BIN bench $m --ctx-len 8192 --bench-iterations 3
            if ($LASTEXITCODE -ne 0) { throw "flm bench $m failed ($LASTEXITCODE)" }
          }
          Get-ChildItem *.csv | ForEach-Object { Write-Host "--- $($_.Name)"; Get-Content $_ }
      - name: Perf by context length (MT3, then MT2)
        shell: powershell
        working-directory: .github/script
        env:
          FLM_BIN: ${{ steps.package.outputs.flm-bin }}
          PYTHONUTF8: "1"
        run: |
          if (-not $env:FLM_MODEL_PATH) { $env:FLM_MODEL_PATH = Join-Path $env:USERPROFILE ".flm" }
          foreach ($m in "hy-mt3-flash:1.8b", "hy-mt2-flash:1.8b") {
            python mt_pressure.py --flm-bin $env:FLM_BIN --model $m --perf --seconds 0 --out "$env:GITHUB_WORKSPACE\perf-out"
          }
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mt-win-pressure-logs
          path: |
            perf-out
            bench-out
          if-no-files-found: ignore
      - name: Clear stale flm
        if: always()
        shell: powershell
        run: |
          $work = Split-Path (Split-Path $env:GITHUB_WORKSPACE)
          Get-Process -Name flm -ErrorAction SilentlyContinue |
            Where-Object { $_.Path -and $_.Path.StartsWith($work, [StringComparison]::OrdinalIgnoreCase) } |
            Stop-Process -Force -ErrorAction SilentlyContinue
