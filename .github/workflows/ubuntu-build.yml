name: Build Deb Packages

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # The d3 System One contract (src/common/decision) against fixtures written by the upstream
  # package: prompt bytes, request/question errors and answer objects. CPU only, no NPU.
  d3-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build and run the d3 contract test
        run: |
          cmake -S src/test/d3_contract -B build-d3-contract -DCMAKE_BUILD_TYPE=Release
          cmake --build build-d3-contract -j"$(nproc)"
          ctest --test-dir build-d3-contract --output-on-failure

  # continue_final_message (src/common/chat): where the prompt is cut on the template shapes the
  # models ship, and how the output parser reads the continued text. CPU only, no NPU.
  chat-continue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build and run the chat continue test
        run: |
          cmake -S src/test/chat_continue -B build-chat-continue -DCMAKE_BUILD_TYPE=Release
          cmake --build build-chat-continue -j"$(nproc)"
          ctest --test-dir build-chat-continue --output-on-failure

  package-deb:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - version: "24.04"
            codename: "noble"
            distro: "ubuntu"
          - version: "25.10"
            codename: "questing"
            distro: "ubuntu"
          - version: "26.04"
            codename: "resolute"
            distro: "ubuntu"
          - version: "13"
            codename: "trixie"
            distro: "debian"

    container:
      image: ghcr.io/rocm/fastflowlm/build-environment:${{ matrix.distro }}${{ matrix.version }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Configure git safe directory
        run: git config --global --add safe.directory $(pwd)

      - name: Get version from git describe
        id: get_version
        run: |
          VERSION=$(git describe --tags --always)
          # Strip leading 'v' for Debian version compatibility
          DEB_VERSION=$(echo "${VERSION}" | sed 's/^v//')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "deb_version=${DEB_VERSION}" >> $GITHUB_OUTPUT

      - name: Get short SHA
        id: short_sha
        run: echo "sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Create Debian packaging metadata
        working-directory: ${{ github.workspace }}
        run: |
          sed -e "s|@@DEB_VERSION@@|${{ steps.get_version.outputs.deb_version }}|g" \
              -e "s|@@DEB_CODENAME@@|${{ matrix.codename }}|g" \
              -e "s|@@DEB_DATE@@|$(date -R)|g" \
              debian/changelog.in > debian/changelog

          chmod +x debian/rules

      - name: Upgrade Rust toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          rustc --version

      # The build-environment image is rebuilt nightly from main's Dockerfile, so
      # a Build-Depends change reaches it only after merge. Install the ones the
      # image may still lack so dpkg-checkbuilddeps passes in the meantime.
      - name: Install build dependencies missing from the image
        run: |
          apt-get install -y --no-install-recommends libedit-dev

      - name: Build Debian package
        working-directory: ${{ github.workspace }}
        env:
          DEBEMAIL: noreply@example.com
          DEBFULLNAME: fastflowlm
          DEB_VERSION: ${{ steps.get_version.outputs.deb_version }}
        run: |
          dpkg-buildpackage -b -us -uc
          mv ../fastflowlm_${DEB_VERSION}_amd64.deb ./fastflowlm_${DEB_VERSION}_${{ matrix.distro }}${{ matrix.version }}_amd64.deb
          ls -lah ./fastflowlm_${DEB_VERSION}_${{ matrix.distro }}${{ matrix.version }}_amd64.deb
          .github/script/check_no_copyleft_libs.sh \
            ./fastflowlm_${DEB_VERSION}_${{ matrix.distro }}${{ matrix.version }}_amd64.deb

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: flm-${{ matrix.distro }}${{ matrix.version }}-${{ steps.short_sha.outputs.sha }}-deb
          path: ./fastflowlm_${{ steps.get_version.outputs.deb_version }}_${{ matrix.distro }}${{ matrix.version }}_amd64.deb
          if-no-files-found: error

  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: package-deb
    if: github.ref_type == 'tag'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from git describe
        id: get_version
        run: |
          VERSION=$(git describe --tags --always)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Download all deb artifacts
        uses: actions/download-artifact@v4
        with:
          path: debs
          pattern: '*-deb'

      - name: Upload Binaries to Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          file_glob: true
          file: debs/*/*.deb
          overwrite: true
