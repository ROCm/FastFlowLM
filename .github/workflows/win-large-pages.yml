# Windows large pages for NPU buffers (branch ci/win-large-pages only, never merged). Follow-up to
# FastFlowLM#1080: does the Windows NPU driver take a 2 MB large-page user buffer, and do scattered-row
# DMAs get faster? The #1080 DMA probe runs on one Windows NPU runner as the runner account, as SYSTEM
# (temporary scheduled task), and, only if SYSTEM gets no large pages, as the runner account with
# SeLockMemoryPrivilege granted for the run and revoked after (see ci/dma-pages/large_pages.ps1).
# No deliberate hangs.

name: windows large pages

on:
  push:
    branches: [ci/win-large-pages]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: win-large-pages
  cancel-in-progress: false

jobs:
  build-win:
    name: Build Windows
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore build dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\dev
          key: windows-deps-${{ hashFiles('.github/script/ci/setup_windows_deps.ps1', '.github/windows-deps/**') }}
      - name: Set up build dependencies
        shell: powershell
        run: .github\script\ci\setup_windows_deps.ps1
      - name: Build
        shell: powershell
        working-directory: ci/dma-pages
        run: |
          $ErrorActionPreference = 'Stop'
          $b = "$env:RUNNER_TEMP\b"
          cmake -S . -B $b -A x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build $b --config Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $out = "$env:GITHUB_WORKSPACE\dist"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "$b\Release\probe.exe" $out
          Copy-Item -Recurse precompiled, probe_set.ps1, large_pages.ps1 $out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: win-large-pages-bin
          path: dist
          retention-days: 7

  test-win:
    name: NPU Windows large pages
    needs: build-win
    runs-on: [self-hosted, windows, x64, npu, sweep]
    timeout-minutes: 45
    steps:
      # the runner workspace is shared with other workflows
      - name: Clean workspace
        shell: powershell
        run: Remove-Item -Recurse -Force lp, lp-out -ErrorAction SilentlyContinue; exit 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: win-large-pages-bin
          path: lp
      - name: Probe
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force lp-out | Out-Null
          $o = "lp-out\win-$env:RUNNER_NAME.txt"
          & {
            Write-Output "runner $env:RUNNER_NAME"
            Write-Output "cpu $((Get-CimInstance Win32_Processor).Name)"
            Write-Output "os $((Get-CimInstance Win32_OperatingSystem).Version)"
            Get-CimInstance Win32_PnPSignedDriver | Where-Object { $_.DeviceName -match 'NPU' } |
              ForEach-Object { Write-Output "$($_.DeviceName): driver $($_.DriverVersion)" }
            Get-Item C:\Windows\System32\xrt_coreutil.dll | ForEach-Object { Write-Output "xrt_coreutil $($_.VersionInfo.FileVersion)" }
            $p = Get-Process -Name flm*, stress, host -ErrorAction SilentlyContinue
            if ($p) { Write-Output "WARNING: other NPU processes: $($p.Name -join ' ')" }
            & .\lp\large_pages.ps1 -Dir lp -OutDir lp-out
          } 2>&1 | Tee-Object -FilePath $o
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: win-large-pages-out
          path: lp-out
          retention-days: 14
