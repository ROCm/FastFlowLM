name: Build Linux Portable

on:
  push:
    branches: [ main ]
    tags:
      - '*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-portable:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - distro: "debian"
            version: "13"

    container:
      image: ghcr.io/rocm/fastflowlm/build-environment:${{ matrix.distro }}${{ matrix.version }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Configure git safe directory
      run: git config --global --add safe.directory $(pwd)

    - name: Get version from git describe
      id: get_version
      run: |
        VERSION=$(git describe --tags --always | sed 's/^v//')
        echo "version=${VERSION}" >> $GITHUB_OUTPUT

    - name: Get short SHA
      id: short_sha
      run: echo "sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

    - name: Upgrade Rust toolchain
      run: |
        apt-get update
        apt-get install -y uuid-dev nasm patchelf
        apt-get install -y --no-install-recommends curl ca-certificates
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
          sh -s -- -y --profile minimal --default-toolchain stable
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Build FLM portable distribution
      run: |
        cd src
        cmake --preset linux-portable
        cmake --build build -j$(nproc)

    - name: Create installation package
      run: |
        cd src/build
        DESTDIR=$PWD/install cmake --install .

        # Rename binary and wrapper for portable layout
        mv install/opt/fastflowlm/flm install/opt/fastflowlm/flm-real
        mv install/opt/fastflowlm/flm-wrapper.sh install/opt/fastflowlm/flm
        chmod +x install/opt/fastflowlm/flm

        # Strip debug symbols to reduce binary size (111MB → 33MB)
        # --strip-debug removes debug info while keeping stack trace capability
        strip --strip-debug install/opt/fastflowlm/flm-real

    - name: Create portable tarball
      env:
        VERSION: ${{ steps.get_version.outputs.version }}
      run: |
        cd src/build/install/opt/fastflowlm
        tar czf $GITHUB_WORKSPACE/fastflowlm_${VERSION}_linux.tar.gz \
          flm \
          flm-real \
          lib/ \
          xclbins/ \
          model_list.json \
          model_info.json
        echo "Created tarball with symlinks preserved"
        # The default backend is XRT, so confirm libxrt is bundled.
        tar tzf $GITHUB_WORKSPACE/fastflowlm_${VERSION}_linux.tar.gz | grep libxrt

    - name: Upload portable build artifact
      uses: actions/upload-artifact@v4
      with:
        name: portable
        path: fastflowlm_${{ steps.get_version.outputs.version }}_linux.tar.gz
        retention-days: 7
        if-no-files-found: error

    - name: Build models from source
      run: |
        cd src
        cmake --preset linux-portable \
          -B build-models-from-source \
          -DFLM_BUILD_GEMMA4E=ON
        cmake --build build-models-from-source --parallel 2

    - name: Create models-from-source package
      env:
        VERSION: ${{ steps.get_version.outputs.version }}
      run: |
        cd src/build-models-from-source
        rm -rf install-models-from-source
        DESTDIR=$PWD/install-models-from-source cmake --install .

        package_root=install-models-from-source/opt/fastflowlm
        mv "${package_root}/flm" "${package_root}/flm-real"
        mv "${package_root}/flm-wrapper.sh" "${package_root}/flm"
        chmod +x "${package_root}/flm"
        strip --strip-debug "${package_root}/flm-real"

        staged_engine="${package_root}/lib/libgemma4e_npu.so"
        test -f "${staged_engine}"
        if cmp -s "$GITHUB_WORKSPACE/src/lib/xrt/libgemma4e_npu.so" "${staged_engine}"; then
          echo "The staged Gemma 4 engine matches the prebuilt library." >&2
          exit 1
        fi
        readelf -n "${staged_engine}" | grep -A1 'Build ID'
        tar czf "$GITHUB_WORKSPACE/models-from-source_fastflowlm_${VERSION}_linux.tar.gz" \
          -C "${package_root}" \
          flm \
          flm-real \
          lib/ \
          xclbins/ \
          model_list.json \
          model_info.json

    - name: Upload models-from-source build artifact
      uses: actions/upload-artifact@v4
      with:
        name: models-from-source-portable
        path: models-from-source_fastflowlm_${{ steps.get_version.outputs.version }}_linux.tar.gz
        retention-days: 7
        if-no-files-found: error

    - name: Collect FFmpeg logs
      if: always()
      shell: bash
      run: |
        set -euxo pipefail
        OUT="${RUNNER_TEMP}/ffmpeg-logs"
        mkdir -p "${OUT}"
        find "${GITHUB_WORKSPACE}" -type f \
          \( -name "configure.log" -o -name "build.log" -o -name "config.log" \) \
          -path "*/ffmpeg-build/*" \
          -print \
          -exec cp --parents {} "${OUT}" \; || true

    - name: Upload FFmpeg logs artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ffmpeg-logs-${{ github.job }}-run${{ github.run_number }}-attempt${{ github.run_attempt }}
        path: ${{ runner.temp }}/ffmpeg-logs
        if-no-files-found: warn
        retention-days: 14

  build-HRX-portable:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - distro: "debian"
            version: "13"

    container:
      image: ghcr.io/rocm/fastflowlm/build-environment:${{ matrix.distro }}${{ matrix.version }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Configure git safe directory
      run: git config --global --add safe.directory $(pwd)

    - name: Get version from git describe
      id: get_version
      run: |
        VERSION=$(git describe --tags --always | sed 's/^v//')
        echo "version=${VERSION}" >> $GITHUB_OUTPUT

    - name: Upgrade Rust toolchain
      run: |
        apt-get update
        apt-get install -y uuid-dev nasm patchelf zstd
        apt-get install -y --no-install-recommends curl ca-certificates
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
          sh -s -- -y --profile minimal --default-toolchain stable
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Fetch pinned HRX release
      id: hrx
      run: ./hrx-integration/fetch-hrx-release.sh

    - name: Build FLM HRX portable distribution
      run: |
        cd src
        cmake --preset linux-portable \
          -DFLM_USE_HRX=ON \
          -DCMAKE_PREFIX_PATH="${{ steps.hrx.outputs.prefix }}"
        cmake --build build -j$(nproc)

    - name: Create installation package
      run: |
        cd src/build
        DESTDIR=$PWD/install cmake --install .

        # Rename binary and wrapper for portable layout
        mv install/opt/fastflowlm/flm install/opt/fastflowlm/flm-real
        mv install/opt/fastflowlm/flm-wrapper.sh install/opt/fastflowlm/flm
        chmod +x install/opt/fastflowlm/flm

        # Strip debug symbols to reduce binary size (111MB → 33MB)
        # --strip-debug removes debug info while keeping stack trace capability
        strip --strip-debug install/opt/fastflowlm/flm-real

    - name: Create portable tarball
      env:
        VERSION: ${{ steps.get_version.outputs.version }}
      run: |
        cd src/build/install/opt/fastflowlm
        tar czf $GITHUB_WORKSPACE/HRX_fastflowlm_${VERSION}_linux.tar.gz \
          flm \
          flm-real \
          lib/ \
          xclbins/ \
          model_list.json \
          model_info.json
        echo "Created tarball with symlinks preserved"
        # This build selects the HRX backend, so confirm libhrx is bundled.
        tar tzf $GITHUB_WORKSPACE/HRX_fastflowlm_${VERSION}_linux.tar.gz | grep libhrx

    - name: Upload portable build artifact
      uses: actions/upload-artifact@v4
      with:
        name: HRX-portable
        path: HRX_fastflowlm_${{ steps.get_version.outputs.version }}_linux.tar.gz
        retention-days: 7
        if-no-files-found: error

    - name: Collect FFmpeg logs
      if: always()
      shell: bash
      run: |
        set -euxo pipefail
        OUT="${RUNNER_TEMP}/ffmpeg-logs"
        mkdir -p "${OUT}"
        find "${GITHUB_WORKSPACE}" -type f \
          \( -name "configure.log" -o -name "build.log" -o -name "config.log" \) \
          -path "*/ffmpeg-build/*" \
          -print \
          -exec cp --parents {} "${OUT}" \; || true

    - name: Upload FFmpeg logs artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ffmpeg-logs-${{ github.job }}-run${{ github.run_number }}-attempt${{ github.run_attempt }}
        path: ${{ runner.temp }}/ffmpeg-logs
        if-no-files-found: warn
        retention-days: 14

  test-summary:
    runs-on: ubuntu-latest
    needs: build-portable
    if: always()
    steps:
      - name: Summary
        run: |
          echo "# Portable Build Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ FLM built successfully with portable distribution" >> $GITHUB_STEP_SUMMARY
          echo "✅ FFmpeg statically linked (no external FFmpeg dependencies)" >> $GITHUB_STEP_SUMMARY
          echo "✅ XRT and XDNA plugin bundled with distribution" >> $GITHUB_STEP_SUMMARY
          echo "✅ FFTW (libfftw3) bundled with distribution" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Build Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **FFmpeg**: Statically linked (built from source)" >> $GITHUB_STEP_SUMMARY
          echo "- **XRT**: Dynamically linked, bundled in lib/" >> $GITHUB_STEP_SUMMARY
          echo "- **XDNA plugin**: Bundled in lib/" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Usage" >> $GITHUB_STEP_SUMMARY
          echo "The binary is portable and includes all necessary libraries in the lib/ directory." >> $GITHUB_STEP_SUMMARY
          echo "RPATH is set to \$ORIGIN/../lib for automatic library discovery." >> $GITHUB_STEP_SUMMARY

  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: build-portable
    if: github.ref_type == 'tag'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from git describe
        id: get_version
        run: |
          VERSION=$(git describe --tags --always | sed 's/^v//')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      # By name: this run also publishes the models-from-source and HRX
      # tarballs, and neither belongs in the default release asset set.
      - name: Download portable artifact
        uses: actions/download-artifact@v4
        with:
          name: portable
          path: portable

      - name: Upload Binaries to Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          file_glob: true
          file: portable/fastflowlm_*_linux.tar.gz

  # The HRX build ships as a preview, so it gets its own release job: a failed
  # HRX build leaves the release without the HRX asset instead of holding back
  # the default one.
  release-hrx:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: build-HRX-portable
    if: github.ref_type == 'tag'
    steps:
      - name: Download HRX portable artifact
        uses: actions/download-artifact@v4
        with:
          name: HRX-portable
          path: portable

      - name: Upload HRX Binaries to Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          file_glob: true
          file: portable/HRX_fastflowlm_*_linux.tar.gz
