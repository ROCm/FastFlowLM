# DMA page-translation probe for FastFlowLM#1080 (branch ci/win-dma-pages only, never merged).
# One DMA-only design (16 shim channel pairs relayed through the mem tiles, no core code) moves
# rows of 128 / 256 B one 4 KB page apart over 8 .. 1024 pages per channel, against a plain stream
# through the same pages. Several shards per OS land on different NPU runners; each logs its CPU,
# driver and page settings, so results compare within one chip. No deliberate hangs; ~1 min each.

name: dma pages probe

on:
  push:
    branches: [ci/win-dma-pages]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dma-pages
  cancel-in-progress: false

jobs:
  build-lin:
    name: Build Linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/rocm/fastflowlm/build-environment:ubuntu24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        shell: bash
        working-directory: ci/dma-pages
        run: |
          set -euo pipefail
          out=$GITHUB_WORKSPACE/dist
          mkdir -p "$out"
          g++-13 -std=c++17 -O2 -Wall probe.cpp -o "$out/probe" -lxrt_coreutil
          cp -r precompiled run.sh "$out/"
          x=$out/xrt/lib/x86_64-linux-gnu
          mkdir -p "$x"
          cp -a /usr/lib/x86_64-linux-gnu/libxrt*.so* /usr/lib/x86_64-linux-gnu/libboost_program_options.so* "$x/"
          dpkg-query -W libxrt-dev > "$out/xrt-version.txt" || true
          tar czf "$GITHUB_WORKSPACE/dma-pages-lin.tgz" -C "$out" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dma-pages-lin
          path: dma-pages-lin.tgz
          retention-days: 7

  build-win:
    name: Build Windows
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore build dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\dev
          key: windows-deps-${{ hashFiles('.github/script/ci/setup_windows_deps.ps1', '.github/windows-deps/**') }}
      - name: Set up build dependencies
        shell: powershell
        run: .github\script\ci\setup_windows_deps.ps1
      - name: Build
        shell: powershell
        working-directory: ci/dma-pages
        run: |
          $ErrorActionPreference = 'Stop'
          $b = "$env:RUNNER_TEMP\b"
          cmake -S . -B $b -A x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build $b --config Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $out = "$env:GITHUB_WORKSPACE\dist"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "$b\Release\probe.exe" $out
          Copy-Item -Recurse precompiled, run.ps1 $out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dma-pages-win
          path: dist
          retention-days: 7

  test-lin:
    name: NPU Linux ${{ matrix.shard }}
    needs: build-lin
    runs-on: [self-hosted, linux, x64, npu, sweep]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      DP: ${{ github.workspace }}/dma-pages
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dma-pages-lin
      - name: Probe
        shell: bash
        run: |
          set -uo pipefail
          rm -rf "$DP"; mkdir -p "$DP"; tar xzf dma-pages-lin.tgz -C "$DP"
          export XILINX_XRT=$DP/xrt LD_LIBRARY_PATH=$DP/xrt/lib/x86_64-linux-gnu
          mkdir -p "$DP/out"
          o=$DP/out/lin-$RUNNER_NAME.txt
          {
            echo "runner $RUNNER_NAME"
            echo "cpu $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2-)"
            echo "kernel $(uname -r), amdxdna $(cat /sys/module/amdxdna/version 2>/dev/null || echo in-tree)"
            echo "thp enabled: $(cat /sys/kernel/mm/transparent_hugepage/enabled)"
            echo "thp shmem_enabled: $(cat /sys/kernel/mm/transparent_hugepage/shmem_enabled)"
            echo "thp defrag: $(cat /sys/kernel/mm/transparent_hugepage/defrag)"
            echo "cmdline: $(cat /proc/cmdline)"
            cat "$DP/xrt-version.txt"
            pgrep -a -x 'flm|flm-real|stress.exe|host.exe|ovlp.exe' && echo "WARNING: other NPU processes" || true
            cd "$DP" && ./run.sh precompiled bo user4k user2m
          } 2>&1 | tee "$o"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: dma-pages-lin-${{ matrix.shard }}
          path: ${{ env.DP }}/out
          retention-days: 14

  test-win:
    name: NPU Windows ${{ matrix.shard }}
    needs: build-win
    runs-on: [self-hosted, windows, x64, npu, sweep]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dma-pages-win
          path: dma-pages
      - name: Probe
        shell: powershell
        working-directory: dma-pages
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $o = "out\win-$env:RUNNER_NAME.txt"
          & {
            Write-Output "runner $env:RUNNER_NAME"
            Write-Output "cpu $((Get-CimInstance Win32_Processor).Name)"
            Write-Output "os $((Get-CimInstance Win32_OperatingSystem).Version)"
            Get-CimInstance Win32_PnPSignedDriver | Where-Object { $_.DeviceName -match 'NPU' } |
              ForEach-Object { Write-Output "$($_.DeviceName): driver $($_.DriverVersion)" }
            Get-Item C:\Windows\System32\xrt_coreutil.dll | ForEach-Object { Write-Output "xrt_coreutil $($_.VersionInfo.FileVersion)" }
            whoami /priv | Select-String SeLockMemoryPrivilege | ForEach-Object { Write-Output "$_" }
            $p = Get-Process -Name flm*, stress, host -ErrorAction SilentlyContinue
            if ($p) { Write-Output "WARNING: other NPU processes: $($p.Name -join ' ')" }
            & .\run.ps1 -Exe .\probe.exe -Build precompiled -Backing bo, user4k, user2m
          } 2>&1 | Tee-Object -FilePath $o
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: dma-pages-win-${{ matrix.shard }}
          path: dma-pages/out
          retention-days: 14
