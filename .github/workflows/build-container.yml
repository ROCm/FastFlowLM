name: Publish Containers

on:
  schedule:
    - cron: '0 2 * * *'  # Nightly at 2 AM UTC
  workflow_dispatch:

jobs:
  build-container:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - release: "24.04"
            ubuntu_ppa: "ppa:lemonade-team/stable"
            distro: "ubuntu"
            backports: ""
          - release: "25.10"
            ubuntu_ppa: "ppa:lemonade-team/stable"
            distro: "ubuntu"
            backports: ""
          - release: "26.04"
            ubuntu_ppa: ""
            distro: "ubuntu"
            backports: ""
          - release: "13"
            distro: "debian"
            ubuntu_ppa: ""
            backports: "trixie-backports"

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/rocm/fastflowlm/build-environment
          tags: |
            type=raw,value=${{ matrix.distro }}${{ matrix.release }}
            type=raw,value=latest,enable=${{ matrix.release == '26.04' }}
            type=raw,value=nightly,enable=${{ matrix.release == '26.04' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            BASE_IMAGE=${{ matrix.distro }}:${{ matrix.release }}
            UBUNTU_PPA=${{ matrix.ubuntu_ppa }}
            BACKPORTS=${{ matrix.backports }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
