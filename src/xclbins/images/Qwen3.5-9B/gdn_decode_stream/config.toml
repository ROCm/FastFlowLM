# config/gdn_decode_stream.toml -- the gdn_decode numbers of Qwen3.5-9B (decode gated DeltaNet, one call a linear layer).

# Hidden size (hidden_size): K of the a / b projections.
D = 4096

# linear_num_value_heads, linear_num_key_heads.
V_HEADS = 32
QK_HEADS = 16

# linear_key_head_dim, linear_value_head_dim.
DK = 128
DV = 128

# linear_conv_kernel_dim.
TAPS = 4

# Epsilon of the q / k l2norm and of the gated RMSNorm (rms_norm_eps).
L2_EPS = 1e-6
RN_EPS = 1e-6
