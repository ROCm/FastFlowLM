# config/attn_fused.toml -- the attn_fused numbers of Qwen3.6-35B-A3B.
#
# make copy builds the op attn_fused with this file. The keys are the keys of
# the op's default config (attn_fused/config.toml in the kernel tree).

# Dimension of a head (head_dim).
HEAD_DIM = 256

# Query heads (num_attention_heads).
Q_HEADS = 16

# Key / value heads (num_key_value_heads).
KV_HEADS = 2

# Dimensions of a head that get the rope (partial_rotary_factor x head_dim).
ROPE_DIM = 64

# Epsilon of the q / k norm (rms_norm_eps).
EPS = 1e-6
