# config/attn.toml -- the attn numbers of Qwen3.6-35B-A3B.
#
# make copy builds the op attn with this file. The keys are the keys of the
# op's default config (attn/config.toml in the kernel tree). The engine does
# not call attn (attn_fused replaces it); its tests do.

# Dimension of a head (head_dim).
HEAD_DIM = 256

# Query heads (num_attention_heads).
Q_HEADS = 16

# Key / value heads (num_key_value_heads).
KV_HEADS = 2
