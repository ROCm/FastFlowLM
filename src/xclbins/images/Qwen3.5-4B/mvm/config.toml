# config/Qwen3.5-4B/mvm.toml -- the mvm numbers of Qwen3.5-4B (decode projections, norms folded in).
# make copy builds the op mvm with this file (keys: mvm/config.toml in the kernel tree).

# Hidden size (hidden_size): K of norm mode.
D = 2560

# The largest K of a decode projection: intermediate_size, the input of down.
K_MAX = 9216

# Epsilon of the RMS norm in norm mode (rms_norm_eps).
EPS = 1e-6
