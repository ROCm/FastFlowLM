# config/mvm.toml -- the mvm numbers of Qwen3.5-4B.
#
# make copy builds the op mvm with this file. The keys are the keys of the
# op's default config (mvm/config.toml in the kernel tree).

# Hidden size (hidden_size): K of norm mode.
D = 2560

# The largest K of a decode projection: intermediate_size, the input of the
# MLP's down.
K_MAX = 9216

# Epsilon of the RMS norm in norm mode (rms_norm_eps).
EPS = 1e-6
