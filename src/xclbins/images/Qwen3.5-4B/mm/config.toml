# config/mm.toml -- the mm numbers of Qwen3.5-4B.
#
# make copy builds the op mm with this file. The keys are the keys of the
# op's default config (mm/config.toml in the kernel tree).

# Hidden size (hidden_size): K of mm, mm_cols, mm_glu and mm_glu_cols.
D = 2560

# Input of out_proj and o_proj (linear_num_value_heads x linear_value_head_dim
# = num_attention_heads x head_dim): K of mm_k4096.
V_DIM = 4096

# Expert intermediate size (moe_intermediate_size): K of mm_k512 and
# mm_k512_cols.
# Qwen3.5-4B: not used (the MLP's down, K 9216, runs on dqmm: mm_k512 keeps K in
# the mem tile). The default value keeps mm_k512 small.
MOE_I = 512
