# config/conv1d.toml -- the conv1d numbers of Qwen3.5-4B.
#
# make copy builds the op conv1d with this file. The keys are the keys of the
# op's default config (conv1d/config.toml in the kernel tree).

# Channels of the conv: q | k | v of the linear attention
# (2 x linear_num_key_heads x linear_key_head_dim
#  + linear_num_value_heads x linear_value_head_dim).
D = 8192

# Taps of the conv (linear_conv_kernel_dim).
TAPS = 4
